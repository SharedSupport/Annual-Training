# Extract the binder in CI and publish the result to the `binder-content` branch.
#
# The binder zip is too big to attach in chat or upload through GitHub's web
# UI, and Claude Code sessions can't reach SharePoint or Blob storage. GitHub's
# runners can. This workflow downloads the zip from the BINDER_ZIP_URL secret,
# runs extract_binder.py, does a trial build with build_site.py, and pushes
# content/content.json plus both logs to an orphan branch called
# `binder-content`. A session can then `git fetch origin binder-content`.
#
# Run it from the Actions tab (Run workflow). Secret to add:
#   BINDER_ZIP_URL   private download link to the binder zip. A SharePoint
#                    "anyone with the link" share with "&download=1" appended
#                    usually works; a Blob SAS link always does.
name: Extract binder content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      BINDER_ZIP_URL: ${{ secrets.BINDER_ZIP_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Download the binder zip
        run: |
          test -n "$BINDER_ZIP_URL" || { echo "::error::BINDER_ZIP_URL secret is not set"; exit 1; }
          curl -fsSL -o binder.zip "$BINDER_ZIP_URL"
          ls -l binder.zip
          if ! unzip -tq binder.zip >/dev/null 2>&1; then
            echo "::error::download is not a zip (first bytes: $(head -c 120 binder.zip | tr -d '\n'))"
            echo "If it is HTML, the share isn't 'anyone with the link', or the link needs &download=1"
            exit 1
          fi

      - name: Unpack and locate the binder folder
        id: binder
        run: |
          mkdir -p source && unzip -q binder.zip -d source
          dir=$(find source -maxdepth 3 -type d -name "Annual Training - Paper Binder" | head -1)
          if [ -z "$dir" ] && [ -d "source/1 - DRC Policies" ]; then dir=source; fi
          test -n "$dir" || { echo "::error::couldn't find 'Annual Training - Paper Binder' or the numbered folders in the zip"; find source -maxdepth 2 | head -40; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "binder at: $dir"; find "$dir" -name "*.pdf" | wc -l

      - name: Extract content
        run: |
          mkdir -p content
          python extract_binder.py "${{ steps.binder.outputs.dir }}" --out content 2>&1 | tee content/extract.log

      - name: Trial build of the site
        run: python build_site.py --source "${{ steps.binder.outputs.dir }}" 2>&1 | tee content/build.log

      - name: Publish content to the binder-content branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          src_sha=$(git rev-parse --short HEAD)
          git checkout --orphan binder-content
          git rm -rfq --cached .
          git add -f content/content.json content/extract.log content/build.log
          git commit -qm "Binder content extracted from source at $src_sha ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push --force origin binder-content
          echo "pushed binder-content"

      - name: Summary
        run: |
          { echo "## Extraction"; echo '```'; cat content/extract.log; echo '```';
            echo "## Trial build"; echo '```'; cat content/build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
