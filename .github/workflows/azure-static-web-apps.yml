# Build the digital binder and deploy it to Azure Static Web Apps.
#
# Secrets to add under Settings > Secrets and variables > Actions:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  deployment token from the Static Web App's
#                                    Overview > Manage deployment token
#   BINDER_ZIP_URL   (optional)      a private URL (for example a Blob SAS link)
#                                    to the "Annual Training - Paper Binder" zip.
#                                    With it the site is built from the real
#                                    binder: full text, print packets, PDFs and
#                                    page images. Without it the build falls
#                                    back to the text embedded in the prototype.
#
# Create the Static Web App in the portal with deployment source "Other" so it
# doesn't generate its own workflow, then paste the token here.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      BINDER_ZIP_URL: ${{ secrets.BINDER_ZIP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Fetch the binder (when BINDER_ZIP_URL is set)
        if: ${{ env.BINDER_ZIP_URL != '' }}
        id: binder
        run: |
          curl -fsSL "$BINDER_ZIP_URL" -o binder.zip
          unzip -tq binder.zip >/dev/null || { echo "::error::download is not a zip; check the share is 'anyone with the link' and ends with &download=1"; exit 1; }
          mkdir -p source && unzip -q binder.zip -d source
          dir=$(find source -maxdepth 3 -type d -name "Annual Training - Paper Binder" | head -1)
          if [ -z "$dir" ] && [ -d "source/1 - DRC Policies" ]; then dir=source; fi
          test -n "$dir" || { echo "::error::couldn't find the binder folder in the zip"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Extract content from the binder
        if: ${{ env.BINDER_ZIP_URL != '' }}
        run: python extract_binder.py "${{ steps.binder.outputs.dir }}" --out content

      - name: Recover content from the prototype (no binder available)
        if: ${{ env.BINDER_ZIP_URL == '' }}
        run: python content_from_prototype.py

      - name: Build the site
        run: |
          if [ -n "$BINDER_ZIP_URL" ]; then
            python build_site.py --source "${{ steps.binder.outputs.dir }}"
          else
            python build_site.py
          fi

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          output_location: ""
