# Build the digital binder and deploy it to Azure Static Web Apps.
#
# Secrets to add under Settings > Secrets and variables > Actions:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  deployment token from the Static Web App's
#                                    Overview > Manage deployment token
#   BINDER_ZIP_URL   (optional)      private download link to the binder zip.
#                                    With it the site is built from the real
#                                    binder; without it, from the text embedded
#                                    in the prototype.
#
# Create the Static Web App in the portal with deployment source "Other" so it
# doesn't generate its own workflow, then paste the token here. Runs only on
# demand until the app exists; the site is on GitHub Pages meanwhile.
name: Deploy to Azure Static Web Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-site
        with:
          base: "/"
          binder_zip_url: ${{ secrets.BINDER_ZIP_URL }}
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          output_location: ""
