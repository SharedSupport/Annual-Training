# Build the digital binder and publish it to GitHub Pages at
# https://sharedsupport.github.io/Annual-Training/
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Deploys on every push to the working branch (the repository's default) or main.
# Secret BINDER_ZIP_URL (already set) makes the build use the real binder.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/annual-training-content-page-ovwlxt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Make sure Pages is enabled for this repository
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: ./.github/actions/build-site
        with:
          base: "/${{ github.event.repository.name }}/"
          binder_zip_url: ${{ secrets.BINDER_ZIP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
