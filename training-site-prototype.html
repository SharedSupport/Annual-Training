ailure on the part of the service provider to support an individual to attend or schedule medical appointments or to maintain medical equipment. Missing/Theft of Medications.  Missing medications without explanation or theft of medications. Misuse/Theft of Funds.  The illegal or improper act or process of a person using the funds of an individual for his or her own personal benefit or gain. This includes misuse or mismanagement by a representative payee or other responsible party, theft of money, SNAP benefits or soliciting monetary gifts from an individual. Room and Board. Requiring an individual to pay for items that are covered as part of room and board charges, charging more than allowable rates for room and board or charging for a service or support that is included in a rate for which a provider is or will be reimbursed.  This includes any situation in which the individual is required to pay for the same item/service twice.  Examples of items that are covered as part of the room and board residency agreement include, but are not limited to: o Standard toiletries including shampoo, deodorant, soap, toothpaste, etc. o Utility costs, including trash removal, lawn care and snow removal. Household furniture. o Basic linens including blankets, towels, washcloths, sheets and pillowcases. o Cleaning, laundry and other household supplies. o One telephone with local telephone service. o Internet service. o Food choices of the individual, with consideration of the food cost and nutrition, including o the individual\u2019s preference, culture, religion and beliefs, and an individual\u2019s prescribed diet, if the prescribed diet is not covered by the individual\u2019s health care plan or another funding source.  Prescribed dietary items necessary for individuals basic health and 4 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 nutrition include but are not limited to 1) products used to thicken liquids/foods; 2) phenylketonuria (PKU) diet foods; 3) meal replacement shakes and snacks; 4) diabetic diet foods. o Laundry of towels, bedding and the individual\u2019s clothing. o Lawn care, food preparation, maintenance and housekeeping, including staff wages and benefits to perform these tasks. o Meals provided away from the residential service location that are arranged by a staff person in lieu of meals provided in the residential service location. o Incontinence products, if the incontinence product is not covered by the individual\u2019s health care plan or another funding source. o Building and equipment repair, renovation and depreciation. o Rent, taxes and property insurance. o Unpaid Labor.  The illegal or improper act or process of a person who is using an individual to perform unpaid labor that would otherwise be compensated in a manner consistent with labor laws. 5. FIRE. A situation that requires fire personnel or other safety personnel to extinguish a fire, clear smoke from the premises, etc. While not required, it is strongly recommended by ODP that situations in which staff extinguishes small fires without the involvement of fire personnel be reported. o Fire with Property Damage. The fire causes property damage that may or may not make the premises uninhabitable. o Fire without Property Damage.  The fire does not cause property damage and may or may not result in premises being uninhabitable. 6. LAW ENFORCEMENT ACTIVITY.  Law enforcement activity that occurs during the provision of service or for which an individual is the subject of a law enforcement investigation that may lead to criminal charges against the individual. This includes law enforcement responding to a possible crime when an individual is in the community or in a vehicle. o Individual Charged with a Crime/Under Police Investigation.  When an individual is formally charged with a crime by the police or when an individual is informed, he or she is suspected of committing a crime, and charges may be forthcoming.  All charges or suspected charges related to a Behavioral Health Crisis Event should be reported as such and not as law enforcement activity. o Licensed Service Location Crime.  A crime such as vandalism, break-ins, threats, or actual occurrences of acts that may result in harm, etc. that occur at a Shared Support service location. 7. MISSING INDIVIDUAL. An individual is considered missing when they are out of contact for more than 24 hours without prior arrangement or the individual is in immediate jeopardy when missing for any period. Based on an individual\u2019s history, safety skills, and familiarity with the area, an individual may be considered in jeopardy before 24 hours elapse. In addition, when police are contacted about a missing individual or the police independently find and return an individual, this is a reportable incident regardless of the amount of time an individual has been missing. o In Jeopardy. The unexpected or risky absence of any duration for an individual whose absence constitutes an immediate danger to the individual or others. 8. NEGLECT. The failure to obtain or provide the needed services and supports defined as necessary or otherwise required by law, regulation, policy or plan (ISP, Behavior Support Plan, safety plan, etc.). This includes acts that are intentional or unintentional regardless of the obvious occurrence of harm. o Failure to Provide Medication Management. An event that may cause harm or lead to inappropriate medication use while the medication is in the control of the person(s) charged with administration. Incidents of this nature include when harm occurs to the individual, the 5 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 medication error occurs over more than one consecutive administration or an individual receives medication intended for another individual. Incidents of this type include but are not limited to a: 1) failure to administer medications via the correct route; 2) failure to implement medication changes in a timely manner; 3) failure to obtain medications from the pharmacy. o Failure to Provide Needed Care.  The failure to obtain or provide the needed services and supports. This includes, but is not limited to: 1) failure to implement medical, social, behavioral and restrictive procedures as outlined in the ISP; 2) failure to provide needed care such as food, clothing, personal hygiene, prompt and adequate medical care, emergency services and other basic treatment and necessities needed for development of physical, intellectual, emotional capacity and well-being; 3) failure to obtain, keep in working order or arrange for repair or replacement of equipment such as glasses, dentures, hearing aids, walkers, wheelchairs, etc.; 4) failure to intercede on behalf of the individual with regards to reporting or acting or changes to healthcare needs or failure to ensure medical equipment is repaired or replaced as needed. o Failure to Provide Needed Supervision. The failure to provide attention and supervision, including leaving individuals unattended. This is based upon the supervision care needs in the ISP or recommendations or requirements from a court of law or as a condition of probation/parole. o Failure to Provide Protection from Hazards. The failure to protect an individual from health and safety hazards as part of routine care, service provision or as outlined in the ISP. Examples of failure to provide protection from health and safety hazards include, but are not limited to: 1) failure to prepare and serve food required by an individual\u2019s medical diagnosis; 2) failure to provide protections from poisonous materials; 3) failure to provide shelter and basic utilities; 4) failure to provide basic protections from environmental hazards such as exposure to the sun, extreme elements and other weather-related conditions; 5) failure to regulate water temperatures; 6) failure to provide protection from hazardous activities such as the manufacture, distribution, exposure to and use of illegal drugs. o Moving Violation.  Any staff or volunteer receiving a moving violation citation during the provision of services to an individual regardless if operating an entity\u2019s vehicle or personal vehicle. 9. PASSIVE NEGLECT. The inability to provide supports due to environmental factors which are beyond the control of an unpaid caregiver because of lack of experience, information, resources or ability. Passive neglect is reportable if there are no current risk mitigation strategies in the ISP that specifically address the area of passive neglect. . o Inability to Provide Medical/Personal Care.  The inability of an unpaid caregiver to provide adequate medical or personal care due to lack of education, training, resources or the physical ability of the caregiver to perform such tasks. This includes the inability to obtain or maintain communication devices, mobility aides and other durable medical equipment. o Inability to Provide Necessities. The inability of an unpaid caregiver to provide food, clothing, adequate housing, utilities or other basic necessities that are essential to maintain the health and safety of an individual. 10. RIGHTS VIOLATION. An unauthorized act which improperly restricts or denies the human or civil rights of an individual, including those rights which are specifically mandated under applicable law, regulation, policy or plan. This includes acts that are intentional or unintentional regardless of the obvious occurrence of harm. o Civil/Legal. Any violation of civil or legal rights afforded by law. This includes the right to vote, speak freely, practice religious choice, access law enforcement and legal services, as well as participate in local, state or national government activities. o Communication.  The failure to support an individual to communicate at all times. This includes a failure to obtain needed communication evaluations, assistive devices or service; provide communication support; or maintain communication devices in working order. Communication 6 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 includes but is not limited to 1) display of texts in fonts and sizes that meet communication needs; 2) access to sign language interpreters; 3) access to translation to preferred languages; 3) access to persons that can facilitate an individual\u2019s unique communication style; 4) access to braille materials and other tactile communication assistance: 5) access to plain-language materials. o Health. The failure to support choice and opportunity related to health care.  This includes failure to inform and educate an individual about physical or behavioral health evaluations and assessments, changes in health status, diagnosis information, test results, medications, treatment options, etc.  This also includes the denial of the right of an individual to make informed health care decisions. o Privacy. Any violation of an individual\u2019s safely exercised choice to be free from being observed or disturbed by others. This includes an individual\u2019s choice to maintain the privacy of his or her physical person, living area, possessions, electronic social media (emails, posts on the internet, accounts, content or any similar items), communication with others whether in face to face meetings, phone email, physical mail or any other correspondence, use of image or likeness without the expressed consent of the individual (includes videos or photos taken of the individual for promotional, marketing or any other purposes), or any similar area where a reasonable expectation of privacy exists. o Services. Any violation of an individual\u2019s right to control services received.  This includes when an individual refuses to participate in, voices a concern about or wants to make a change to a service, and the ISP team does not address these choices.  Individuals have the right to participate in the development and implementation of their ISPs and can choose where, when and how to receive needed services.  This also includes the right to control specific schedules and activities related to services. o Unauthorized Restrictive Procedure. Any restrictive procedure (other than a physical, chemical or mechanical restraint) that does not follow ODP\u2019s guidelines related to restrictive procedures or is prohibited by ODP.  Restrictive procedures limit an individual\u2019s movement, activity or function; interfere with the individual\u2019s ability to acquire positive reinforcement; result in the loss of objects or activities that an individual values; or require an individual to engage in a behavior in which, given the freedom of choice, the individual would not engage. 11. SELF NEGLECT. An action or lack of action by an individual that results in the individual denying himself or herself proper care, supports and services.  Self-neglect is reportable if there are no current risk mitigation strategies in the ISP that specifically address the area of self-neglect. o Environmental. Hazardous or unsafe living conditions (i.e., improper wiring, no indoor plumbing, no heat, no running water, hoarding conditions, unsanitary or unclean living quarters such as animal or insect infestation, no functioning toilet, fecal or urine odors or grossly inadequate housing or homelessness). o Medical. The refusal by an individual to take medications on a regular basis; ignoring acute or chronic health or medical problems; refusal to obtain, use or maintain prescribed medical devices (i.e., eyeglasses, hearing aids, dentures) needed to maintain health and safety. o Personal Care/Nutrition.  Refusal to consistently wear or obtain appropriate or adequate clothing for activities or weather conditions, refusal to maintain proper hygiene that presents a serious risk to health or safety or refusal to maintain a proper diet which may lead to malnutrition, illness or dehydration. o Other. Other forms of self-neglect may include refusing to accept services or supports that are essential to maintain health and safety. 12. SERIOUS ILLNESS. A physical illness, disease or period of sickness that requires hospitalization.  This includes an elective surgery that requires a hospitalization. o Chronic/Recurring. An illness, condition or disease that is persistent or otherwise long-lasting in its effects for which an individual has had previous treatment or diagnosis. 7 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 o New. An acute illness, condition or disease for which an individual has not previously received treatment.  This includes acute illnesses, conditions or diseases that may become chronic in the future. 13. SERIOUS INJURY. Any injury that requires treatment beyond first aid.  This includes injuries that receive an assessment or treatment at an emergency room, urgent care center, primary care physician office, etc. or that require hospitalization. Assessment by emergency medical services that did not require a visit to one of the previously listed locations for treatment is not reportable.  Serious injuries that are treated by a medical professional (i.e., doctor, nurse, etc. that is used by the organization) on-site are reportable. Examples include, but are not limited to: Fractures Dislocations Burns Electric shock Loss or tearing of body parts. Eye emergencies Ingestion of toxic substance. Head injuries from accidents, falls or blows to the head. Any injury with loss of consciousness. Medical equipment malfunction or damage that requires immediate intervention. Lacerations requiring stitches, staples or sutures to close. Choking.  When food or other items become lodged in the back of the throat and the cause is not o attributed to neglect.  Choking incidents are only reportable when they require interventions, such as back blows, abdominal thrusts or the Heimlich Maneuver. o Injury Accidental. Injury (other than self-inflicted) with a known cause at the time of the report. o Injury Self-Inflicted.  Injury with a known cause at the time of the report that can be attributed to an intentional action of an individual to cause harm upon himself or herself. o Injury Unexplained. An injury with no known cause at the time of the report. o Medical Equipment Failure/Malfunction. Any medical equipment failure or malfunction that requires intervention by a medical professional. This does not include routine maintenance or care of medical equipment. o Pressure Injury (decubiti, pressure ulcer, pressure sore, bedsore). Injuries to skin and underlying tissue resulting from prolonged pressure on the skin, regardless of stage and including an injury that is unstageable.  This includes initial diagnoses, newly affected areas of the body, as well as diagnosis that becomes worse over time. 14. SEXUAL ABUSE. Any attempted or completed nonconsensual sexual act. This act may be physical or non- physical and achieved by force, threats, bribes, manipulation, pressure, tricks, violence or against an individual who is unable to consent or refuse.  Sexual abuse includes any act or attempted act that is sexual in nature between a paid service provider staff and an individual regardless of consent on the part of the individual. Examples of methods used to commit sexual abuse include, but are not limited to: Use of intimidation or threat of physical force toward an individual in order to gain compliance with a sexual act (i.e., pinning the victim down, assaulting the victim). Administering alcohol or drugs to an individual in order to gain compliance with a sexual act (i.e., drink spiking). Taking advantage of an individual who is unable to provide consent due to intoxication or incapacitation from voluntary consumption of alcohol, recreational drugs or medication. Exploitation of vulnerability (i.e., immigration status, disability, undisclosed sexual orientation, age). Misuse of authority (i.e., using one\u2019s position or power to coerce or force a person to engage in sexual activity). 8 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 Economic coercion, such as bartering of sex for basic goods like housing, employment/wages, immigration papers or childcare. Degradation, such as insulting or humiliating an individual. Fraud, such as lies or misrepresentation of a target\u2019s identity. Continual verbal pressure, such as when an individual is being worn down by someone who repeatedly asks for sex or, for example, by someone who complains that the individual does not love them enough. False promises by the target (i.e., promising marriage, promising to stay in the relationship, etc.). Grooming and other tactics to gain an individual\u2019s trust. Control of an individual\u2019s sexual behavior/sexuality through threats, reprisals, threats to transmit sexually transmitted infections (STIs), threats to force pregnancy, etc. o Rape. The penetration, no matter how slight, of the vagina or anus with any body part or object, or oral penetration by a sex organ of another person, without the consent of an individual. This includes when an individual was made, or there was an attempt to make the individual, penetrate another person (including the target). o Sexual Harassment.  Sexual advances that do not involve physical contact between an individual and a target. This type of sexual abuse can occur in many different venues (i.e., home, school, workplace, in public or through technology). Examples include, but are not limited to: Sending unwanted sexually explicit photographs. Use of inappropriate sexual remarks or language. Unwanted exposure to sexual situations \u2013 pornography, voyeurism, exhibitionist. Threats of sexual abuse to accomplish some other end, such as threatening to rape an individual if he or she does not give the target money. Threatening to spread sexual rumors if the individual does not have sex with the target. Unwanted filming, taking or disseminating photographs of a sexual nature of an individual (in any medium to include, but not limited to, social media, personal computers, cell phones, etc.). Exposure to unwanted sexual materials (pornography). Unwanted Sexual Contact. Intentional touching or molesting, either directly or through the o clothing, of the genitalia, anus, groin, breast, inner thigh, buttocks or any other body part without consent. This includes making an individual touch or molest another person (including the target). o Other. Any sexual abuse of an unknown type at the time of the report or sexual abuse that does not conform to other secondary category options. 15. SITE CLOSURE. The emergency closure of a licensed or provider operated service location for one (1) or more days.  This is reported as a site incident report and does not apply to individuals who reside in homes owned, rented or leased solely by the individual or family member. o Infestation. The closure of a site due to the need to treat for animal, insect or other pests. o Loss of Utilities. The closure of a site due to loss of utility that was not related to a failure on the part of the operation entity.  This includes electrical outages, issues with water or sewer systems and heating or cooling system failures. o Natural Disaster/Weather Related.  The closure of a site due to a natural disaster or weather conditions. o Structural. The closure of a site due to structural issues. o Other.  The closure of a site due to a reason other than infestation, loss of utilities, natural disaster or weather related or structural issue. 16. SUICIDE ATTEMPT. The intentional and voluntary attempt to take one\u2019s own life. A suicide attempt is limited to the actual occurrence of an act and does include suicidal threats or ideation. If medical treatment was sought after a suicide attempt, it should be reported under suicide attempt as a primary category in all cases, and not as serious injury or illness. 9 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 o Injury/Illness that Requires Medical Intervention. An individual sustained an injury or became ill due to a suicide attempt and required medical treatment beyond basic first aid. o No Injury/Illness that Requires Medical Intervention.  An individual did not sustain an injury or become ill due to a suicide attempt and did not require medical treatment beyond first aid. B. The following incidents are to be reported within 72 hours: 1. Physical Restraint.  A physical hands-on method that restricts, immobilizes or reduces an individual\u2019s ability to move his or her arms, legs, head or other body parts freely.  A physical restraint may only be used in the care of an emergency to prevent an individual from immediate physical harm to herself or himself or others.  Restraints that are permitted by ODP policies and procedures, regulations or laws are to be reported as physical restraints.  All other restraints shall be reported as abuse. o Human Rights Team Approved Restrictive Intervention. Any physical restraint that is applied in an emergency situation that is part of an approved ISP that contains a restrictive procedure. o Provider Emergency Protocol. Any physical restraint that is applied in an emergency situation that is part of the provider emergency restraint protocol. This restraint is not part of an individual approved ISP that contains a restrictive procedure. 2. Medication Error.  Any practice that does not comply with the \u201cRights of Medication Administration\u201d as described in the ODP Medication Administration Training Course.  A medication error occurring during a time when an unpaid caregiver is responsible for the administration of medication is reportable. An individual\u2019s refusal to take medication is reportable as a medication error. o Wrong Medication.  Individual is given a medication that the individual is not prescribed or has been discontinued, or the individual was given medication that was supposed to be given for another reason. o Wrong Dose. Individual is given too much or too little medication during a scheduled administration. o Wrong Time. Individual is given medication too early or too late as defined by the range of allowable administration time (reportable if medication is given in excess of one hour either prior or later than the prescribed administration time). o Wrong Route. Individual is given medication in a different way from the one specified on the label. o Wrong Form. Individual is given medication in a different type from the one prescribed. o Wrong Position. Individual is not positioned correctly to receive the medication. o Wrong Technique/Method. Medication is prepared for administration improperly. o Omission. An administration of medication fails to occur. o Wrong Person. An individual is given another individual\u2019s medication. C. Incidents to be Reported When Directed. ODP will provide specific guidance and direction on what to report, as well as the timelines to report, related to the following emergencies: o Declared Emergency. An event, such as an occurrence of a natural catastrophe, technological accident or human-caused event that has resulted in, or could potentially cause, severe property damage, deaths and/or multiple injuries such as, but not limited to, public health emergencies, emergency declarations, major declarations, etc.  A Declared Emergency is declared by the Federal, State, County or Municipal officials. o Public Health Emergency. An event such as a disease or natural disaster that causes, or has the potential to cause, harm to a significant number of individuals and is declared as a Public Health Emergency by Federal or State officials. Public Health Emergencies are to be reported within timeframes that are specified to the nature of the event and as directed by ODP. Outbreaks. The occurrence of disease cases in excess of normal expectancy. The number of cases varies according to the disease-causing agent, and the size and type of previous and existing exposure to the agent. 10 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 Epidemic.  A disease that affects a large number of people within a community, population or region. Pandemic.  A disease that affects a large number of people that is spread over multiple countries or continents. Natural Disasters.  An event such as a flood, earthquake, storms, hurricanes, tornados, blizzards, etc. Bio-Terrorist Attacks.  The intentional release or dissemination of biological agents. These agents are bacteria, viruses, insects, fungi or toxins and may be in a naturally occurring or a human-modified form. and ODP Announcement 20-065: Clarification of Reporting Cases of COVID-19.   The following COVID-19 circumstances require the filing of a report in EIM \u2013 Emergency Room Visit- Illness New: An individual was administered a COVID-19 virus test due to the presence of symptoms and is awaiting results. An individual was administered a COVID-19 virus test that indicated a positive result. An individual was diagnosed with COVID-19 virus by a health care practitioner, regardless of testing. *Tests administered at a site other than the ER (i.e., drive through test, primary care physician, etc.) are reported using the primary category of Emergency Room Visit \u2013 Illness New. An EIM report is not required when an individual displays symptoms but is not referred for testing and not given the diagnosis of COVID-19 by a health care practitioner.  A report is also not required when an individual displays symptoms and is sent home with a recommendation for quarantine/self-quarantine. C.  Reporting Format 1. All incidents, including alleged incidents and suspected incidents, will be reported and submitted via EIM by a designated agency point person within the appropriate time frames, either 24 hours or 72 hours depending upon the category of the incident as defined in this policy. a. If point person is unable to access EIM due to technical issues, a written incident report will be faxed to the appropriate regional ODP office within the designated timeframes. (See attachment A) b. The EIM report will then be entered and submitted as soon as EIM is available. 2. Appropriate county representative(s) will be notified of the incident within the specified time frame, either 24 hours or 72 hours depending upon the category of the incident as defined in this policy. 3. Family members or guardian will be contacted as designated in the individual\u2019s plan.  If the person requests that family members not be notified, this will be noted in the EIM report. 4. If investigation is required, point person will notify appropriate agency personnel and a certified investigator will be assigned. 5. The final section of the standardized incident report, those used for incidents reportable within 24 hours, will be completed within 30 days.  This includes the investigation summary of any incident that requires an investigation.  If the incident report cannot be finalized within 30 days, an extension will be requested via EIM to the county and regional office of ODP prior to the expiration of the 30-day period. 6. A review will occur to ensure the following occurred and will be included in the EIM report: a. Documentation that the health, safety and rights of the individual were protected upon discovery of the incident. b. Correct incident category was chosen \u2013 service location, provider type and service delivery model are correct. c. The description of the incident is correct and clearly written with details to describe the event. d. An investigation occurred when required - the results of the incident investigation. e. Target(s) identified per the bulletin. f. No identifying information of another individual is included in the report. 11 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 g. Corrective actions taken including appropriate safeguards to reduce reoccurrence; discharge and follow up instructions related to any medical services is included in an incident involving medical care; dates any actions were implemented or planned to be implemented. h. Staff responsible for follow actions is noted. i. All required notifications were made. j. Specific information regarding disciplinary actions taken with staff to assure the health and welfare of individuals. k. An administrative review of the investigation occurred (separate review document is maintained \u2013 see attachment B) and includes a review to ensure the CI has included enough detail to explain their investigation process and an analysis to determine the cause of the incident, if confirmed. 7. Initial Reporter\u2019s responsibilities are as follows (when the initial reporter a staff or volunteer at SSI): a. Respond to the situation by taking immediate action to protect the individual\u2019s health, safety and rights. b. Report to program leadership or contact on-call agency (point person) to report incident as soon as possible following incident but no later than 24 hours from the time of the incident or the time of discovery. c. Document observations about the incident in a narrative report. d. Comply with the applicable laws and regulations for incidents of alleged abuse, neglect and exploitation. 8. Point Person\u2019s responsibilities are as follows: a. First confirm that appropriate actions have been taken or order additional actions to secure the health, safety, rights and well-being of the individual involved in the incident. (55 Pa. Code \u00a7\u00a7 6100.402, 6400.18, 6500.20). b. Offer victim\u2019s assistance and make referral and offer support to access services if interest is expressed. c. If the incident involves abuse, suspected abuse, or alleged abuse, ensure the target is separated from the victim. (55 Pa. Code \u00a7\u00a7 6100.46). d. If the incident involves abuse, suspected abuse, or alleged abuse, ensure the following are notified about the incident as appropriate: Adult Protective Services Child Protective Services Older Adult Protective Services The individual and person\u2019s designated by the individual, unless the person designated by the individual is the target. The Department of Aging and the Department of Human Services The designated managing entity (AE) The county government office responsible for the intellectual disability program (County ID Program) if applicable.   (55 Pa. Code \u00a7\u00a7 6100.46) e. Determine whether an investigation or ot"}], "printables": [], "links": []}, {"slug": "drivers-safety", "title": "Driver's Safety", "color": "#A8447C", "delivery": "day1", "documents": [{"slug": "auto-accident-form", "title": "Auto Accident Form", "revised": "09.07.2021", "pages": 2, "imageOnly": false, "trimmed": false, "html": "<h3>Automobile Claims<\/h3>\n<p>In the event of an accident: First, stay calm. Accidents happen quickly \uf0a7 and can be upsetting. Stay calm, and don\u2019t argue with others involved in the accident. \uf0a7 Prevent additional accidents. Warn oncoming traffic with a light, flag or similar device.<\/p>\n<h3>Provided By:<\/h3>\n<p>Help the injured. Do not render first aid \uf0a7 Trinity Asset Protection, Inc. unless you are qualified. Call an ambulance 865 Easton Road; Suite 310 if anyone is injured. Warrington, PA 18976 Phone Number: 215-918-0670 \uf0a7 Call the police. Don\u2019t discuss what happened with anyone except the police. \uf0a7 File a report. In the event that the police are unable to respond to your call, you\u2019ll need to go to the nearest police station and file an accident report. \uf0a7 Fill out the attached Accident Information \u00a9 2007, 2011, 2014 Zywave Inc. All Rights Reserved. form before leaving the scene of the accident. Call your Direct Supervisor or, if after \uf0a7<\/p>\n<h3>Auto Accident Record<\/h3>\n<p>hours, call the Supervisor on Call at 888- 200-4801 to report the accident. To expedite the call, make sure you have the information on this form completed. Keep this in your auto glove box to help you remain organized and focused on what to do in the event of an auto accident<\/p>\n<h3>Diagram of the Accident Scene<\/h3>\n<h3>Accident Information<\/h3>\n<h3>Other Persons (Passengers and Pedestrians)<\/h3>\n<p>#1. Name: Show the position of all vehicles, pedestrians, etc., using Date:<\/p>\n<h3>the symbols below.<\/h3>\n<p>Time Age: AM/PM: Address: Location: City, State: Weather Zip: Conditions: Phone: Police report number: #2. Name: Age:<\/p>\n<h3>Your Vehicle (Vehicle #1)<\/h3>\n<p>Address: Make/Model: City, State: License Plate # / Zip: State: Phone: Your Injuries:<\/p>\n<h3>Witnesses<\/h3>\n<h3>Other Vehicle (Vehicle #2)<\/h3>\n<p>Name: Make/Model: Address: License Plate # / City, State: State: Zip: Driver\u2019s Name: Phone: Address: Driver\u2019s Name: License #: Age: Phone: Address: Injuries: City, State: Insurance 1. Your vehicle Pedestrians Zip: Provider: Phone: 2. Other vehicles, numbered Policy #: Traffic signals successively<\/p>"}, {"slug": "fleet-policy-what-you-need-to-know", "title": "Fleet Policy - What You Need to Know!", "revised": null, "pages": 1, "imageOnly": false, "trimmed": false, "html": "<p>Shared Support Fleet Safety Program - What You Need to Know! MVR\u2019s will be run annually on each employee but may be run more frequently on an as needed basis.  The MVR reviews will take into consideration the criteria outlined below. The criteria apply to the operation of both Shared Support owned vehicles and employee personal vehicles.<\/p>\n<h3>The Following Offenses Will Result in Probation:<\/h3>\n<p>\uf0fc Damaging the interior or exterior of a company vehicle by careless use while not operating the vehicle. \uf0fc Using your cell phone 1 time for personal reasons in a company vehicle or using your cell phone 1 time in your personal vehicle while transporting an individual, both within the past 36 months.<\/p>\n<h3>Per our Insurance Mandates, the Following Will Result in Immediate Termination of Employment:<\/h3>\n<p>DUI of alcohol or drugs (prescription or non-prescription drugs).  Drug offense or open container violation. Failure to take proper medication to control seizure disorder resulting in a preventable accident. Reckless driving. Passing a stopped school bus. Racing or speed contest violation. Vehicle manslaughter/homicide. Failure to report an accident within the scope of employment with SSI within 24 hours of the accident. Hit and run \u2013 leaving the scene of an accident. Lending an operator\u2019s license or registration to another person. Driving with a suspended or revoked license. Driving with a temporary operator\u2019s permit. Suspended license history \u2013 have had 3 or more license suspensions as a result of moving violations. Eluding a police officer. Felony committed with a motor vehicle. Foreign citizens with no historical driving record available to SSI. Abusive or unauthorized use of an SSI vehicle. Two or more at-fault accidents. Three or more moving violations. Texting and cell phone violations ARE considered moving violations because they increase the likelihood of an accident.  Seat belt violations are not moving violations. Speeding 25 mph, or more, above the speed limit.  Speeding 10 mph, or more, above the speed limit while in a school zone. Employee personal use of a cell phone while driving an SSI vehicle on two occasions. During the last 12 months, the employee has had 2 moving violations and/or at fault accidents. Failure to follow the SSI Fleet Policy regarding vehicle use.<\/p>\n<h3>In Addition:<\/h3>\n<p>Make Management aware of any citations or accidents and provide copies of the citation to your direct supervisor within 24 hours of the occurrence. Seat belts must be worn by all occupants at all times \u2013 travel is not permitted if an employee or passenger is unable to wear a seatbelt for any reason. If you must use a cell phone to conduct Shared Support business, you must pull safely off the road to conduct a conversation. In the event of an accident while on duty, the police must be contacted. Fill out the Accident Reporting Card provided by SSI and contact your direct supervisor or on-call as soon as able to do so.  If the person you support is in the vehicle at the time of the accident, they must be seen by their primary care doctor, at an Urgent Care or ER regardless of how they may be feeling.<\/p>"}, {"slug": "fleet-policy-breakdown-for-staff", "title": "Fleet Policy Breakdown for Staff", "revised": "07.22.21", "pages": 2, "imageOnly": false, "trimmed": false, "html": "<p>Drive Safely!  It could affect your employment!<\/p>\n<li>Take good care of Shared Support vehicles!<\/li>\n<li>Do NOT use your cellphone while driving.  Pull over if a work-<\/li>\n<p>related call needs to be made.<\/p>\n<li>Report all citations and accidents immediately whether in a company<\/li>\n<p>vehicle or your personal vehicle.<\/p>\n<li>Wear your seatbelt and make sure all occupants of the vehicle are<\/li>\n<p>wearing theirs.<\/p>\n<li>If an accident occurs while on duty, make sure to contact the police<\/li>\n<p>and complete an Accident Report.  If someone receiving services is with you, they will need to be seen by a doctor even if you do not believe they were injured.<\/p>\n<li>Motor Vehicle Reports will be run at least annually for all employees.<\/li>\n<p>See attached list for vehicle violations that will result in employment termination. Maintaining a clean driver\u2019s record is essential to the services Shared Support, Inc provides.  Per our insurance mandates, the below will result in immediate termination of employment with Shared Support. 07/22/21<\/p>\n<li>DUI of alcohol or drugs (prescription or non-prescription drugs).  Drug offense<\/li>\n<p>or open container violation.<\/p>\n<li>Failure to take proper medication to control seizure disorder resulting in a<\/li>\n<p>preventable accident.<\/p>\n<li>Reckless driving.<\/li>\n<li>Passing a stopped school bus.<\/li>\n<li>Racing or speed contest violation.<\/li>\n<li>Vehicle manslaughter/homicide.<\/li>\n<li>Failure to report an accident within the scope of employment with SSI within 24<\/li>\n<p>hours of the accident.<\/p>\n<li>Hit and run \u2013 leaving the scene of an accident.<\/li>\n<li>Lending an operator\u2019s license or registration to another person.<\/li>\n<li>Driving with a suspended or revoked license.<\/li>\n<li>Driving with a temporary operator\u2019s permit.<\/li>\n<li>Suspended license history \u2013 have had 3 or more license suspensions as a result of<\/li>\n<p>moving violations.<\/p>\n<li>Eluding a police officer.<\/li>\n<li>Felony committed with a motor vehicle.<\/li>\n<li>Foreign citizens with no historical driving record available to SSI.<\/li>\n<li>Abusive or unauthorized use of an SSI vehicle.<\/li>\n<li>Two or more at-fault accidents.<\/li>\n<li>Three or more moving violations. Texting and cell phone violations ARE<\/li>\n<p>considered moving violations because they increase the likelihood of an accident. Seat belt violations are not moving violations.<\/p>\n<li>Speeding 25 mph, or more, above the speed limit.  Speeding 10 mph, or more,<\/li>\n<p>above the speed limit while in a school zone.<\/p>\n<li>Employee personal use of a cell phone while driving an SSI vehicle on two<\/li>\n<p>occasions.<\/p>\n<li>During the last 12 months, the employee has had 2 moving violations and/or at<\/li>\n<p>fault accidents.<\/p>\n<li>Failure to follow the SSI Fleet Policy regarding vehicle use.<\/li>\n<p>t 07/22/21<\/p>"}, {"slug": "shared-support-fleet-safety-program", "title": "Shared Support Fleet Safety Program", "revised": "07.13.26", "pages": 10, "imageOnly": false, "trimmed": false, "html": "<p>Shared Support Fleet Safety Program<\/p>\n<h3>Shared Support\u2019s Fleet Safety Program<\/h3>\n<h3>I.<\/h3>\n<h3>Background<\/h3>\n<p>One of the services provided to Shared Support\u2019s individuals is transportation. Operation of motor vehicles by Shared Support\u2019s employees and contractors carries with it substantial responsibility.  The duty of safe operation of vehicles extends to: A. Shared Support\u2019s individuals B. Shared Support\u2019s employees C. Shared Support\u2019s contractors D. The Public At-Large Failure to safely operate any vehicle within the scope of our services may result in substantial property damage or bodily injury.  Employees, contractors, individuals and other passengers within the vehicles operated by Shared Support are subject to injuries. The vehicles purchased by Shared Support represent a considerable expense of the operations. It is critical for personnel to ensure that such investments are maintained in the best possible condition and the utmost care be taken in their use. Shared Support\u2019s vehicles are exposed to damage due to a collision or other unsafe acts. In view of the legal and moral responsibility placed upon Shared Support for the safe operation of its vehicles, Shared Support\u2019s Fleet Safety Program is outlined.  It is broken down into the following categories: Driver Selection Use and Maintenance Accident Reporting Training Use of Employee Vehicles 2017; Updated 05/19; 06/05/19; 07/06/21; 07/13/26<\/p>\n<h3>2<\/h3>\n<h3>Shared Support\u2019s Fleet Safety Program<\/h3>\n<h3>II.<\/h3>\n<h3>Driver Selection<\/h3>\n<p>Driver error continues to be the number one cause of automobile accidents.  One of Shared Support\u2019s objectives, therefore, is the proper selection of employees to drive vehicles within the scope of Shared Support\u2019s operations.  Our Insurance carrier also anticipates that we will use good judgment, in accordance with industry-accepted parameters, as to whom we permit to operate vehicles within the<\/p>\n<h3>scope of Shared Support Activities.<\/h3>\n<p>The minimum requirements for individuals authorized to operate Shared Support\u2019s vehicles are as follows: (Rare exceptions to these requirements may only be made by the CEO or COO.) 1. Only designated employees or contractors are permitted to drive Shared Support vehicles. 2. Employees or contractors must be a minimum 18 years of age. 3. Employees must possess a valid driver&#x27;s license in their present state of residence.  For those employees who operate a vehicle subject to commercial licenses, they need to possess a commercial driver&#x27;s license. 4.      Employees must have 3 or more years of driving experience. 5. .     Employees must demonstrate the aptitude; and other qualifications as outlined in this policy, including but not limited to, the Motor Vehicle Record (MVR) standards. 6. .  Satisfactory completion of a vehicle orientation by the site supervisor which may include clearances of the vehicle; operating features; and wheel chair safety. In addition, a Defensive Driving Course presented as part of the staff orientation.  Both of these trainings need to be satisfactorily completed<\/p>\n<h3>prior to driving a Shared Support vehicle.<\/h3>\n<p>During the application process and on an  annual basis, MVR inspections on employees will be obtained through the relevant Department of Motor Vehicles. Shared Support reserves the right to obtain any personnel\u2019s MVR on a random or more frequent basis.  Such MVR examinations will take into consideration the criteria outlined in this Policy. The criteria apply to the operation of motor vehicles whether or not a Shared Support\u2019s Vehicle. 2017; Updated 05/19; 06/05/19; 07/06/21; 07/13/26<\/p>\n<h3>3<\/h3>\n<h3>Shared Support\u2019s Fleet Safety Program<\/h3>\n<h3>MOTOR VEHICLE RECORD CRITERIA<\/h3>\n<h3>Driving Records Subject to Probation<\/h3>\n<p>\u00ba An employee who damages a Shared Support vehicle (interior or exterior) by improper or careless use while not operating the vehicle. \u00ba An employee who operates a cell phone one time within a Shared Support\u2019s vehicle for personal reasons within the past 36 months or an employee who uses a cell phone one time in his/her own vehicle while transporting an individual receiving services from Shared Support, within the past 36 months.<\/p>\n<h3>Driving Records Subject to  Termination<\/h3>\n<h3>\u00ba A driver who has any one or more of the following over the latest 36 months:<\/h3>\n<p>- Driving while under the influence of alcohol or drugs (including prescription or non- prescription drugs\u2014See Section IV), drug offense or open container violation. - Failure of an employee to take proper medication to control seizure disorders which results in a preventable accident\u2014See Section IV - Driving in a reckless manner. - Passing a stopped school bus. - Racing or speed contest violation. - . Vehicle manslaughter/homicide.<\/p>\n<h3>Failure to report an accident within the scope of employment with Shared Support<\/h3>\n<p>-<\/p>\n<h3>within 24 hours of the accident<\/h3>\n<p>- Hit and run \u2013 leaving the scene of an accident. - Lending an operator\u2019s license or registration to another person.Driving with a suspended or revoked license. - Driving with a temporary operator\u2019s permit. - Suspended License history \u2013have had 3 or more license suspensions as a result of moving violations. - Eluding a police officer. - Felony committed with a motor vehicle. - Foreign citizens with no historical driving record available to Shared Support. - Abusive or unauthorized use of a Shared Support vehicle - Two or more at-fault accidents. - Three or more moving violations.  Texting &amp; cell phone violations are considered moving violations because they increase the likelihood of an accident. Seat belt violations are not moving violations. - Speeding 25 mph, or more, above the speed limit. - Speeding 10 mph, or more, above the speed limit while in a school zone. - Employee personal use of a cell phone while driving a Shared Support\u2019s vehicle on two occasions (recognized by Shared Support \u2013 no moving violations issued). - Failure to follow this policy regarding vehicle use. 2017; Updated 05/19; 06/05/19; 07/06/21; 07/13/26<\/p>\n<h3>4<\/h3>\n<h3>Shared Support\u2019s Fleet Safety Program<\/h3>\n<h3>\u00ba A driver who has the following over the latest 12 months:<\/h3>\n<p>-  More than 2 moving violations and/or at fault accidents within the past 12 months. * Employees are required to notify the Management immediately upon their having a driver&#x27;s license suspension or revocation.  Failure to do so may result in separation from employment. * An employee is responsible for payment of any traffic citation or similar fine issued. * Employees are required to make Shared Support, Inc. aware of any citations or accidents within 24  hours of the occurrence and to submit copies of citations to their direct supervisor within 24 hours.<\/p>\n<h3>III.<\/h3>\n<h3>Vehicle Maintenance &amp; Use<\/h3>\n<p>A close second to operator negligence as a cause of automobile accidents is improper vehicle maintenance. Shared Support is committed to providing for proper maintenance of its vehicles.  Such action includes the following: The vehicles will have oil and filter changes in accordance with manufacturers\u2019 recommendations. Vehicles will be sent to its automobile servicing facility for comprehensive maintenance inspections on an annual basis. Such inspections will include an examination of all critical operating systems including, but not limited to: brakes, steering, suspension, tires. On a monthly basis, the designated employees will be responsible for an inspection of the vehicle in accordance with the monthly Vehicle Condition Report of Shared Support. Prior to the use of a vehicle, the driver will walk around the vehicle paying attention to any unknown damage; tire under- pressure or damage; leaking fluids or inoperable lights. The vehicle should not be used in the event of a dangerous condition. Employees who note any abnormality in the vehicle&#x27;s operating condition should immediately notify the Supervisor so that appropriate action can be taken.  Additionally, once per quarter, Maintenance will perform a review of each vehicle. Proper care of Shared Support\u2019s vehicle is the responsibility of all employees who use them.  For example, there should be no eating, drinking or smoking by employees in the vehicles. Seat Belts are to be worn by all occupants, at all times in Shared Support Vehicles or vehicles used in the course of Shared Support business. It is the responsibility of the driver to make certain that all passengers are wearing seat belts properly before starting the vehicles. Employees are required to immediately notify Shared Support of a defective seat belt condition and/or problem with the proper fitting of seat belt. In no event, is an employee or passenger to ride in a vehicle without<\/p>\n<h3>proper restraint.<\/h3>\n<p>Any unsafe activities in the vehicles are to be reported to Management for any necessary review and treatment. This would include, for example, clients whose behaviors cause undue distraction to the driver and/or unwillingness to wear seat belts. 2017; Updated 05/19; 06/05/19; 07/06/21; 07/13/26<\/p>\n<h3>5<\/h3>\n<h3>Shared Support\u2019s Fleet Safety Program<\/h3>\n<p>Only employees, individuals in their care and authorized individuals are permitted to ride in Shared Support\u2019s vehicles. No other persons are permitted to ride in a Shared Support vehicle. Vehicles are to be used for Shared Support\u2019s operations only. Employees are not permitted to use Shared Support vehicles for personal reasons. Similarly, outings which are primarily for an employee\u2019s personal use (going to the bank, store, etc.) are not permitted. Personal Use of cell phones is not permitted within the Shared Support\u2019s vehicles. In the event that cell phones are required to be used for Shared Support\u2019s operations, the driver needs to safely pull the vehicle over in order to conduct a conversation.<\/p>\n<h3>IV.   Other Driving Factors<\/h3>\n<p>\uf0d8 We are all responsible for assuring that we are in proper physical and mental condition to operate an automobile. Shared Support employees who are not in proper condition should not drive an automobile, particularly within the scope of employment. Some of the factors to consider are mentioned below. \uf0d8 Use of prescription medications should be in strict conformance with the doctor\u2019s instructions. It is imperative that: \uf0a7 The side effects of medications be completely understood and considered when operating an automobile. In no event is a Shared Support employee to operate an automobile if such medications impair the senses or judgment. Even simple cold medications may cause a considered impairment leading to an accident. \uf0a7 In certain cases, medications will be required to control a health matter such as seizures (epilepsy; grand mal, etc.). In Pennsylvania, you are permitted to drive a vehicle if such seizures have not occurred for a period of at least 6 months; a physician submits a medical report to affirm such fact; and medications are taken in accordance with the doctor\u2019s instructions. Shared Support employees who may be subject to such seizures are required to faithfully follow the doctor\u2019s instructions. \uf0a7 Some people may be subject to blackouts; fainting spells or similar physical problems due to heart-related or circulatory ailments. No employee subject to such condition is permitted to operate a vehicle unless they have first obtained a doctor\u2019s written verification of their ability to safely operate an automobile and that they take medication in accordance with their doctor\u2019s instruction. \uf0a7 A person with diabetes should also strictly follow their doctor\u2019s advice. This will include taking the proper level of insulin and checking their blood sugar prior to long trips. As necessary, some form of sugar should be kept in the vehicle in the event of low blood sugar. \uf0a7 An accident caused by failure to properly medicate will be grounds for separation from employment.<\/p>\n<h3>V.<\/h3>\n<h3>Accident Reporting<\/h3>\n<p>Prompt action taken in the event of an accident is extremely important to assure that the facts surrounding an accident are properly documented.  Such action as described in this section will also minimize the chance of further personal injury or damage. 2017; Updated 05/19; 06/05/19; 07/06/21; 07/13/26<\/p>\n<h3>6<\/h3>\n<h3>Shared Support\u2019s Fleet Safety Program<\/h3>\n<p>All agency vehicles have an Accident Reporting Card in the vehicle glove compartment. If using your own vehicle for transport, employees will maintain an Accident Reporting Card in their glovebox In the event of an accident, the following should be done: The police should be immediately contacted.  In the event of any injuries, the police should be informed at such time, so that an appropriate medical response can be made. Contact the Supervisor or Supervisor-on-call. This must be done, as soon as practicable, after the police have been contacted but in no event greater than 2 hours unless due to injury suffered by an employee that prevents such a communication.  This will provide Shared Support an opportunity to provide assistance and make an accident investigation. When conditions and/or regulations permit, move the vehicle onto the shoulder or side of the roadway to prevent further damage or other hazards. The first priority is to seek medical attention for any person injured. Keep calm.  Be courteous.  Don&#x27;t argue.  Make no statement concerning the accident to anyone except the police officer who arrives on the scene.  Obtain the officer&#x27;s name and badge number.  Do not admit any responsibility for the accident to anyone.  Make no settlement regarding the accident. Simply state the facts to the police officer who responds to the scene. Complete the Accident Information form located in the vehicle glove compartment. Obtain the names and addresses of any witnesses. It is important to relate the facts of the accident as best as possible.  This will lead to a proper decision as to the responsibility of the accident.  Shared Support\u2019s insurance company will use the information as to how they approach their handling of any claims.  Thus, there are critical, legal reasons to relate the facts as they occur to the best of one&#x27;s ability. Subject to this policy, any employee who fails to notify their Supervisor of an accident within 24 hours may be subject to separation from employment. The police will not respond to every accident situation, particularly, for minor accidents. It becomes that much more important to obtain information from the other driver involved in the accident.  This will include their name and driver&#x27;s license number; as well as all insurance information.  In the event that the police do not respond, Shared Support\u2019s management will contact the local police station and file the appropriate information. An employee involved in a motor vehicle accident must submit to drug and alcohol testing if any of the following conditions apply: (1) the employee or any other person involved in the accident requires medical treatment beyond first aid administered at the scene; (2) any vehicle involved in the accident requires towing; or (3) there is a reasonable suspicion of drug or alcohol usage.  These conditions apply while operating a vehicle owned, leased or rented by Shared Support, Inc. or while conducting Shared Support, Inc. business. 2017; Updated 05/19; 06/05/19; 07/06/21; 07/13/26<\/p>\n<h3>7<\/h3>\n<h3>Shared Support\u2019s Fleet Safety Program<\/h3>\n<p>In the event a program participant is in the vehicle at the time of even a minor accident, the person must be seen by their primary care physician, urgent care or at the emergency room immediately following the accident. This follow up care must occur, regardless of how the person reports they are feeling.  Discharge instructions must be submitted to the Program Specialist following the appointment.<\/p>\n<h3>VI.<\/h3>\n<h3>Training<\/h3>\n<p>Since operator error is considered the number one cause of automobile accidents, it is in the best interests of all parties to ensure that those who operate vehicles within the scope of employment are properly educated as to safe driving practices. To this end, training of employees will be conducted as follows: Employees who drive will be required to attend driver safety training sessions offered by Shared Support on a minimum annual basis. As previously advised, a defensive driver course will be required of drivers whose records are subject to Probationary status, as well as any other training deemed necessary by Management. All training sessions will require documentation as to the employee&#x27;s attendance and understanding of the material presented. The training offered within employee orientations will also include a review of Shared Support Fleet Safety Policy Defensive Driving.<\/p>\n<h3>VII. Employee-Owned Vehicles<\/h3>\n<p>It may be necessary for employees to use their own automobiles to transport individuals or otherwise use their automobiles for agency use.  When employees use their own automobiles for personal or business use, their Personal Automobile insurance coverage will respond first in the event of an accident.  Thus, for example, if an employee is involved in an automobile accident while transporting an individual, the damage to an employee&#x27;s automobile will be covered under the employee&#x27;s personal automobile insurance policy. Also, liability, if any, to another party would be covered under the employee&#x27;s personal automobile insurance policy.  The employee&#x27;s Personal Automobile insurance policy will always respond first in such an event because: This is in keeping with the legal requirements of automobile insurance policy forms. The employee, as owner of the vehicle, is responsible for the vehicle operation and any resultant accident.  This is subject to the financial responsibility law as outlined by the Commonwealth of Pennsylvania. As operator of the vehicle, the employee is in the best position to maintain control of the automobile. As its continuing policy, Shared Support will subsidize employees for the operation of their own automobiles based upon mileage.  Such reimbursement anticipates the inclusion of insurance costs. 2017; Updated 05/19; 06/05/19; 07/06/21; 07/13/26<\/p>\n<h3>8<\/h3>\n<h3>Shared Support\u2019s Fleet Safety Program<\/h3>\n<p>Employees, who use their personal automobile for agency business will be subject to the following: 1. Only employees who have a valid driver license will be permitted to operate their vehicles within the scope of employment.  A copy of an employee&#x27;s driver license will be provided by Shared Support employees and maintained on file by Shared Support. Upon expiration of a driver\u2019s license, an updated driver\u2019s license shall be copied and maintained.  An employee is responsible to immediately notify Management of their driver\u2019s license being revoked or suspended. Failure to provide immediate notification represents grounds for termination. 2. Employees who operate their personal vehicles within the scope of the agency&#x27;s business will also provide a copy of their automobile insurance card which validates the provision of insurance covering such vehicle as well as current vehicle registration and inspection information.  Upon the expiration of such insurance, the employee will provide to Management a copy of the new Automobile Insurance Card.  An employee is responsible to immediately notify Management of any non-renewal or cancellation of their personal Automobile Insurance. Failure to provide immediate notification represents grounds for termination 3. Employees are responsible for advising their Automobile insurance company of the use of their automobile. The employee will be responsible for any additional insurance cost of any amending of such a use classification. It is anticipated that employees will comply with state law and insurance company inquiries in providing information on the use of their personal automobile--- such as garage territory and usage. This is urged since there are Insurance Fraud Statutes in the Commonwealth of Pennsylvania. 4. Employees are required to maintain current automobile inspections and to submit proof of registration to Shared Support, Inc.<\/p>\n<h3>VIII. Monitoring and Documentation of Trips in Vehicles<\/h3>\n<p>Shared Support uses iCare Manager (iCM) to track and document all trips made in company-owned and personal vehicles for individual transportation and other approved business purposes. Employees must clock in and out of each trip in iCM and indicate whether they are using a company vehicle or a personal vehicle. The employee&#x27;s name is automatically recorded. When using a personal vehicle, employees must enter odometer readings between each destination. When using a company vehicle, employees must record the odometer reading at the beginning and end of their workday. Trip records entered in iCM are reviewed at least every two weeks by the employee\u2019s supervisor and the Shared Support Fiscal Department. 2017; Updated 05/19; 06/05/19; 07/06/21; 07/13/26<\/p>\n<h3>9<\/h3>\n<h3>Shared Support\u2019s Fleet Safety Program<\/h3>\n<p>Exhibit I SAMPLE MEMO TO EMPLOYEE REGARDING PROBATION To: From:<\/p>\n<h3>RE:<\/h3>\n<p>DRIVING RECORD PROBATION Your eligibility to operate a motor vehicle is dependent upon your maintaining a driving record meeting the criteria outlined in the Shared Support Fleet Safety Policy. Due to the following  infractions, you are placed on probation until _ (date) and placed on notice that future moving violations, infractions and/orat-fault accidents may result in a immediate termination from Shared Support: In addition, please note the following: 1- You will complete a Defensive Driving Course, as directed by Shared Supports. 2-   Your driving record will be examined at the date indicated above to determine your driving status. I have read and understand this Probationary Status: Employee Signature Shared Support Date Signed 2017; Updated 05/19; 06/05/19; 07/06/21; 07/13/26<\/p>\n<h3>10<\/h3>"}], "printables": [{"title": "Drivers Safety Packet", "path": "3 - Drivers Safety/Drivers Safety Packet.pdf", "dir": "3 - Drivers Safety", "review": false}, {"title": "Easy Print Driver's Safety", "path": "3 - Drivers Safety/Easy Print Driver's Safety.pdf", "dir": "3 - Drivers Safety", "review": false}], "links": []}, {"slug": "disaster-preparedness", "title": "Disaster Preparedness", "color": "#2F3E6B", "delivery": "day1", "documents": [{"slug": "disaster-plan", "title": "Disaster Plan", "revised": "04.30.2025", "pages": 13, "imageOnly": false, "trimmed": false, "html": "<p>Disaster Preparedness Shared Support, Inc. maintains a readiness plan in the event of disaster to ensure communication and safety for staff and the people we support. I. Emergency Placement All individuals have an alternate placement plan in the event that they are unable to remain in the primary residence as a result of disaster.  That placement may be with family members, other homes or hotels.  Each person\u2019s relocation plan will be maintained in his/her file at the home. Although an alternate placement plan exists for each person, in the event of a natural disaster, it may be necessary to make diverge from alternate placement.  For example, in the event of flooding, particular hotels may not be available.  Other placements will be sought in such an event and may include Shared Support office space, other resident\u2019s homes, community emergency shelters, etc. II. Communication Each residential site will have a universal cell phone charging kit in the event that landline service is interrupted. All homes are equipped with on-call schedule and personnel will contact on call during any event or disaster. On call personnel will contact the Program Director and that person will contact CEO, CPO and COO In the event that any part of this chain is broken, any personnel will directly contact CEO or COO in the event of a disaster.  These numbers are also located at each home. Whenever a local emergency support system exists, participants will be supported to enroll in these programs which engage during natural disasters.  Community Emergency Response Teams is one example and is specific to each county or region. III. Emergency Kits Each home and office setting have an emergency kit on site that will be replaced every 5 years will include water, nutrient tabs, KN95 Antiviral Masks, a hand crank combination Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025 LED Flashlight/multi-frequency radio/cell phone charger which does not require batteries or electricity, First Aid supplies and protective thermal wraps. Power/Heat Source Outage Procedure Policy All staff and Program Specialists will be counseled on procedures to follow during a power or heat source outage including: 1. Direct support staff will contact on call at first notice of outage. 2. Direct support staff will monitor temperature every 2 hours. 3.  Should temperatures drop to 65 degrees in the winter months or rise to 85 degrees in the summer months, staff will again contact on-call. 4.  On-call will follow regulations and will arrange for hotel accommodations should temperatures drop below or rise above regulated temperature guidelines. Appendix 1 - Winter Storm Precautions Shared Support, Inc. operates offices, life sharing homes and community living arrangements in venues known for inclement weather during the winter months, including ice, snow and power outages.  It is our responsibility to maintain the same level of care to those we support during inclement weather conditions, while safeguarding the safety of both those we support and our staff members. The following planning is in place to assure that we meet the needs of those we support while assuring the safety of staff: \u27a2 Supervisors will assist homes in preparing for winter storms by assuring homes have adequate food supplies, bottled water and medications in the home for at least three days of self-sufficiency; Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025 \u27a2 Homes located in areas known for lengthy power outages, that have long driveways or are located in remote locations may be evacuated to a hotel before the storm strikes; \u27a2 Fleet vehicles will remain parked and off roadways \u2013 911 will be called in the event an emergency transport for medical reasons is needed; \u27a2 Staff members will work all shifts as scheduled, preparing ahead of the storm by making alternate travel arrangements and giving plenty of time for travel to their work site. If a staff member is still having difficulty reporting to work, their direct supervisor or on-call personnel is to be contacted immediately and assistance will be offered when possible; \u27a2 Staff members on shift during a winter storm are urged to prepare ahead and to remain flexible in the event their relief co-worker is having difficulty reporting to shift. Staff will be compensated for any additional time spent on shift covering during a winter storm, as well as be compensated for early starts if they plan ahead and make arrangements to arrive to the site before the worst of the storm strikes; \u27a2 Staff members running late for shift during winter storms are urged to be careful on the roads and to take their time getting to work \u2013 staff will not be penalized for late arrivals during winter snow conditions. Appendix 2 \u2013 Active Shooter Event An \u201cactive shooter\u201d is an individual who is engaged in killing or attempting to kill people in a confined and populated area; in most cases, active shooters use firearm(s) and there is no pattern or method to their selection of victims. Active shooter situations are unpredictable and evolve quickly.  Typically, the immediate deployment of law enforcement is required to stop the shooting and mitigate harm to victims. Because active shooter situations are often over within 10 to 15 minutes, before law enforcement arrives on the scene, individuals must be prepared both mentally and physically to deal with an active shooter situation. Shared Support, Inc. staff members will be trained using the Homeland Security RUN \u2013 HIDE - FIGHT video containing the information outlined below. Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025<\/p>\n<h2>Dialing *777 from any office telephone will<\/h2>\n<h2>intercom to all office telephones.<\/h2>\n<p>SOURCE: HTTP://WWWDHS.GOV/ACTIVE-SHOOTER-PREPAREDNESS<\/p>\n<h3>When law enforcement arrives:<\/h3>\n<p>Remain calm and follow instructions Drop items in your hands (e.g., bags, jackets) Raise hands and spread fingers Keep hands visible at all times Avoid quick movements toward officers, such as holding on to them for safety<\/p>\n<h2>ACTIVE<\/h2>\n<p>Avoid pointing, screaming or yelling Do not ask questions when evacuating<\/p>\n<h2>SHOOTER EVENT<\/h2>\n<h3>Information to provide to 911 operations:<\/h3>\n<p>Location of the active shooter QUICK REFERENCE GUIDE Number of shooters Physical description of shooters Number and type of weapons shooter has Number of potential victims at location<\/p>\n<h3>For questions or additional assistance contact:<\/h3>\n<p>An \u201cactive shooter\u201d is an individual who is Your local law enforcement authorities or FBI Field office : engaged in killing or attempting to kill people in a confined and populated area; in most cases, active shooters use firearms(s) and there is no pattern or method to their selection of victims. Victims are selected at random Event is unpredictable and evolves quickly Department of Homeland Security Knowing what to do can save lives 3801 Nebraska Ave, NW Washington, DC 20528 Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025<\/p>\n<h2>ACTIVE SHOOTER EVENTS<\/h2>\n<p>3 FIGHT When an Active Shooter is in your vicinity, Fight as a last resort and only when your you must be prepared both mentally and life is in imminent danger physically to deal with the situation. Attempt to incapacitate the shooter Act with as much physical aggression as<\/p>\n<h3>You have three options:<\/h3>\n<p>possible 1 RUN Improvise weapons or throw items at the active shooter Have an escape route and plan in mind Commit to your actions . . . your life Leave your belongings behind depends on it Evacuate regardless of whether others agree to follow Help others escape, if possible Do not attempt to move the wounded The first officers to arrive on scene will not Prevent others from entering an area where the active shooter may be stop to help the injured. Expect rescue teams to follow initial officers. These rescue Keep your hands visible teams will treat and remove injured. Call 911 when you are safe Once you have reached a safe location, you will likely be held in that area by law HIDE 2 enforcement until the situation is under Hide in an area out of the shooter\u2019s view control, and all witnesses have been identified and questioned. Do not leave the Lock door or block entry to your hiding place area until law enforcement authorities have Silence your cell phone (including vibrate instructed you to do so. mode) and remain quiet<\/p>\n<h2>Appendix 3 \u2013 Tornado<\/h2>\n<p>Tornadoes are nature\u2019s most violent storms.  Spawned from powerful thunderstorms, tornadoes can cause fatalities and devastate a neighborhood in seconds.  A tornado appears as a rotating, funnel-shaped cloud that extends from a thunderstorm to the ground with whirling winds that can reach 300 miles per hour. Damage paths can be in excess of one mile wide and 50 miles long.  Every state is at some risk from this hazard. Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025 Some tornadoes are clearly visible, while rain or nearby low-hanging clouds obscure others. Occasionally, tornadoes develop so rapidly that little, if any, advance warning is possible. Before a tornado hits, the wind may die down and the air may become very still.   A cloud of debris can mark the location of a tornado even if a funnel is not visible.  Tornadoes generally occur near the trailing edge of a thunderstorm.  It is not uncommon to see clear, sunlit skies behind a tornado. The following are facts about tornadoes:<\/p>\n<li>They may strike quickly, with little or no warning;<\/li>\n<li>They may appear nearly transparent until dust and debris are picked up or a cloud forms<\/li>\n<p>in the funnel;<\/p>\n<li>The average tornado moves southwest to northeast, but tornadoes have been known to<\/li>\n<p>move in any direction;<\/p>\n<li>The average forward speed of a tornado is 30 MPH, but may vary from stationary to 70<\/li>\n<p>MPH;<\/p>\n<li>Tornadoes can accompany tropical storms and hurricanes as they move onto land;<\/li>\n<li>Waterspouts are tornadoes that form over water;<\/li>\n<li>Tornadoes are most frequently reported east of the Rocky Mountains during spring and<\/li>\n<p>summer months; Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025<\/p>\n<li>Peak tornado season in the southern states is March through May; in the norther states<\/li>\n<p>it is late spring through early summer;<\/p>\n<li>Tornadoes are most likely to occur between 3:00 p.m. and 9:00 p.m. but can occur at<\/li>\n<p>any time.<\/p>\n<h3>Know the Terms<\/h3>\n<h3>Familiarize yourself with the following terms to help identify a tornado hazard:<\/h3>\n<li>Tornado Watch \u2013 This means that tornados are possible. Remain alert for approaching<\/li>\n<p>storms. Watch the sky and stay tuned to NOAA Weather Radio, commercial radio or television for information. o NOAA is a nationwide network of radio stations broadcasting continuous weather information from the nearest National Weather Service office. (http://nws.noaa.gov/nwr/)<\/p>\n<li>Tornado Warning \u2013 This means a tornado has been sighted or indicated by weather<\/li>\n<p>radar.  Take shelter immediately.<\/p>\n<h3>Take Protective Measures<\/h3>\n<h3>Before a tornado, be alert to changing weather conditions:<\/h3>\n<li>Listen to NAOO Weather Radio or to commercial radio or television newscasts for the<\/li>\n<p>latest information;<\/p>\n<li>Look for approaching storms;<\/li>\n<li>Look for the following danger signs:<\/li>\n<p>o Dark, often greenish sky o Large hail o A large, dark, low-lying cloud (particularly if rotating) o Loud roar, similar to a freight train If you see approaching storms or any of the danger signs, be prepared to take shelter immediately.<\/p>\n<h3>During a tornado \u2013 if you are under a tornado WARNING, seek shelter<\/h3>\n<h3>immediately.<\/h3>\n<h3>IF YOU ARE IN:<\/h3>\n<h3>THEN:<\/h3>\n<p>Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025 A structure (home, school, restaurant, etc.) Go to a pre-designated shelter area such as a safe room, basement, storm cellar or the lowest building level.  If there is no basement, go to the center of an interior room on the lowest level (closet/interior hallway), away from corners, windows, doors and outside walls.  Put as many walls as possible between you and the outside. Get under a sturdy table and use your arms to protect your head and neck.  Do not open windows. A vehicle, trailer or mobile home Get out immediately and go to the lowest floor of a sturdy, nearby building or a storm shelter. Mobile homes, even if tied down, offer little protection from tornadoes. The outside with no shelter Lie flat in a nearby ditch or depression and cover your head with your hands.  Be aware of the potential for flooding. Do not get under an overpass or bridge. You are safer in a low, flat area. Never try to outrun a tornado in urban or congested areas in a car or truck.  Instead, leave the vehicle immediately for safe shelter. Watch for flying debris.  Flying debris from tornadoes causes fatalities and injuries. SOURCE: WWW.FEMA.GOV<\/p>\n<h3>Preparing a Safe Room<\/h3>\n<p>Extreme windstorms in many parts of the country pose a serious threat to buildings and their occupants.   An office or residence may be built \u201cto code,\u201d but that does not mean it can withstand winds from extreme events such as tornadoes and major hurricanes.  The purpose of a safe room or a wind shelter is to provide a safe space where people can seek refuge that provides a high level of protection.  A safe room can be identified in one of several places in your home or office:<\/p>\n<li>A basement<\/li>\n<li>Atop a concrete slab-on-grade foundation or garage floor<\/li>\n<li>An interior room on the first floor<\/li>\n<p>Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025 Safe rooms below ground level provide the greatest protection, but a safe room in a first floor, interior room can also provide the necessary protection.  Below ground safe rooms must be designed to avoid accumulating water during the heavy rains that often accompany severe windstorms. To protect its occupants, a safe room must be able to withstand high winds and flying debris, even if the rest of the facility is severely damaged or destroyed.  Consider the following when identifying a safe room:<\/p>\n<li>The safe room must be adequately anchored to resist overturning and uplift;<\/li>\n<li>The walls, ceiling and door of the shelter must withstand wind pressure and resist<\/li>\n<p>penetration by windborne objects and falling debris;<\/p>\n<li>The connections between all parts of the safe room must be strong enough to withstand<\/li>\n<p>wind. Additional information about safe rooms is available at: https://www.fema.gov/safe-rooms<\/p>\n<h3>Identified Safe Room Locations \u2013 Shared Support:<\/h3>\n<p>Sunbury Office Building<\/p>\n<li>Corporate Office \u2013 basement<\/li>\n<li>Program Offices (3) \u2013 basements (old admin building basement entered from porch)<\/li>\n<li>Training Center \u2013 if evacuation is possible due to early warning, proceed to closest<\/li>\n<p>program office basement; if evacuation is impossible, shelter in place in the center of the interior room, away from corners, windows, doors and outside walls. W
