illiamsport Office Building<\/p>\n<li>Basement<\/li>\n<p>All Community Homes and Life Sharing Homes will follow instructions as outlined by FEMA in graph provided above.<\/p>\n<h2>Appendix 4 \u2013 Hazardous Materials Incident<\/h2>\n<p>Hazardous materials come in the form of explosives, flammable and combustible substances, poisons and radioactive materials.  Hazards can occur during production, storage, transportation, use or disposal. You are at risk if a chemical is used unsafely or released in harmful amounts into the environment where you live or work, such as a chemical spill on a local highway.<\/p>\n<h3>During a Hazardous Material Incident<\/h3>\n<h3>If you are asked to evacuate:<\/h3>\n<p>Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025<\/p>\n<li>Do so immediately;<\/li>\n<li>Stay tuned to a radio or television for information on evacuation routes, temporary<\/li>\n<p>shelters and procedures;<\/p>\n<li>If you have time, minimize contamination in the home or office by closing all windows,<\/li>\n<p>shutting all vents and turning off attic fans;<\/p>\n<li>Take disaster supplies, such as personal medications.<\/li>\n<h3>If you are caught outside:<\/h3>\n<li>Stay upstream, uphill and upwind. In general, try to go at least one-half mile from the<\/li>\n<p>danger area;<\/p>\n<li>Do not walk into or touch spilled liquids, airborne mists or condensed solid chemical<\/li>\n<p>deposits. Try not to inhale gases, fumes and smoke. If possible, cover your mouth with a cloth or mask while leaving the area;<\/p>\n<li>Stay away from accident victims until the hazardous material has been identified.<\/li>\n<h3>If you are in a motor vehicle:<\/h3>\n<li>Stop and seek shelter in a permanent building;<\/li>\n<li>If you must remain in your car, keep the car windows and vents closed and shut off the<\/li>\n<p>air conditioner and heater.<\/p>\n<h3>If you are directed to remain indoors:<\/h3>\n<li>Warn everyone outside to enter the building immediately;<\/li>\n<li>Bring pets inside;<\/li>\n<li>Close and lock all exterior doors and windows. Close vents, fireplace dampers and as<\/li>\n<p>many interior doors as possible;<\/p>\n<li>Turn off air conditioners and ventilation systems or set ventilations systems to 100<\/li>\n<p>percent recirculation so that no outside air is drawn into the building;<\/p>\n<li>If gas or vapors have entered the building, take shallow breaths through a cloth or a<\/li>\n<p>towel;<\/p>\n<li>Avoid eating or drinking any food or water that may be contaminated;<\/li>\n<li>Go into your pre-selected shelter room<\/li>\n<p>o Move away from windows and move to the core of the building o Move everyone to the second floor or higher if in a multistory building o Do not occupy the basement<\/p>\n<h3>After a Hazardous Materials Incident<\/h3>\n<p>Listen to the local radio or television stations for the latest emergency information \u2013 once<\/p>\n<h3>advised that the incident has been contained:<\/h3>\n<p>Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025<\/p>\n<li>Go to a designated public shelter if you have been told to evacuate or you feel it is<\/li>\n<p>unsafe to remain in the home or office. Text SHELTER + ZIP Code to 43362 (4FEMA) to find the nearest shelter in your area (example: shelter 12345);<\/p>\n<li>Act quickly if you have come into contact with or have been exposed to hazardous<\/li>\n<p>chemicals;<\/p>\n<li>Follow decontamination instructions from local authorities;<\/li>\n<li>Seek medical treatment for unusual symptoms as soon as possible;<\/li>\n<li>Place exposed clothing and shoes in tightly sealed containers;<\/li>\n<li>Advise everyone who comes in to contact with you that you may have been exposed to<\/li>\n<p>a toxic substance;<\/p>\n<li>Return home only when authorities say it is safe.  Open windows and vents and turn on<\/li>\n<p>fans to provide ventilation;<\/p>\n<li>Find out from local authorities how to clean land and property;<\/li>\n<li>Report any lingering vapors or other hazards to your local emergency services office.<\/li>\n<h2>Appendix 5 \u2013 Influenza/Pandemic<\/h2>\n<h3>Introduction:<\/h3>\n<p>Seasonal influenza epidemics are caused by influenza viruses, which circulate around the world. The purpose of this pandemic response plan is to ensure that the health and safety of our staff and individuals is protected while maintaining essential operations and minimizing disruptions to our services.  This plan outlines actions to prevent, prepare for, respond to and recover from a pandemic, in alignment with public health guidance. This pandemic protocol applies to all employees, individuals and homes associated with Shared Support, Inc. The plan will be enacted when a pandemic is declared by the World Health Organization (WHO) or the Centers for Disease Control and Prevention (CDC), or when public health authorities issue relevant guidance.<\/p>\n<h3>Guiding Principles:<\/h3>\n<p>1. Health and Safety Priority: Safeguarding the health of all individuals associated with Shared Support, Inc. is our top priority. Actions will be taken to prevent the spread of infectious diseases through robust hygiene practices, social distancing, remote work arrangements and rapid response to potential cases. 2. Clear Communication: We will provide transparent, timely and accurate information to individuals, their families, employees, lifesharers, partners and stakeholders. Updates Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025 will be issued regularly and as situations change, including shifts in operational status and new public health guidance. 3. Operational Continuity: We are committed to maintaining critical functions and services with minimal disruption. This may include adjusting staffing, altering service delivery and activating continuity strategies such as remote work or alternate work locations. 4. Responsiveness to Public Health Guidance: Shared Support, Inc. will adhere to directives from federal, state, and local health authorities. Preventative measures and response actions will be adjusted as the pandemic evolves, ensuring our approach remains aligned with the latest public health recommendations. 5. Support for Employees and Stakeholders: Shared Support, Inc. is dedicated to supporting the mental and physical well-being of employees during a pandemic. Resources, such as wellness support and information on community services, will be made available.<\/p>\n<h3>Pandemic Response Strategies:<\/h3>\n<p>1. Prevention and Preparedness o Enact and promote hygiene protocols. o Ensure homes and offices are equipped with necessary sanitation supplies and PPE.  Additional supplies are maintained at the Sunbury Office for distribution. o Develop flexible work arrangements, such as remote work or staggered shifts. As our homes are staffed 24/7, these shifts must continue. 2. Monitoring and Detection o Implement screening protocols for staff and visitors as needed. o Monitor public health reports and communicate updates to all personnel. o Conduct regular checks of supplies and resources to ensure availability. 3. Response Actions o Increase cleaning, sanitation and air circulation of high-contact areas. Ensure air purifiers are functional and filters have been replaced per the maintenance schedule. o Enact social distancing measures in workplaces. While this is not possible in the homes, it can be achieved in the office setting and while in the community. o Suspend non-essential travel and encourage remote work where possible. 4. Recovery and Resumption o Gradually resume normal operations in phases, as public health conditions allow. o Debrief and update the pandemic response plan based on lessons learned. o Offer continued support to employees re-adjusting to post-pandemic work environments. Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025 Sources: World Health Organization (WHO) \u2013 www.who.int Centers for Disease Control and Prevention (CDC) \u2013 www.cdc.gov Updated 06.30.2020; 06/10/2021; 10/2022; 10/25/2024; 4/30/2025<\/p>"}], "printables": [{"title": "Easy Print Disaster Prep", "path": "4 - Disaster Prep/Easy Print Disaster Prep.pdf", "dir": "4 - Disaster Prep", "review": false}], "links": []}, {"slug": "independent-trainings", "title": "Independent Trainings", "color": "#B03A2E", "delivery": "independent", "documents": [{"slug": "fa-cpr-instructions", "title": "FA - CPR Instructions", "revised": null, "pages": 2, "imageOnly": false, "trimmed": false, "html": "<p>hared Support, Inc. is excited for you to take the award-winning blended learning course featuring online simulation learning, which combines web-based learning with an in-class skills session to help prepare you to respond to real-life emergencies. This online course and the in-person skill session must be completed annually for all employees and Lifesharers at Shared Support, Inc. to be alone with an individual. Adult/First Aid/CPR/AED The way to register has significantly changed this year.  It is MUCH easier than previous years.  I will register you for the online course and you will receive an email that contains the link to complete the course.  This email will come from Salesforce Automation Account.  Please keep an eye out for this email as it is the only way you can take the course. IMPORTANT! You must complete the online portion of this course prior to attending your in-person skills session. Please do not wait to do this assignment, you may start your online course as soon as Day 1 of training, but not earlier! You will no longer need to forward the training department anything once you\u2019ve fully completed the online course as we will be able to see your progress within the Red Cross site. The FA/CPR skill session and Fit Testing will be in-person at the Shared Support Training Building. If you do not have your CPR/FA online course completed, you will not be able to attend this class and your trainings may expire, preventing you from working until they are completed. We hope you enjoy your virtual and classroom learning experience. 210 Bridge Avenue Sunbury, PA 17801 Phone: 570. 286.4982 Fax: 570.286.4984 www. sharedsupport.org System Requirements To properly run this course you must use a computer or tablet with a high-speed connection. To optimize your experience with this online course, please make sure your device and browser meet the following minimum requirements. Processors Dual-core processor with a speed greater than or equal to 2.3GHz Memory 4GB Desktop: Microsoft Windows XP/7/8, OS X Snow Leopard 10.6+ Operating System Tablet: iPad iOS 7+ (Safari), Android 4.0.3+ (Google Chrome) This course is not supported on smartphone devices. Browsers IE10+, Chrome 19+, Firefox 27+, Safari 6+ Screen Resolution 1024x768 Bandwidth 512KB/s dedicated or faster. Broadband internet access is recommended. Audio Audio-output capabilities and either speakers or headphones 210 Bridge Avenue Sunbury, PA 17801 Phone: 570. 286.4982 Fax: 570.286.4984 www. sharedsupport.org<\/p>"}, {"slug": "first-aid-cpr-referance-card", "title": "First Aid - CPR Referance Card", "revised": null, "pages": 6, "imageOnly": true, "trimmed": false, "html": ""}, {"slug": "first-aid-cpr-abbreviated-training-review", "title": "First Aid-CPR Abbreviated Training Review", "revised": null, "pages": 27, "imageOnly": false, "trimmed": false, "html": "<h2>Before Giving Care<\/h2>\n<p>What are signs that an emergency has occurred? \uf076Unusual sounds/noises such as screaming, moaning, yelling, breaking glass, crashing metal, screeching tires, etc \uf076Unusual odors- foul or unusually strong chemical odor, smoke, gas, unrecognizable odor, etc \uf076Unusual sights -a stopped vehicle on roadside or in road, downed electrical wires, sparks, smoke, fire. -a person that suddenly collapses or is lying motionless, signs of illness or injury like profuse sweating or uncharacteristic skin color \uf076Unusual behaviors- confusion in a normally alert person, unusual drowsiness, personality or mood changes (ie. Agitation, irritability)<\/p>\n<h2>Barriers To Act<\/h2>\n<p>Barriers to act: There are many different fears and concerns that can cause a person to hesitate to respond in an emergency\u2026 \uf076Being uncertain an emergency actually exists \uf076Being afraid of giving the wrong care or inadvertently causing the person more harm \uf076Assuming someone else already has the situation under control \uf076Fear of catching a disease (*FYI: it is extremely unlikely someone will catch a disease administering first aid.  Use of the standard precautions [wearing latex gloves, using breathing barriers, washing your hands after giving care, etc.] reduces the risk of disease transmission even further!) \uf076Squeamishness related to unpleasant sights, sounds or smells \uf076Fear of being sued. (**the majority of states have Good Samaritan Laws that protect people against claims of negligence when they give emergency care in good faith without accepting anything in return.)<\/p>\n<h2>Good Samaritan Laws<\/h2>\n<p>Good Samaritan laws assume the responder will: \uf076 -Do their best to save a life and prevent further injury and require the responder to use common sense and a reasonable level of skill -Only give the type of emergency care for which they were trained. These laws usually protect responders who act the way a reasonable and prudent person \uf076 would act if in the same situation.  For example.. -Move a person only if the person\u2019s life were in danger -Ask a responsive person, or the parent or guardian of a minor, for permission to help before giving care.  (*Obtain consent) -Check the person for life threatening conditions before giving further care -Call 911 to get EMS on their way -Continue to give care until more highly trained personnel take over (*once you start giving care, you are required to stay until EMS arrives.) ***If the lay responder\u2019s actions were grossly negligent or reckless, or if the responder abandoned the person after starting care, Good Samaritan Laws may not protect the responder***<\/p>\n<h2>Obtain Consent<\/h2>\n<h2>*you must obtain the person\u2019s consent before giving help*<\/h2>\n<p>Obtain consent to give care: \uf076 -state your name -state the type and level of training you have -explain what you think may be wrong -explain what you plan to do -ask if you may help *IF THE PERSON OR PARENT/GUARDIAN SAYS NO, YOU MUST RESPECT THEIR WISHES AND DO NOT TOUCH THEM OR PROVIDE CARE.  If you think their condition is life threatening, call EMS to come and evaluate the situation, but you cannot provide any care yourself. *IF THE PERSON GIVES CONSENT BUT THEN WITHDRAWS IT, YOU MUST STOP IMMEDIATELY.  Stop giving care and call EMS if you haven\u2019t already.  If you try to administer care without consent, you will not be protected by good Samaritan law Implied consent: an unresponsive, confused, or mentally impaired person may not be able to give \uf076 consent.  In these cases, the law assumes the person would give consent if he or she were able to do so- this is implied consent.  Implied consent also applies when a minor needs emergency medical assistance and the  minor\u2019s parent or guardian is not present.<\/p>\n<h2>When to Activate the EMS System<\/h2>\n<p>Emergency situations \uf076 -An injured or ill person that needs medical attention but can\u2019t be moved -In event of a fire, explosion, or presence of poisonous gas -There are downed electrical wires -There has been a serious vehicle collision -For drowning victims Emergency conditions \uf076 -Unresponsiveness or altered level of consciousness such as drowsiness or confusion -Breathing problems or no breathing -Chest pain and/or discomfort or pressure lasting more than a few minutes that goes away and comes back, or radiates to the shoulder, arm, neck, jaw, stomach or back -Persistent abdominal pain or pressure -Conditions including severe external bleeding, vomiting or passing blood, severe burns, suspected poisoning, seizures, signs or symptoms of a stroke, and suspected or obvious injuries to head, neck or spine, broken bone Continue giving care until one of the following occurs: \uf076 -Another trained responder or EMS personnel take over (*remember, you must still remain on the scene if another responder takes over to answer questions EMS may have.) -You\u2019re too exhausted to continue -The scene becomes unsafe<\/p>\n<h2>Taking Action<\/h2>\n<p>There are 3 simple steps to guide your actions in an emergency situation\u2026 \uf076Check -check the scene \u2013 safe to enter, what happened, initial impression of injuries, how many people involved, and is help available? -check the person - are they responsive or unresponsive? Unresponsive \u2013 Tap shoulder, check for breathing 5 to 10 sec Call -call 911 to get EMS on the way \uf076Care -care for the person until EMS arrives *Call or care first?  Most of the time, you will call first then give care.  But, if you are alone you may have to decide whether to call first or give care first. --Call first- any person 12 years or older who is unresponsive, a child or infant whom you witnessed suddenly collapse, an unresponsive child or infant known to have heart problems --Care first- an unresponsive infant or child younger than 12 whom you did not see collapse, a person who is choking, a person who is experiencing a severe allergic reaction and has an epipen, a person who has severe/life threatening bleeding.<\/p>\n<h2>Checking a Responsive Person<\/h2>\n<p>*Interview the person using the \u201cSAM\u201d to gather more information: S- signs are clues to the person\u2019s condition that you can observe for yourself, with \uf076 follow up questions \u2013 What are they feeling or experiencing and the location on body A- Ask the person if they are allergic to any food, medication, or things found in \uf076 the environment (Such as bees) If yes, what type of reaction they\u2019ve  had in the past allergies, and what care they received. M- Ask if taking any prescription or over the counter medications. If they don\u2019t \uf076 know the name of medication, they can tell you the purpose of the medication. Ask for any medical conditions and what they were doing just before they began to feel ill. Checking the person from head to toe: Obtain consent first \uf076 -Tell the person what you\u2019re going to do -Methodically check the body from head to toe, checking the arms last. -While checking the body, ask questions to obtain more information about injuries. -Do not touch or move painful, injured areas on the body.<\/p>\n<h2>Checking an Unresponsive Person<\/h2>\n<p>\uf076Shout, Tap, Shout:  Shout to get their attention, using their name if you know it.  If there is no response, tap them on the shoulder. Then shout again as you are checking for normal breathing. (*NOTE: gasping is not normal breathing) \uf076Check for responsiveness or breathing for no more than 5-10 seconds \uf076If the person does not respond in any way and is not breathing or only gasping, assume cardiac arrest.  Have someone call 911 and get AED/begin CPR.<\/p>\n<h2>Care<\/h2>\n<p>Follow these guidelines: Do no further harm \uf076 Monitor person\u2019s breathing level and level of consciousness \uf076 Help the person rest in the most comfortable position \uf076 Keep the person from getting chilled or overheated \uf076 Reassure the person by telling them you will help, and EMS has been called \uf076 Do not move the person except under the following conditions: \uf076 -You must move them to protect them from danger such as fire, explosion, flood or poisonous gas. -You must move the person to reach another person with a more serious injury or illness. -You must move the person to give proper care i.e. It is necessary to move them to a flat surface to provide CPR. CPR Cardio Pulmonary Resuscitation<\/p>\n<h2>Heart Attack vs. Cardiac Arrest<\/h2>\n<p>Signs/Symptoms of a heart attack: \uf076 -Chest pain that is persistent, lasting longer than 3-5 minutes, or that goes away and comes back. -Discomfort or pain that spreads to one or both arms, the back, shoulder, neck, jaw or upper part of stomach. -Dizziness or lightheadedness. -Trouble breathing \u2013 including noisy, shortness or breathing faster than normal -Nausea or vomiting. -Pale, ashen or slightly bluish skin, especially around face and fingers. -Sweating. -A feeling or anxiety or impending doom. -Extreme fatigue. -Unresponsiveness. Cardiac arrest: \uf076 Cardiac arrest is not the same as a heart attack.  A heart attack occurs when blood flow to part of the heart muscle is blocked, causing part of the heart muscle to die.  Cardiac arrest occurs when the heart stops beating or beats too ineffectively to circulate blood to the brain and other vital organs.  When a person experiences cardiac arrest, you may see them suddenly collapse.  When you check the person, they will not be responsive, not be breathing or only gasping, and the person has no heartbeat. (*Cardiac arrest can be caused by trauma such as a forceful hit to the chest during an accident.)<\/p>\n<h2>Cardiac Chain of Survival<\/h2>\n<p>Cardiac chain of survival: \uf076Recognition of cardiac arrest and activation of EMS system \uf076Early CPR \uf076Early Defibrillation/AED \uf076Early advanced life support \uf076Integrated post-cardiac arrest care \uf076(*It is important to follow the links in the cardiac chain of survival because getting advanced medical help for the person as soon as possible helps improve their chance of survival!)<\/p>\n<h2>How to Perform CPR<\/h2>\n<p>*CPR: (cardiopulmonary resuscitation)- is a skill that is used when a person is in cardiac arrest to keep oxygenated blood moving to the brain and other vital organs until advanced medical help arrives. \uf076You will give sets of 30 chest compressions followed by 2 rescue breaths \uf076Position your hands properly- place heel of one hand in the center of the person\u2019s chest on the breastbone and place your other hand on top of the first hand and interlace your fingers or hold them so your fingers are not on the person\u2019s chest. \uf076Give 30 compressions- position your body so your shoulders are directly over your hands.  This will let you push on the chest using a straight up and down motion which moves the most blood with each push and is also less tiring for you.  Keeping your arms straight, push down at least 2 inches (so it is deep enough to push the blood out of the heart) and then let the chest completely return to its normal position (so the heart can refill with blood). \uf076*Push hard and push fast*  You want to go at a rate of 100-120 compressions a minute. Maintain a smooth steady down and up rhythm and do not pause or lift hands off of the chest during compressions<\/p>\n<h2>How to Perform CPR (Cont.)<\/h2>\n<p>Give a set of 2 rescue breaths- First, open the airway using the head tilt/chin lift \uf076 maneuver.  Place one of your hands on the person\u2019s forehead and two fingers of your other hand on the bony part of the person\u2019s chin, tilting the head back and lifting up on the chin (*for adults, tilt head to past neutral position).  Pinch the person\u2019s nose shut.  Take a normal breath and make a complete seal over the person\u2019s mouth with your mouth, then blow into the person\u2019s mouth to give a rescue breath. Repeat for second rescue breath. *If the first rescue breath does not cause the chest to rise, try re-tilting the head \uf076 to ensure that the airway is properly opened and that the nose and mouth are properly sealed before giving the second rescue breath. (NOTE**blowing too much air, blowing too forcefully or not keeping the person\u2019s head tilted back can force air into the stomach instead of the lungs, which can cause the person to vomit!  So remember\u2026keep the head tilted back, take a normal breath, and blow just enough air to make the chest rise) Each rescue breath should last for approximately 1 second and make the \uf076 person\u2019s chest rise. The process of giving two rescue breaths should take no longer than 10 seconds \uf076 If you are unable or unwilling to give rescue breaths, you can do compressions only \uf076 CPR, giving continuous compressions with no rescue breaths.<\/p>\n<h2>When to Stop CPR<\/h2>\n<p>Continue giving sets of 30 chest compressions and two rescue breaths until: \uf076You notice an obvious sign of life \uf076An AED is ready to use and no other trained responders are available to assist you with using the AED \uf076You have performed ~2 minutes of CPR (5 sets of 30:2) and another trained responder is ready to take over if you are becoming tired \uf076EMS arrives and takes over \uf076You are alone and too exhausted to continue \uf076The scene becomes unsafe<\/p>\n<h2>Choking<\/h2>\n<p>\uf076When someone is choking, give a combination of 5 back blows and 5 abdominal thrusts with the goal of forcing the object out of the airway. \uf076To give back blows- position yourself to the side and slightly behind the person (this position protects you from being taken down if they fall back on you).  Place one arm diagonally across the person\u2019s chest to provide support and bend the person forward at the waist so that the person\u2019s upper body is as close to parallel to the ground as possible.  Firmly strike the person between the shoulder blades with the heel of your other hand.  Each back blow should be a separate/deliberate attempt to dislodge the object. \uf076Abdominal thrusts- stand behind the person with one foot in front of the other for balance and stability.  If possible, place your front foot between the person\u2019s feet.  Wrap your arms around the person\u2019s waist, find the person\u2019s navel, add the adjacent finger above the first.  Make a fist with your hand and place it with the thumb side just above the second finger and cover your fist with your other hand.  Give 5 quick inward and upward thrusts into the person\u2019s abdomen.<\/p>\n<h2>Choking (Cont.)<\/h2>\n<p>Continue giving sets of 5 back blows and 5 abdominal thrusts until the person can \uf076 cough forcefully, speak or breathe, or until the person becomes unresponsive. After a choking incident, even if the person seems fine, they should be \uf076 evaluated by a healthcare provider to make sure there is no damage to the airway or other internal injuries. If the person is pregnant or too large for you to wrap your arms around, give chest \uf076 thrusts instead of abdominal thrusts.  Same process as abdominal thrusts except that you place your hands on the person\u2019s breast bone instead of above the navel. If a person in in a wheelchair, you would give abdominal thrusts as you would for a \uf076 person who was standing\u2026UNLESS the features of the wheelchair make it difficult to give abdominal thrusts, then you\u2019d give them chest thrusts as above. If you are alone and choking- call 911 so they can track your location, and then \uf076 give yourself abdominal thrusts using your hands as you would on another person or bend over and press your abdomen into a firm object like a chair or railing. If the choking person becomes unresponsive: \uf076 Carefully lower them to the ground and begin CPR starting with chest compressions.  After each set of chest compressions/before attempting rescue breaths, open the person\u2019s mouth and look for the object.  If you see the object, attempt to remove it using a finger sweep.  Then give 2 rescue breaths.<\/p>\n<h2>First Aid<\/h2>\n<p>Signs and symptoms of sudden illness: \uf076 -Trouble breathing -Pain.  Such as chest pain, abdominal pain or headache -Changes in level of consciousness -Light headedness or dizziness -Nausea, vomiting, diarrhea, and/or stomach cramps -Fever -Pale or very flushed skin which may be excessively sweaty or dry -Problems seeing or hearing (ie. Blurred vision/double vision/slurred speech) -Numbness, weakness or paralysis -Seizures. First aid for sudden illness: \uf076 -Do no further harm -monitor person\u2019s breathing and level of consciousness -Help them rest in most comfortable position &amp; reassure them that you\u2019ll help/EMS is on the way -Keep them from getting chilled or overheated<\/p>\n<h2>First Aid (Cont.)<\/h2>\n<p>First aid for asthma attacks: \uf076 -Encourage the person to use their prescribed quick relief (rescue) medication (ie-inhaler) -If you haven\u2019t already done so, call 911 if the person\u2019s breathing does not improve in 5-15 minutes after taking their quick relief medication or they become unresponsive. -Stay with the person and monitor their condition until they are able to breathe normally or help arrives Signs/symptoms of allergic reactions and anaphylaxis: \uf076 -Trouble breathing -Swelling of face, neck, tongue or lips -Feeling or tightness in chest or throat -Skin reactions such as hives, itchiness or flushing -Stomach cramps, nausea, vomiting or diarrhea -Dizziness; loss of consciousness **A person experiencing anaphylaxis may have trouble breathing and go into shock, so it is important to act quickly when a person is showing signs and symptoms of anaphylaxis. **The effects of anaphylaxis can be stopped or slowed by administering epinephrine **If epinephrine is administered the person should be seen by a healthcare professional even if they \u201cseem fine\u201d<\/p>\n<h2>First Aid (Cont.)<\/h2>\n<p>\uf076First aid care for diabetic emergencies: -If it is safe for the person to have sugar by mouth, give 15-20 grams of sugar (Only give sugar if the person is responsive, able to answer your questions and able to swallow!  If they are not fully responsive, they may not be able to swallow safely and 911 should be called instead.) *Acceptable forms of sugar include glucose tablets, candies that can be chewed, fruit juice, regular/non diet soda, milk, a spoonful of sugar mixed into water. \uf076First aid care for Seizures: -DO NOT TRY TO HOLD THE PERSON DOWN OR STOP A SEIZURE -DO NOT PUT ANYTHING IN THE PERSON\u2019S MOUTH or PLACE YOUR FINGERS NEAR THEIR MOUTH -Just let the seizure run its course and take steps to protect the person from injury by moving furniture or other objects that could cause harm out of the way. -Check the person for responsiveness and normal breathing<\/p>\n<h2>First Aid For Strokes<\/h2>\n<p>What is a stroke? A stroke is a sudden illness usually caused by a blockage of blood flow to the brain.  A stroke occurs when blood flow to part of the brain is interrupted by a blood clot, resulting in the death of brain cells. Signs and symptoms of stroke \uf076 -Trouble with speech and language, including slurring of words -Drooling or difficulty speaking -Drooping of the features on one side of the face -Trouble seeing out of one or both eyes -Weakness -Paralysis or numbness of the face, arms or legs, especially on one side of the body -A sudden, severe headache -Dizziness or loss of balance; loss of consciousness -Confusion **If you suspect a stroke, \u201cTHINK FAST\u201d: -FACE (ask the person to smile and see if one side of mouth droops) -ARMS (ask the person to raise both arms and see if one arm drifts downward or seems weak) -SPEECH (ask the person to repeat a simple phrase such as the sky is blue, and see if they have trouble speaking or their speech is slurred -TIME (if the person had trouble performing any of these tests or shows any signs of stroke, note the time the signs and symptoms started and call 911 immediately<\/p>\n<h2>First Aid For Shock<\/h2>\n<p>Shock is a progressive, life-threatening condition in which the circulatory system fails to deliver enough oxygen-rich blood to the body\u2019s tissues and organs.  As a result, the body systems begin to fail. *Common causes of shock include severe bleeding, trauma, and severe allergic reactions, but shock can develop quickly after any serious injury or illness. Signs of shock \uf076 -Excessive thirst (*do not give fluids if you suspect someone is in shock) -Nausea/vomiting -Restlessness or irritability -Skin that fells cool or moist and looks pale or bluish -Altered level of consciousness and a rapid/weak heartbeat **If signs of shock are noted, you must call 911 immediately.  Shock can\u2019t be managed by first aid alone and it is important to get the person emergency medical care asap!  Try to help them stay calm and keep them from getting to hot or too cold until EMS arrives.  Do NOT give them anything to eat or drink.<\/p>\n<h2>First Aid For Bleeding<\/h2>\n<p>*A major open wound with heavy bleeding requires prompt action.  Call 911 immediately and take steps to control the bleeding until help arrives. \uf076Cover the area with a sterile gauze pad or other clean dressing and apply direct pressure with your gloved hand until the bleeding stops. \uf076If the blood soaks through the first dressing, place another dressing on top of the first one and apply additional direct pressure (press harder than you did before, if possible.)  DO NOT REMOVE THE BLOOD-SOAKED DRESSINGS BECAUSE DISTURBING THEM MAY DISRUPT CLOT FORMATION AND RESTART BLEEDING. \uf076Once the bleeding stops, apply a bandage over the dressing to maintain the pressure on the wound and hold the dressing in place. \uf076Tourniquets- the only circumstance it would be appropriate to use a tourniquet is if there are multiple people with life-threatening injuries who need care.  (**PLEASE NOTE: we do not teach tourniquets or encourage/allow their use at Shared Support.)<\/p>\n<h2>First Aid For Burns<\/h2>\n<p>Remember to: STOP/COOL/COVER \uf076Stop- stop the burning by removing the person from the source of the injury/burn if it is safe to do so \uf076Cool- cool the burn and relieve pain by using clean cool water for at least 10 minutes and ideally 20 minutes.  Use water that you could drink, and never use ice or ice water as that can cause more damage to the skin. \uf076Cover- cover the burn loosely with a sterile dressing.  Make sure the dressing is clean to avoid infection.<\/p>\n<h2>First Aid For Muscle/Bone/Joint<\/h2>\n<h2>Injuries<\/h2>\n<p>Have the person rest without moving or straightening the injured body part \uf076 R.I.C.E. \uf076 R - Rest and limit use I \u2013 Immobilize/stabilize with splint or elastic bandage C \u2013 Cold If the person can tolerate it, apply a cold pack wrapped in a thin, dry towel to reduce swelling and pain (apply ice for 20 minutes on, 20 minutes off.  Letting ice on longer than 20 minutes at a time can cause tissue damage.) E \u2013 Elevate only if doing so does not cause further pain Watch the person for signs of shock \uf076<\/p>\n<h2>First Aid For Head, Neck,<\/h2>\n<h2>and Spinal Injuries<\/h2>\n<p>\uf076Call 911 immediately \uf076Encourage the person to remain still and not move \uf076As long as the person is breathing, have them remain in the position in which they were found until EMS arrives \uf076-DO NOT MOVE THEM/DO NOT REMOVE THEIR HELMET IF WEARING ONE unless it is absolutely necessary to provide CPR. CONCUSSIONS- a concussion is a common type of traumatic brain injury that involves temporary loss of brain function. \uf076They can result from a seemingly minor bump or a more serious impact \uf076The person may or may not temporarily lose consciousness \uf076If you suspect a person has experienced a concussion you should advise the person to stop the activity they are doing and follow up with a healthcare provider<\/p>\n<h2>First Aid For Heat Related<\/h2>\n<h2>Illnesses<\/h2>\n<p>HEAT RELATED ILLNESSES- (in order of least to most dangerous) \u2013 heat cramps, heat exhaustion, and heat stroke Treatment for heat related illnesses: Heat cramps- move the person to a cool area, encourage them to rest, and have \uf076 them sip on a drink containing electrolytes such as Gatorade or milk.  Once cramps subside, they can usually resume their activity. Heat exhaustion- move the person out of the heat into a cooler environment, \uf076 loosen or remove as much clothing as possible and apply cool, wet cloths to the person\u2019s skin or spray them with cool water.  If the person is responsive and able to swallow, give them a cool drink with electrolytes such as Gatorade, coconut water or milk.  Do not let them drink too quickly or too much. Shared Support suggest that they not return to outdoor activities for the rest of the day, or until fully recovered without displaying any signs or symptoms. Heat stroke- this is life threatening and 911 should be called immediately. \uf076 While you wait for EMS, take steps to rapidly cool the person\u2019s body.  The preferred method of doing this it to immerse them up to their neck in cool water, if you can do this safely.  If not, place ice water-soaked towels for 20 minutes or until the person\u2019s condition improves, or EMS arrives.<\/p>"}, {"slug": "link-to-ted-talk", "title": "Link to TED Talk", "revised": null, "pages": 1, "imageOnly": true, "trimmed": false, "html": ""}, {"slug": "community-participation", "title": "Community Participation", "revised": "July 2026", "pages": 4, "imageOnly": false, "trimmed": false, "html": "<p>Community Participation: When can we bill CP for lifesharing:.<\/p>\n<li>Community Activities -the activities should be local and must relate to the<\/li>\n<p>CP outcomes listed in the individuals ISP. CP can be provided on the weekends, but this is not common practice and must be approved by your supervisor first.<\/p>\n<li>We can occasionally bill CP at a staff persons home, but it cannot occur<\/li>\n<p>regularly. The state does not define \u201coccasionally\u201d, so our interpretation is no more than 2 times per month.<\/p>\n<h3>When can we NOT bill CP for Lifesharing:<\/h3>\n<li>drives from the person\u2019s home or returning to the person\u2019s home can\u2019t be<\/li>\n<p>CP.<\/p>\n<li>We can no longer bill CP while at the office. Must clock into Lifesharing if at<\/li>\n<p>the office. This includes swimming at the office as well. If someone is swimming at the office staff should be clocked into Lifesharing.<\/p>\n<li>We can no longer bill CP while in the lifesharing home.<\/li>\n<li>Travel to/from appointments/hospital. This includes med clinics,PT, OT, etc.<\/li>\n<li>At appointments or hospital<\/li>\n<li>If the person is spending time with a friend at the friends licensed CLA<\/li>\n<p>home.<\/p>\n<li>If there are more than 3 individuals participating in an activity together, all<\/li>\n<p>receiving CP services from Shared Support.<\/p>\n<li>When at segregated activities such as ARC events, Special Olympics, etc.<\/li>\n<li>Can\u2019t bill more than 8 hours/day but can be done outside of the 8a-5p<\/li>\n<p>timeframe for individuals in lifesharing.<\/p>\n<li>For ISP/Circle Meetings<\/li>\n<li>If an individual is just out for a drive with no set destination this is not CP.<\/li>\n<li>Staff are not permitted to complete personal errands while on shift or<\/li>\n<p>during CP time.<\/p>\n<h3>When can we bill CP for CLA:<\/h3>\n<li>Community Activities- the activities should be local and must relate to the<\/li>\n<p>CP outcomes listed in the individuals ISP.<\/p>\n<li>At a staff person\u2019s home, but it can not occur regularly. Must only be<\/li>\n<p>occasionally. The state does not define \u201coccasionally\u201d, so our interpretation is 2 time per month.<\/p>\n<h3>When can we NOT bill CP for CLA:<\/h3>\n<li>drives from the person\u2019s home or returning to the person\u2019s home can\u2019t be<\/li>\n<p>CP.<\/p>\n<li>At the person\u2019s home<\/li>\n<li>At the Shared Support Office---this includes swimming at the office. If<\/li>\n<p>someone is swimming at the office staff should be clocked into CLA.<\/p>\n<li>Travel to/from appointments or the hospital.<\/li>\n<li>Appointments/hospital visits. This includes med clinics, PT, OT, etc.<\/li>\n<li>If an individual is just out for a drive with no set destination this is not CP.<\/li>\n<li>If more than 3 individuals are participating in an activity together, all<\/li>\n<p>receiving CP services through Shared Support.<\/p>\n<li>When at segregated activities such as ARC events, Special Olympics, etc.<\/li>\n<li>Can\u2019t bill more than 8 hours/day. Also, not able to bill outside of the hours<\/li>\n<p>of 8a-5p, Monday-Friday.<\/p>\n<li>For ISP/Circle Meetings<\/li>\n<li>Staff are not permitted to complete personal errands while on shift or<\/li>\n<p>during CP time. ***All activities throughout the day should be related to CP ISP outcomes. If supporters are struggling to come up with outcome based ideas for day program, please reach out your Program Specialist for direction. ***Each CP entry will require a checklist that staff must complete. Staff should check each item they worked on during that time. The checklist is required and will not allow staff to clock out without completing the checklist. There is also a comment section for each CP entry that is required. In the comment section staff should indicate the locations they visited during that time. Only the location is required, please do not write a narrative. For example, grocery store, mall, library, park, etc.<\/p>\n<h3>Activity:<\/h3>\n<h3>How to clock in?<\/h3>\n<p>Participating in a community activity CP that\u2019s related to CP outcome Engaging in a CP activity at a staff CP members home once per month Circle Meeting or ISP Meeting Lifesharing or CLA Med Clinic or any doctor\u2019s appointment Lifesharing or CLA Travel to and from doctor\u2019s visits Lifesharing or CLA Visiting the Shared Support Office Lifesharing or CLA Swimming at the Shared Support Office Lifesharing or CLA Going for a drive with no set destination Lifesharing or CLA If an individual works for Shared Support Lifesharing or CLA Individual is spending time in her/his Lifesharing or CLA home The drive from the persons home in the Lifesharing or CLA am and the drive to the persons home at the end of the day. If the individual spends time with more Lifesharing or CLA than 3 others who are receiving CP services through Shared Support Med Pickup -You can bill CP for this if you have a CP activity before and after med pick up and you\u2019re just swinging by to grab the meds. -If the only reason you are going into the community is to pick up the meds, then you should be clocked into Lifesharing or CLA, not CP. Shared Support Gym Lifesharing or CLA<\/p>"}, {"slug": "medicaid-waiver-compliance-policy", "title": "Medicaid Waiver Compliance Policy", "revised": "08.26.21", "pages": 5, "imageOnly": false, "trimmed": false, "html": "<h3>POLICY:<\/h3>\n<p>Medicaid Waiver Compliance<\/p>\n<h3>SCOPE OF POLICY:<\/h3>\n<p>This policy applies to all individuals supported by Shared Support, employees, independent contractors, Administrative Entities, Department of Human Services and other stakeholders of Shared Support, Inc.<\/p>\n<h3>STATEMENT OF POLICY:<\/h3>\n<p>Shared Support Inc. is a private PA non-profit provider of Medicaid waiver services for adults and children who are diagnosed with Intellectual Disabilities or Autism. It is the standard of the organization to comply with federal and state Medicaid and Medicaid Waiver Guidelines in all aspects of the operations and administrative functions. It is the policy of Shared Support Inc. to implement screening and oversight practices in an effort to ensure that any agent of the organization does not engage in fraudulent or any other illegal behavior or acts. Shared Support has implemented a compliance program with a crosswalk of documentation to validate claims and payment to the organization.<\/p>\n<h3>IMPLEMENTATION OF POLICY:<\/h3>\n<p>Personnel and Initial Screening All Operators of the corporation including board members, executive staff and fiscal staff will receive the following clearances: PA Criminal History FBI fingerprint Criminal History OIG Exclusion List Excluded Parties List *includes LEID, DHS Med check, SAM For any staff working with children under the age of 18 the organization will obtain FBI finger print, PS Criminal History Check, and Child Abuse Clearances prior to working on shift. These clearances will be run every five years. All employees will have completed PA criminal history clearances prior to reporting for orientation training.  If an employee has lived outside of the Commonwealth during the two years preceding employment, and FBI check will also be completed prior to working in the employee working in any home alone. Clearance Monitoring The organization will complete monthly screenings for the Inspector General Exclusion List and the Excluded Parties list. 1 Effective 01/01/11; Revised 10/12, 01/13/15, 09/19/18; 08/26/2021 Every five years the organization will complete FBI finger prints clearance and PA Criminal History. Provider Qualifications Shared Support will ensure that all individuals who drive consumers will have a valid PA Driver\u2019s License, Insurance Registration and Inspection for their personal vehicles. Further Screening Shared Support also implements best practice standards in the field of Human Resources by obtaining two or three positive references from previous employers. At least one reference must be obtained from a current or previous supervisor.<\/p>\n<h3>FISCAL PROCEDURES:<\/h3>\n<p>Billing Process Billing will occur based on the service W Code, units of service, and the Office of Developmental Programs (ODP) set rate. The service will occur prior to billing for payment. The CFO is responsible for maintaining updates to the Services and Supports Directory, PROMISe enrollment, site and service updates and annual provider qualification. The CFO is also responsible for designating responsibilities for maintenance of Provider Qualification documentation. Billing for Residential Services The Program Specialist will obtain a weekly attendance record from the Lifesharing provider or from the community living arrangement (CLA), review for accuracy and submit to the Program Director. The Program Director will review and submit an attendance record to the CFO for all residential services on a weekly basis. The CFO will bill the number of days the consumer was in attendance following attendance rules issued by the Department. The CFO will maintain the weekly attendance records at the Administrative office. In order to bill for residential services, a minimum of 8 non-contiguous hours of care per day must be provided in a 24-hour period beginning at 12:00 a.m. and ending at 11:59 p.m. Once this requirement is met, a decision of billing \u201cwith day\u201d or \u201cwithout day\u201d for residential habilitation services will be made based upon the weekly program documentation submitted. \u201cWithout day\u201d is any day that the person solely receives services that are part of the residential habilitation service or the person receives less than 5 hours per day of services or unpaid supports that are not included in the residential habilitation service. \u201cWith day\u201d is any day that the person receives 5 or more hours of services and/or unpaid supports that are not included in the residential habilitation service. Medical leave requires recording both the admission and discharge dates to a hospital or nursing facility. Day of admission to the hospital or nursing facility will not be billed regardless of hours of service rendered by Shared Support, while day of discharge will be billed regardless of hours of services rendered. A daily service note will be completed by the Direct Support Staff and Life Sharing Providers 2 Effective 01/01/11; Revised 10/12, 01/13/15, 09/19/18; 08/26/2021 upon service delivery and a monthly progress note will be completed by the Program Specialist for all residential services.  Service notes will document the provision of the daily services rendered while monthly progress notes will document progress toward attainment of goals and outcomes as per ODP Bulletins 00-17-02, Claim and Service Documentation for Providers of Consolidated and P/FDS Waiver Services and TCM and 00-18-04, Interim Technical Guidance for Claim and Service Documentation. Billing for Intermittent Services The CFO shall bill for intermittent services based on the W Code, 15-minute units of service provided, and the ODP set rate. Shared Support provides the following Intermittent Services: Community Participation Supports, Home and Community Support Services, Companion Services, Support Employment, Temp Respite and Shift Nursing (list is subject to change). The units of service provided are prescribed in the person\u2019s ISP. The service shall be documented by a service note completed by the Direct Support Staff upon service delivery and a monthly progress note completed by the Program Specialist, documenting progress toward achievement of goals and outcomes.  The service note shall be submitted to the Program Specialist for review on a weekly basis and the Program Specialist shall forward to the fiscal office for the purpose of reconciliation with payroll, specifically to ensure that the time paid the staff matches the program service note. Further review will include; Crosschecking all staff with program participants to ensure that staff have not billed for duplicate service provision. Annual Reporting Shared Support will participate in and ensure the completion of an independent annual audit to ensure compliance with Chapter 6100 Regulations or other applicable Department issued regulations or guidelines. Results of the audit will be utilized to refine practices and ensure compliance. Any findings of error or fraud during the audit procedure will be reported to the Bureau of Program Integrity in the Pennsylvania Department of Human Services.<\/p>\n<h3>PROGRAM OPERATIONS:<\/h3>\n<p>Shared Support Inc. will implement all services in compliance with the following guidelines, standards and consumer need: All services will be provided based on the needs identified in the ISP All Services will be provided based on the service, frequency and duration authorized by the Administrative Entity as prescribed in the ISP. All services will be provided within the guidelines of each service definition. The habilitative team will meet monthly with the independent Supports Coordinator and participate in a monitoring of services for all individuals who participate in the 3 Effective 01/01/11; Revised 10/12, 01/13/15, 09/19/18; 08/26/2021 consolidated waiver program. The team will meet quarterly with all participants in the PFDS waiver and their independent supports coordinators. Shared Support Program Specialists, Directors and Executive Staff will review data and progress to ensure that the participant is receiving the most appropriate service at all times. This information will be provided to the Participant, Family if desired by participant, Supports Coordinator and Administrative Entity. All licensed residential services will comply with 6400, 6500 or 3800 regulations determinate on the license held at each particular site.<\/p>\n<h3>COMPLIANCE MONITORING AND OVERSIGHT:<\/h3>\n<p>Shared Support Inc. has designated a Compliance Manager to work out of the Administrative office. It will be the role of the manager to complete a quarterly compliance report. The compliance report will include a review of billing, payroll, personnel and program documentation for a randomly selected sample of 10% of the participants. The sample will include participants served in all W codes. The Compliance Manager will report findings to the CEO. The CEO will report incidents of non-compliance or fraud to the Board of Directors on a quarterly basis. The Compliance Manager will complete internal audits to ensure that the following errors or fraudulent acts have not occurred:  (1) over-billing; (2) billing without proper documentation; (3) documentation that does not support the service definition; (4) for multiple service recipients, billing for the incorrect service; (5) billing for activities that are not in the ISP. The Compliance Manager will review the cross walk of the following internal documents: ISP; daily service notes; monthly progress notes; staff electronic timekeeping record; provider qualifications; billing; attendance records. The name and contact number of the Compliance Manager will be distributed to all staff upon hire and annually thereafter. All staff will be made aware of the anonymous compliance number which is available for all personnel to report concerns 24 hours per day. The intent of this communication is for all stakeholders to have a mechanism to report any potential fraudulent acts or other acts that may affect the health and safety of the individual or potentially threaten the integrity of the organization. Upon the report or allegation of non-compliance or any incident that is not consistent with all policies and procedures of Shared Support, the Compliance Manager will initiate an investigation.  The CEO will be notified and the results of the investigation will be reported to the Board. The CEO will work with the appropriate personnel to develop a plan of corrective action if the allegation is founded. The Compliance Manager may not be terminated without the Board&#x27;s authorization. 4 Effective 01/01/11; Revised 10/12, 01/13/15, 09/19/18; 08/26/2021 All staff will be trained annually on the Shared Support Compliance Policy. The Program Directors and/or the COO and CEO will participate in compliance monitoring by the Administrative Entity and at ODP&#x27;s direction. FINDING OF NON-COMPLIANCE OR FRAUD Upon the internal discovery of an incident of non-compliance or fraud the following procedure will be implemented: The CEO will initiate a self -audit protocol as outlined in the guidelines issued by the Bureau of Program Integrity, &quot;Medical Assistance Self Audit Protocol&quot;. Option 1- Review 100% of all claims. Option 2- A sample of the claims will be reviewed Option 3- All similar service claims will be reviewed Upon completion of the self- audit the CEO will approve a Self-Disclosure report in compliance with the MA provider Self Audit guidelines and review the findings with ODP and BPI. The CEO will ensure that a plan of correction and restitution is developed and implemented. 5 Effective 01/01/11; Revised 10/12, 01/13/15, 09/19/18; 08/26/2021<\/p>"}], "printables": [{"title": "Easy Print Medicaid Waiver-CP Review", "path": "5 - Independent Trainings/3 - Medicaid waiver & CP/Easy Print Medicaid Waiver-CP Review.pdf", "dir": "5 - Independent Trainings/3 - Medicaid waiver & CP", "review": true}, {"title": "Medicaid Waiver & CP Rules Packet", "path": "5 - Independent Trainings/3 - Medicaid waiver & CP/Medicaid Waiver & CP Rules Packet.pdf", "dir": "5 - Independent Trainings/3 - Medicaid waiver & CP", "review": true}, {"title": "Easy Print Independent Trainings", "path": "5 - Independent Trainings/Easy Print Independent Trainings.pdf", "dir": "5 - Independent Trainings", "review": true}], "links": [{"title": "Time & Attendance help guide", "url": "https://sharedsupport.github.io/ICM-STA-Guide", "blurb": "How to clock in, clock out, and record mileage in iCM. Replaces the old DCI cheat sheet."}]}, {"slug": "alternative-routes", "title": "Alternative Routes", "color": "#4E8C8A", "delivery": "day2", "documents": [{"slug": "diabetes-and-diet-ppt", "title": "Diabetes and Diet PPT", "revised": null, "pages": 22, "imageOnly": false, "trimmed": false, "html": "<h2>Objectives<\/h2>\n<p>\uf097Identify the CQC regulation for nutrition &amp; hydration \uf097Discuss the dietary management of diabetes \uf097Introduction to dietary advice for overweight &amp; malnourished patients \uf097Outline the importance of screening for malnutrition with examples Regulation 14: Meeting nutritional &amp; hydration needs (2014) \uf097People must have enough to eat &amp; drink to meet their needs \uf097People must have nutritional needs assessed &amp; food provided to meet their individual needs \uf097Must receive support with nutrition &amp; hydration if needed \uf097Provide a variety of nutritious &amp; appetising food \uf097Appropriate temperature \uf097Culturally appropriate \uf097Preference &amp; choice \uf097Prompts, encouragement, eating aids \uf097Follow prescribing plan for supplements \uf097Regular assessment of needs \uf097Staff should know when specialist nutritional advice is needed &amp; how to refer Regulation 14: Meeting nutritional &amp; hydration needs (2014) \uf097When avoidable harm or exposure to significant risk of harm is identified\u2026. \uf097CQC can prosecute for breach of regulation 14 without serving a warning notice \uf097CQC will refuse registration if providers cannot provide evidence of compliance<\/p>\n<h2>Points to consider\u2026<\/h2>\n<p>\uf097Priority of the person\u2019s diabetes management \uf097Individualised assessment &amp; treatment \uf097No \u2018one size fits all\u2019 approach \uf097Diagnosis,  prognosis &amp; quality of life \uf097Social aspects of eating \uf097Pleasure from eating \uf097Respect individuals\u2019 choices Which Nutrient Affects Blood Glucose? All affect blood glucose! Which Nutrient Affects Blood Glucose? \uf097Food is chewed to start breaking it down \uf097Food is broken down further in the stomach \uf097Carbohydrate is broken down into glucose \uf097Shortly after eating carbohydrate blood glucose starts to rise \uf097Body cells use the glucose for fuel or store it for later<\/p>\n<h2>Why is Diet Important?<\/h2>\n<p>Major influence on diabetes management &amp; health \uf097Blood glucose control \uf097Long &amp; short term complications \uf097Body fat and insulin resistance \uf097Risk of other diet related diseases \uf097Vitamins, Minerals, Protein &amp; Fats are essential for good health<\/p>\n<h2>Diet Myths \u2013 True or False<\/h2>\n<h3>\uf097People with diabetes shouldn&#x27;t have:<\/h3>\n<p>\uf097Bananas, grapes,  melon &amp; mango \uf097Sweet foods and puddings \uf097Lots of sugary drinks<\/p>\n<h3>\uf097People with diabetes should:<\/h3>\n<p>\uf097Use diabetic products \uf097Always snack between meals \uf097Follow a \u2018special\u2019 or \u2018diabetic\u2019 diet Healthy Eating<\/p>\n<h2>Healthy Eating in Care Homes<\/h2>\n<p>\uf097Regular &amp; Balanced Meals \uf097Portion control \uf097Healthy menu planning &amp; cooking \uf097Appetising meals &amp; variety \uf097Healthier snack &amp; pudding options \uf097Limit processed or \u2018junk\u2019 foods \uf097Avoid sugary drinks &amp; added sugars \uf097Occasional \u2018treat\u2019 foods are fine Healthy Eating How much is important \uf097Regular meals spreads carbs out \uf097Avoid added sugars &amp; sugary food/drinks \uf097Fruit &amp; fruit juices \uf097Don\u2019t double up on starches \uf097Smaller portions of  puddings The type is also important \uf097Porridge, basmati rice, new potatoes, seeded bread, whole grain starches &amp; cereals<\/p>\n<h2>Weight Management<\/h2>\n<p>Simple Tips for weight management in care settings \uf097Regular Meals \uf097Portion Control \u2013 even healthy food can affect weight! \uf097Healthy, tasty menu choices and healthy snack options \uf097Healthier puddings &amp; desserts or small portions \uf097Avoid added sugars (drinks &amp; foods) \uf097Non restrictive approach with occasional \u2018treat\u2019 foods Simple swaps and small changes \uf097Swap Chocolate pudding for chocolate Muller light \uf097Swap Shortcake biscuits for rich tea \uf097Change drinks to diet, sugar free, no added sugar \uf097Swap sugar for sweeteners<\/p>\n<h2>Weight Management<\/h2>\n<h3>What would you change?<\/h3>\n<h3>Breakfast:<\/h3>\n<p>Large bowl of cereal with milk, 2 Toast with butter, 1 glass of fruit juice Mid morning: 3 plain digestives with cup of tea<\/p>\n<h3>Lunch:<\/h3>\n<p>Tuna mayo sandwich, 2 slices granary bread  with 5 teaspoons mayonnaise and packet of crisps Evening Meal: Beef casserole with large portion of mashed potato (made with butter) and full portion sponge pudding with custard<\/p>\n<h3>Supper:<\/h3>\n<p>3 plain digestives with cup of tea<\/p>\n<h2>Weight Management<\/h2>\n<h3>What would you change?<\/h3>\n<h3>Breakfast:<\/h3>\n<p>Large bowl of cereal with milk, 2 Toast with butter, 1 glass of fruit juice Mid morning: 3 plain digestives with cup of tea<\/p>\n<h3>Lunch:<\/h3>\n<p>Tuna mayo sandwich, 2 slices granary bread  with 5 teaspoons mayonnaise and packet of crisps Evening Meal: Beef casserole with large portion of mashed potato (made with butter) and full portion sponge pudding with custard<\/p>\n<h3>Supper:<\/h3>\n<p>3 plain digestives with cup of tea<\/p>\n<h2>Weight Management<\/h2>\n<h3>What would you change?<\/h3>\n<h3>Breakfast:<\/h3>\n<p>Large bowl of cereal with milk, 2 Toast with butter, 1 glass of fruit juice Mid morning: 3 plain digestives with cup of tea<\/p>\n<h3>Lunch:<\/h3>\n<p>Tuna mayo sandwich, 2 slices granary bread  with 5 teaspoons mayonnaise and packet of crisps Evening Meal: Beef casserole with large portion of mashed potato (made with butter) and full portion sponge pudding with custard<\/p>\n<h3>Supper:<\/h3>\n<p>3 plain digestives with cup of tea<\/p>\n<h2>Weight Management<\/h2>\n<h3>What would you change?<\/h3>\n<h3>Breakfast:<\/h3>\n<p>Small bowl of cereal with milk, 1 Toast with butter, 1 glass of fruit juice Mid morning: 3 rich tea biscuits with cup of tea<\/p>\n<h3>Lunch:<\/h3>\n<p>Tuna mayo sandwich, 2 slices granary bread  with 5 teaspoons light mayonnaise and packet of crisps Evening Meal: Beef casserole, extra veg with medium portion of mashed potato (made with butter) and small portion sponge pudding with custard<\/p>\n<h3>Supper:<\/h3>\n<p>3 rich tea biscuits with cup of tea Weight Management Reducing the portions with some simple swaps  saves approximately 900 - 1000 calories per day! Balance the Plate<\/p>"}, {"slug": "alternative-routes-cover-sheet", "title": "Alternative Routes Cover Sheet", "revised": null, "pages": 1, "imageOnly": true, "trimmed": false, "html": ""}, {"slug": "diabetes-total-carbohydrate", "title": "Diabetes Total Carbohydrate", "revised": null, "pages": 2, "imageOnly": false, "trimmed": false, "html": "<h2>Total<\/h2>\n<h2>Carbohydrate<\/h2>\n<h2>What It Is<\/h2>\n<p>Carbohydrate is found primarily in plant foods; the exception is dairy products, which contain milk sugar (lactose). There are several types of carbohydrate:<\/p>\n<li>Sugars are the smallest type of carbohydrate and include single sugars<\/li>\n<p>and those with two sugar molecules joined together.<\/p>\n<li>Sugar alcohols are carbohydrates that chemically have characteristics of<\/li>\n<p>both sugars and alcohols.<\/p>\n<li>Starches are made up of many of glucose molecules linked together into<\/li>\n<p>long chains.<\/p>\n<li>Dietary fiber is made up of many sugar molecules linked together. But<\/li>\n<p>unlike starches, fiber is bound together in such a way that it cannot be readily digested. There are two types of dietary fiber: soluble and insoluble.<\/p>\n<h2>Where It Is Found<\/h2>\n<li>Sugars are found naturally in foods such as dairy products, fruits, and<\/li>\n<p>vegetables. Sugars are also added to foods and beverages for taste, texture and preservation, and are often found in foods such as grain-based and dairy desserts, sugar-sweetened beverages, and sweets.<\/p>\n<li>Sugar alcohols are found naturally in small amounts in a variety of fruits<\/li>\n<p>and vegetables. Sugar alcohols are also commercially produced from sugars and starch and added as reduced-calorie sweeteners to foods, such as Carbohydrate is one of three chewing gum, frostings, grain-based and dairy desserts, and sweets. macronutrients in food that provide<\/p>\n<li>Starches are found naturally in beans and peas (such as garbanzo beans,<\/li>\n<p>calories, or \u201cenergy,\u201d for the body. kidney beans, lentils, and split peas), grains (such as barley, brown rice, Each gram of carbohydrate provides corn, oats, and wheat), and vegetables (such as carrots and potatoes). 4 calories. Starches can also be added to foods during processing or preparation to thicken or stabilize them.<\/p>\n<li>Dietary fiber is found in beans and peas, fruits, nuts and seeds,<\/li>\n<p>vegetables, and whole grain foods (such as brown rice and whole grain breads, cereals, pasta).<\/p>\n<h2>What It Does<\/h2>\n<li>Sugars and starches are the body\u2019s main sources of calories. Your body<\/li>\n<p>breaks down these carbohydrates into glucose. Glucose in the blood (often referred to as \u201cblood sugar\u201d) is the primary energy source for the body. Sugars are also used to sweeten, preserve, and improve the functional attributes of food.<\/p>\n<li>Sugar alcohols provide a sweet taste with fewer calories per gram than<\/li>\n<p>table sugar (sucrose), and are commonly used in place of sugar in food. Sugar alcohols also have other functions in food, including producing a \u201ccooling\u201d sensation in the mouth, adding bulk and texture to food, and helping to retain moisture and prevent browning.<\/p>\n<li>Dietary fiber promotes intestinal regularity and helps prevents constipation.<\/li>\n<p>Fiber also makes you feel full, slows digestion and the rate at which carbohydrates and other nutrients are absorbed into the bloodstream, and can interfere with the absorption of dietary fat and cholesterol. Total Carbohydrate 1 http://www.fda.gov/nutritioneducation<\/p>\n<h2>Health Facts<\/h2>\n<li>Most Americans exceed the recommended limits for added<\/li>\n<p>Nutrient - Dense: Defined. sugars and do not get the recommended amounts of dietary Nutrient-dense foods and beverages contain fiber in the diet. vitamins, minerals, dietary fiber, and other beneficial<\/p>\n<li>Diets lower in added sugars and higher in dietary fiber and<\/li>\n<p>substances that may have positive health effects. (Footnote asterisk). nutrient-dense foods and beverages can reduce the risk of They are also naturally lean or low in saturated fat and have little or no added saturated fat, sugars, cardiovascular disease. refined starches, and sodium.  Examples of nutrient<\/p>\n<li>The Dietary Guidelines for Americans recommends consuming<\/li>\n<p>dense foods are: beans and peas, eggs, fat-free less than 10% of calories per day from added sugars and (skim) and low-fat (1%) dairy products, fruits, lean at least half of total grains as whole grains, and limiting the meats and poultry, seafood, unsalted nuts and intake of refined grains and products made with refined grains. seeds, vegetables, and whole grains.<\/p>\n<h3>For Monitoring Total Carbohydrate in Your Diet<\/h3>\n<p>Use the Nutrition Facts Label as your tool for monitoring consumption of total carbohydrate. The Nutrition Facts Label on food and beverage packages shows the amount in grams (g) of total carbohydrate and the Percent Daily Value (%DV) of total carbohydrate in one serving of the food. The Nutrition Facts Label also lists the types of carbohydrate that make up the total carbohydrate in a product. This includes the amount in grams (g) per serving of dietary fiber and sugars and the %DV of dietary fiber. Food manufacturers may also voluntarily list the amount in grams (g) per serving of soluble and/or insoluble fiber, sugar alcohols, and \u201cother carbohydrate.\u201d \u201cOther carbohydrate\u201d generally reflects the amount of starch in a product and is defined as the difference between total carbohydrate and the sum of dietary fiber, sugars, and sugar alcohols. The Daily Value for total carbohydrate is 300 g per day. This is based on a 2,000 calorie diet \u2014 your Daily Value may be higher or lower depending on your calorie needs. When comparing foods, look at the %DV of total carbohydrate. The goal is to get 100% of the Daily Value for total carbohydrate on most days. And remember:<\/p>\n<li>5% DV or less of total carbohydrate per serving is low<\/li>\n<li>20% DV or more of total carbohydrate per serving is high<\/li>\n<p>Focus on eating nutrient-dense foods that contain dietary fiber combined with other beneficial nutrients and naturally occurring sugars. Switch from refined to whole grain versions of commonly consumed foods (such as breads, cereals, pasta, and rice), and try to make them at least half of your daily grain choices. Try options that don\u2019t include added saturated fats, sugars, or sodium, such as bread instead of croissants, English muffins instead of biscuits, and plain popcorn instead of buttered. Choose fruit (fresh, frozen, dried, or canned in 100% natural juice) as snacks, salads, or desserts. Keep raw, cut-up vegetables handy for quick snacks \u2013 choose colorful dark green, orange, and red vegetables, such as broccoli florets, carrots, and red peppers. Whenever possible, choose water, fat-free (skim) or low-fat (1%) milk, 100% fruit or vegetable juice, or unsweetened tea or coffee instead of sugar-sweetened beverages (such as such as energy drinks, flavored waters, fruit drinks, soft drinks, and sports drinks). Add beans and peas or unsalted nuts and seeds to your daily meals. These are also great sources of dietary fiber and protein. Limit snacks and sweets (such as cakes, candies, cookies, ice cream, pastries, and puddings). Consume smaller portions of foods and beverages that are higher in sugars or consume them less often. Total Carbohydrate 2<\/p>"}, {"slug": "diabetes-free-foods", "title": "Diabetes free-foods", "revised": null, "pages": 1, "imageOnly": false, "trimmed": false, "html": "<h2>Free Foods<\/h2>\n<h2>Day 1 \u2022 LUNCH<\/h2>\n<p>In most people, moderate amounts of these foods have little to no impact on your blood sugars<\/p>\n<h2>Veggies<\/h2>\n<h2>All You Can Eat:<\/h2>\n<p>asparagus meats bean sprouts cheeses beet green eggs broccoli oils brussels sprouts salt &amp; pepper cabbage<\/p>\n<h2>Most:<\/h2>\n<p>cauliflower celery vinegars cucumber seasonings green peppers lettuce marrow mushrooms onions (1/2 cup) orange peppers parsley radishes red peppers rhubarb spinach swiss chard tomato (only 1) yellow or green beans zucchini www.diabetesdaily.com/recipes<\/p>"}, {"slug": "diabetes-snacks", "title": "Diabetes-snacks", "revised": null, "pages": 1, "imageOnly": false, "trimmed": false, "html": "<h2>15 carbs Snack List<\/h2>\n<p>These snacks have about 15 grams of carbohydrates. For packaged foods, always double-check the label. Beets<\/p>\n<h2>Fruit<\/h2>\n<h2>Dairy<\/h2>\n<p>Borscht Broccoli Apple, small, 2\u201d Milk, 8 oz Brussels sprouts Apricots, 5.5 oz Chocolate Milk, 8 oz Cabbage Banana, extra-small, 4 ounces Soy Milk, 8 oz Carrots Blueberries or Blackberries, 3/4 cup Yogurt, 1/2 cup Cauliflower Cantaloupe, honeydew, papaya, Frozen yogurt Celery cubed, 1 cup Egg nog, 1/2 cup Chayote Cherries, 12 Rice drink, unflavored, 1 cup Cucumber Dates, 3<\/p>\n<h2>Drinks<\/h2>\n<p>Eggplant Figs, 2 medium Green beans Grapefruit, large, 1/2 4oz of most juices Green onions or scallions Grapes, small, 3 oz or about 17 Hot chocolate Jicama Kiwi Lower-sugar sports drink Kohlrabi Mango, cubed, 1/2 cup Vegetable juice cocktail Leeks Nectarine, small Mung bean sprouts Orange, small<\/p>\n<h2>Packaged Snacks<\/h2>\n<p>Mushrooms Peach, medium Okra Pear, large, 1/2 5 Triscuits Onions Pineapple, cubed, 3/4 cup Jello Sugar Free puddings Oriental radish or daikon Plums, small, 5 ounces 2 Rice Cakes Pea pods Raspberries, 1 cup<\/p>\n<h2>Other Fun St uff<\/h2>\n<p>Peppers, all varieties Strawberries, 1 1/4 cup Radishes Tangerines, small, 8 oz Peanuts, 2 1/2 oz Rutabaga Watermelon, cubed, 1 1/4 cup Small tortilla pizza Sauerkraut Slice of bread with peanut butter<\/p>\n<h2>Vegetables<\/h2>\n<p>Soybean sprouts Greek yogurt with berries or a Spinach (typically 1.5 cups of cooked or 3 cups raw) dash of balsamic vinegar Sugar snap peas A few crackers and cheese Amaranth Summer squash Hummus and veggies Artichoke Swiss chard Pickles Artichoke hearts Tomato Asparagus Turnips<\/p>\n<h2>Desserts<\/h2>\n<p>Baby corn Water chestnuts Bamboo shoots Zucchini Small brownie Bean sprouts 2\u201d chocolate chip cookie www.diabetesdaily.com/recipes<\/p>"}, {"slug": "diastat-quick-reference", "title": "Diastat Quick Reference", "revised": null, "pages": 3, "imageOnly": true, "trimmed": false, "html": ""}, {"slug": "epi-pen", "title": "Epi Pen", "revised": null, "pages": 2, "imageOnly": false, "trimmed": false, "html": "<h2>How to use an EpiPen<\/h2>\n<h2>\u00ae<\/h2>\n<h2>(epinephrine injection, USP) Auto-Injector<\/h2>\n<h2>1<\/h2>\n<h2>PREPARE<\/h2>\n<p>Remove the Auto-Injector from the clear carrier tube. Flip open the yellow cap of your EpiPen\u00ae or the green cap of your EpiPen Jr\u00ae carrier tube. Tip and slide the auto-injector out of the carrier tube. Hold the auto-injector in your fist with the orange tip pointing downward.<\/p>\n<h3>NEVER-SEE-NEEDLE \u00ae helps with protection. Protects against needle<\/h3>\n<p>Blue to the sky, orange to the thigh\u00ae. exposure before and after use. With your other hand, remove the blue NOTE:<\/p>\n<li>The needle comes out of the orange tip.<\/li>\n<p>safety release by pulling straight up<\/p>\n<li>To avoid an accidental injection, never put your thumb, fingers or hand over the<\/li>\n<p>without bending or twisting it. orange tip. If an accidental injection happens, get medical help right away.<\/p>\n<h2>2<\/h2>\n<h2>ADMINISTER<\/h2>\n<p>If you are administering to a young child, hold the leg firmly in place while administering an injection. Place the orange tip against the middle of the outer thigh (upper leg) at a right angle (perpendicular) to the thigh. Swing and push the auto-injector firmly until it \u201cclicks.\u201d The click signals that the injection has started. Hold firmly in place for 3 seconds (count slowly 1, 2, 3). Remove the auto-injector from the thigh. The orange tip will extend to cover the needle. If the needle is still visible, do not attempt to reuse it. Massage the injection area for 10 seconds.<\/p>\n<h2>3<\/h2>\n<h2>GET EMERGENCY MEDICAL HELP RIGHT AWAY<\/h2>\n<p>You may need further medical attention. If symptoms continue or recur, you may need to use a second EpiPen\u00ae or EpiPen Jr\u00ae Auto-Injector.<\/p>\n<h2>INDICATIONS<\/h2>\n<p>EpiPen\u00ae (epinephrine injection, USP) 0.3 mg or EpiPen Jr\u00ae (epinephrine injection, USP) 0.15 mg Auto-Injectors are for the emergency treatment of life-threatening allergic reactions (anaphylaxis) caused by allergens, exercise, or unknown triggers; and for people who are at increased risk for these reactions. EpiPen\u00ae or EpiPen Jr\u00ae are intended for immediate administration as emergency supportive therapy only. Seek immediate emergency medical help right away.<\/p>\n<h2>IMPORTANT SAFETY INFORMATION<\/h2>\n<p>Use EpiPen\u00ae or EpiPen Jr\u00ae Auto-Injectors right away when you have an allergic emergency (anaphylaxis). Get emergency medical help right away. You may need further medical attention. Only a healthcare professional should give additional doses of epinephrine  if you need more than two injections for a single anaphylactic episode. EpiPen\u00ae or EpiPen Jr\u00ae should only be injected into the middle of your outer thigh (upper leg), through clothing if necessary. Do not inject into your veins, buttocks, fingers, toes, hands or feet. Hold the leg of young children firmly in place before and during injection to prevent injuries. In case of accidental injection, please seek immediate medical treatment. Not actual patient. Please see additional Important Safety Information and Indications on the back. Please see accompanying Full Prescribing Information and Patient Information.<\/p>\n<h2>Every EpiPen 2-Pak\u00ae (epinephrine injection, USP) and Mylan\u2019s<\/h2>\n<h2>Authorized Generic For EpiPen Two-Pack comes with an<\/h2>\n<h2>EpiPen\u00ae Trainer<\/h2>\n<h2>Practice with your Trainer repeatedly<\/h2>\n<h2>to become familiar with it.<\/h2>\n<h3>The EpiPen\u00ae Auto-Injector and Mylan\u2019s<\/h3>\n<h3>The EpiPen\u00ae Trainer<\/h3>\n<h3>Authorized Generic For EpiPen\u00ae<\/h3>\n<h3>Identify the EpiPen<\/h3>\n<h3>\u00ae Trainer by:<\/h3>\n<h3>Label<\/h3>\n<p>The EpiPen\u00ae Trainer is clearly labeled TRAINER or TRAINING DEVICE.<\/p>\n<h3>Color<\/h3>\n<h2>or<\/h2>\n<h2>or<\/h2>\n<p>The EpiPen\u00ae Trainer is shaded grey EpiPen\u00ae and Mylan\u2019s EpiPen Jr\u00ae and Mylan\u2019s Authorized Generic Authorized Generic For EpiPen\u00ae  are yellow For EpiPen Jr\u00ae are green<\/p>\n<h3>No Window or Liquid<\/h3>\n<h3>Reset after each use<\/h3>\n<p>The grey EpiPen\u00ae Trainer contains no Always have access to two Auto-Injectors in all the medicine and no needle, and SHOULD NOT places you may need them because some people BE USED during an anaphylactic reaction. require a second dose. More than two sequential doses should be administered only under direct medical supervision.<\/p>\n<h3>Visit epipen.com to watch our How to Use video and more.<\/h3>\n<h2>IMPORTANT SAFETY INFORMATION (Continued)<\/h2>\n<p>Rarely, patients who have used EpiPen\u00ae or EpiPen Jr\u00ae may develop an infection at the injection site within a few days. Some of these infections can be serious. Call your healthcare professional right away if you have any of the following at an injection site: redness that does not go away, swelling, tenderness, or the area feels warm to the touch. Tell your healthcare professional about all of your medical conditions, especially if you have asthma, a history of depression, thyroid problems, Parkinson\u2019s disease, diabetes, high blood pressure or heart problems, have any other medical conditions, are pregnant or plan to become pregnant, or are breastfeeding or plan to breastfeed. Be sure to also tell your healthcare professional all the medicines you take, especially medicines for asthma. If you have certain medical conditions, or take certain medicines, your condition may get worse or you may have longer lasting side effects when you use EpiPen\u00ae or  EpiPen Jr\u00ae. Common side effects include fast, irregular or \u201cpounding\u201d heartbeat, sweating, nausea or vomiting, breathing problems, paleness, dizziness, weakness, shakiness, headache, feelings of over excitement, nervousness or anxiety. These side effects usually go away quickly if you lie down and rest. Tell your healthcare professional if you have any side effect that bothers you or that does not go away. Please see accompanying Full Prescribing Information and Patient Information. For additional information, please contact us at 800-395-3376. You are encouraged to report negative side effects of prescription drugs to the FDA. Visit www.fda.gov/medwatch or call 1-800-FDA-1088 EpiPen\u00ae, EpiPen Jr\u00ae, EpiPen 2-Pak\u00ae, EpiPen Jr 2-Pak\u00ae, Never-See-Needle\u00ae, and the Mylan logo are registered trademarks of Mylan Inc. Blue to the sky, orange to the thigh\u00ae is a registered trademark of Mylan Specialty L.P. EPI-2018-0079 The Mylan Better Health for a Better World logo is a registered trademark of Mylan Inc.<\/p>"}, {"slug": "fatal-6", "title": "Fatal 6", "revised": null, "pages": 7, "imageOnly": true, "trimmed": false, "html": ""}, {"slug": "fleet-enema", "title": "Fleet Enema", "revised": null, "pages": 1, "imageOnly": true, "trimmed": false, "html": ""}, {"slug": "oxygen-safe-use-and-storage-plan", "title": "Oxygen Safe Use and Storage Plan", "revised": "02.25.2020", "pages": 2, "imageOnly": false, "trimmed": false, "html": "<p>Oxygen Safe Use and Storage Plan It is very important that individuals, staff members and Lifesharing providers understand that oxygen can be dangerous if not used correctly. Oxygen causes things to burn more easily and can explode.  Following the safety guidelines outlined below will reduce potential risks.  The specific manufacturer website may also provide more information about the equipment in use. 1. An Oxygen in Use sign must be posted in a visible area where staff and visitors to the residential setting easily see the sign. 2. Oxygen tanks (cylinders) must be kept away from any and all heat sources, including radiators, heat ducts, stoves, fir
