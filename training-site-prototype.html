<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Support Annual Training - Digital Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1B2F; --maroon:#7A1521; --gold:#C8A951;
  --page:#FCFBF8; --rule:#E3DDD0; --muted:#6E6A63;
  --serif:"Source Serif 4",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--serif);
  font-size:17px;line-height:1.62;
  background-image:radial-gradient(rgba(27,27,47,.055) 1px,transparent 1px);
  background-size:22px 22px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--maroon);outline-offset:2px}
.shell{display:grid;grid-template-columns:274px 1fr;min-height:100vh}

.rail{border-right:1px solid var(--rule);background:rgba(255,255,255,.75);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0 40px}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--rule);margin-bottom:6px;cursor:pointer}
.brand b{font-family:var(--sans);font-weight:600;letter-spacing:.06em;font-size:12px;color:var(--maroon);display:block}
.brand span{font-size:26px;line-height:1.15;display:block;margin-top:4px}
.grp{padding:13px 0 3px}
.grplab{font-family:var(--sans);font-size:11.5px;color:var(--muted);
  padding:0 20px 6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.grplab b{color:var(--ink);font-weight:600}
.grplab em{font-style:normal;font-size:10.5px;opacity:.8;text-align:right}
.tab{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;
  border-left:5px solid transparent;padding:9px 18px 9px 15px;text-align:left;
  color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.35}
.tab:hover:not(:disabled){background:rgba(27,27,47,.045)}
.tab[aria-current="true"]{border-left-color:var(--accent);background:rgba(27,27,47,.06);font-weight:600}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tab:disabled{color:var(--muted);cursor:default}
.tab:disabled .dot{border-radius:2px;background:none;border:2px dashed var(--rule)}
.tab-t{flex:1}
.tab .ct{font-size:11.5px;color:var(--muted)}
.certlink{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}

main{padding:0 0 90px;min-width:0}
.wrap{max-width:72ch;margin:0 auto;padding:0 28px}
.hero{background:linear-gradient(180deg,#1B1B2F,#2A2543 60%,#3A2E4A);
  color:#F6F1E6;padding:56px 28px 44px;margin-bottom:30px}
.hero .wrap{padding:0}
.hero .org{display:block;font-family:var(--sans);font-weight:600;letter-spacing:.2em;
  font-size:12.5px;color:var(--gold);margin-bottom:10px}
.hero h1{font-size:clamp(40px,8vw,68px);line-height:.95;margin:0 0 14px;font-weight:600;letter-spacing:-.02em}
.hero .band{display:inline-block;background:var(--gold);color:#241E12;font-family:var(--sans);
  font-weight:600;letter-spacing:.16em;font-size:11px;padding:6px 14px}

.sched{margin-bottom:34px}
.sched h2{font-size:15px;font-family:var(--sans);font-weight:600;margin:0 0 12px;color:var(--muted)}
.step{border-left:3px solid var(--rule);padding:0 0 18px 18px;position:relative}
.step:last-child{padding-bottom:0}
.step .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step h3{margin:0;font-size:20px;font-weight:600}
.step .how{font-family:var(--sans);font-size:12px;color:#fff;background:var(--ink);padding:2px 8px}
.step .how.self{background:none;color:var(--muted);border:1px solid var(--rule)}
.step p{margin:5px 0 10px;font-size:15.5px;color:var(--muted);max-width:58ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--accent);
  padding:8px 13px;font-family:var(--sans);font-size:13.5px;text-align:left}
.chip:hover{border-color:var(--ink)}
.chip.static{border-left-color:var(--rule);color:var(--muted);cursor:default}

.sec-head{border-bottom:2px solid var(--accent);padding-bottom:14px;margin:34px 0 20px}
.sec-head .n{font-family:var(--sans);font-size:12px;color:var(--muted)}
.sec-head h2{margin:5px 0 0;font-size:34px;font-weight:600;letter-spacing:-.01em}
.doclist{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.doc{background:var(--page);border:0;padding:15px 18px;text-align:left;width:100%;
  display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.doc:hover{background:#fff}
.doc b{font-weight:600;font-size:17.5px}
.doc .meta{font-family:var(--sans);font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
.printrow{margin-top:18px;font-family:var(--sans);font-size:13.5px;color:var(--muted)}
.printrow a{color:var(--ink)}
.flag{background:#F4E4C3;color:#6B4E12;font-size:11.5px;padding:1px 7px;white-space:nowrap}
.links{margin-bottom:18px;display:grid;gap:10px}
.link{display:block;background:#fff;border:1px solid var(--rule);border-left:4px solid var(--accent);
  padding:13px 16px;text-decoration:none;color:var(--ink)}
.link:hover{border-color:var(--ink)}
.link b{display:block;font-size:17px;font-weight:600}
.link span{display:block;font-family:var(--sans);font-size:13.5px;color:var(--muted);margin-top:2px}
.link .host{font-size:12px;margin-top:5px}

article h2{font-size:24px;margin:26px 0 8px;font-weight:600}
article h3{font-size:16.5px;margin:20px 0 4px;font-weight:700;font-family:var(--sans)}
article p{margin:0 0 12px}
article li{margin:0 0 6px 20px}
.docmeta{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:0 0 20px}
.placeholder{border:1px dashed var(--rule);background:rgba(27,27,47,.02);padding:24px;
  color:var(--muted);font-family:var(--sans);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--rule)}
.pager button{background:none;border:1px solid var(--rule);padding:11px 16px;font-family:var(--sans);font-size:14px;max-width:48%}
.pager span{flex:1}

.sheet{background:#fff;border:1px solid var(--rule);padding:0 32px 28px;margin-bottom:22px}
.sheet .sh{border-top:6px solid var(--maroon);border-bottom:3px solid var(--gold);
  margin:0 -32px 20px;padding:16px 32px 12px}
.sheet .sh b{font-family:var(--sans);font-size:11px;letter-spacing:.08em;color:var(--maroon);display:block}
.sheet .sh h3{margin:5px 0 2px;font-size:24px;font-weight:600}
.sheet .sh em{font-style:normal;font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.attest{background:var(--page);border:1px solid var(--rule);padding:15px 17px;font-size:15.5px;margin:16px 0}
.topics{columns:2;column-gap:26px;font-size:14px;font-family:var(--sans);color:var(--muted);margin:4px 0 20px}
.topics div{break-inside:avoid;margin-bottom:3px}
@media(max-width:640px){.topics{columns:1}}
.field{display:block;margin-bottom:15px;font-family:var(--sans);font-size:13px;color:var(--muted)}
.field input{display:block;width:100%;margin-top:4px;padding:9px 2px;border:0;
  border-bottom:1px solid var(--ink);background:transparent;font-family:var(--serif);font-size:16px;color:var(--ink)}
.field input.sig{font-family:"Segoe Script","Brush Script MT",cursive;font-size:23px}
.field input:disabled{border-bottom-color:var(--rule)}
.row{display:grid;gap:20px}
@media(min-width:640px){.row{grid-template-columns:1fr 1fr}}
.track{display:flex;border:1px solid var(--rule);margin:4px 0 20px}
.track button{flex:1;background:none;border:0;padding:12px 8px;font-family:var(--sans);font-size:13.5px;color:var(--muted)}
.track button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.submit{background:var(--maroon);color:#fff;border:0;padding:13px 22px;font-family:var(--sans);font-weight:600;font-size:15px}
.submit:disabled{background:#B9B3A9;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--rule);padding:13px 20px;font-family:var(--sans);font-size:15px}
.note{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:14px}

.railtoggle{display:none}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;max-height:74vh;width:100%;
    border-right:0;border-top:1px solid var(--rule);z-index:30;background:#fff;
    transform:translateY(100%);transition:transform .28s;padding-bottom:70px}
  .rail.open{transform:translateY(0)}
  .railtoggle{display:block;position:fixed;left:0;right:0;bottom:0;z-index:31;
    background:var(--ink);color:#F6F1E6;border:0;padding:15px;font-family:var(--sans);font-weight:600;font-size:15px}
  main{padding-bottom:80px}
  .doc{flex-direction:column;gap:3px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;font-size:11pt;background-image:none}
  .rail,.railtoggle,.acts,.track,.note,.pager,.hero,.sched{display:none!important}
  .shell{display:block}
  .wrap{max-width:none;padding:0}
  .sheet{border:0;padding:0;margin:0 0 20px;break-after:page}
  .sheet .sh{margin:0 0 14px;padding:10px 0}
  .field input{border-bottom:1px solid #000}
}
</style>
</head>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Training sections"></nav>

<script>
const D = {"sections": [{"slug": "drc-policies", "title": "DRC: Policies", "color": "#8E6FA8", "delivery": "day1", "documents": [{"slug": "heavy-hitter-list", "title": "HEAVY HITTER LIST", "revised": null, "pages": 2, "imageOnly": false, "trimmed": false, "html": "<h3>Frequently Asked Questions-<\/h3>\n<p>Fleet policy portion- any and all accidents/incidents/citations whether on or off duty must be reported to SS within 72 hours. What should I do if I am in an accident with an individual in the vehicle with me?  Call your program specialist or the On call Program Specialist. PTO- it is the responsibility of the employee to ensure that they have worked a minimum of 40 hours each week or have the PTO hours available to cover any deficiencies of 40 hours. If hours have not been worked and PTO time is not available to cover the deficiency, then disciplinary action will occur. All hours must be entered by Monday at noon at the end of the pay period or will be paid on the following check. Call offs- must be done via phone call only; texting/emailing are not acceptable. The phone call must be made to the supervising Program Specialist or the on-call Program Specialist. If you are ill, the covid line must also be called. 888-556-7930. The covid line does not accept text messages. PTO requests should be submitted to the Program Specialist 2 weeks prior. Residential Organization- due to being a residential company, the individual that you are assigned to support, and the weekly schedule, may change upon the discretion and needs of the agency. CP/SE/SH- services that are a 1:1 service where the support staff must be with the individual at all times to ensure the service requirement is met. Personal errands may never be completed on company time or while providing billable services Completion of paperwork/duties- is expected to be completed in totality prior to leaving shift. Attendance Records, iCM clock in and clock out and mileage punches should be completed in real-time. Our supported individuals, although some may be more capable than others, may require assistance with personal hygiene and keeping their home clean and in compliance with regulations. It is the expectation that support staff ensure that the home is kept clean and in compliance if the supported individual refuses to assist with cleaning. It is the expectation that support staff will assist an individual in maintaining proper hygiene as needed. Med admin- 5 rights are expected to be completed with each med pass. An individual\u2019s personal funds should never be taken home. If an individual is saving for an activity/event those funds may be set aside and placed in a locked box at the home or given to the Program Specialist to hold on to. If Caretracker is not working, use the web browser instead of the app. If still not working notify on-call/PS. What should I do if ICM is down? Document on paper until the system is up and running again. Same for E-Attendance. Who do I reach out to if I need additional support for the individual I\u2019m working with? Reach out to your PS and they will either provide additional support or our DSP Mentor or BS will assist. What to do if a door alarm/window alarm is not working? If an alarm is not working, On-call or PS should be notified immediately so a replacement can be installed. Do I have Shared Support\u2019s On call number programmed in my phone? 570-213-9762. If your individual is not feeling well or has a fall, what do you do?  Call your program specialist, or On-call if after office hours or on weekends. Document any incidents that could lead to a bruise or mark on the body and report any bruises with an unidentifiable source or skin concerns immediately. Approved OTC medications such as Tylenol etc., do not need on call approval prior to administration. Any PRN for agitation needs approval from On-call prior to administration. Do you have all necessary items for the individual when you are preparing to go out into the community (Medications, prn medication, sensory items, incontinent products).<\/p>"}, {"slug": "abuse-policy", "title": "Abuse Policy", "revised": "7.10.26", "pages": 14, "imageOnly": false, "trimmed": false, "html": "<h3>POLICY:<\/h3>\n<p>An employee may not, at any time, commit an act of physical, psychological or sexual abuse or act of neglect against any individual served by SHARED SUPPORT, INC. All observed or suspected incidents of abuse or neglect must be reported immediately.<\/p>\n<h3>SCOPE OF POLICY:<\/h3>\n<p>This policy applies to all individuals, employees, volunteers and independent contractors of Shared Support, Inc.<\/p>\n<h3>STATEMENT OF POLICY:<\/h3>\n<p>In accordance with the purpose of this policy, Shared Support, Inc. has defined physical, psychological, sexual abuse and seclusion, as well as defined improper or unauthorized use of restraint as it constitutes abuse. This policy also defines neglect and outlines the procedures that are to be used for reporting abuse or neglect or suspected abuse or neglect.<\/p>\n<h3>IMPLEMENTATION OF POLICY:<\/h3>\n<p>I.  Introduction It is inherent in the nature and dignity of each individual that he/she be afforded certain human rights.  The presence of a disability in no way lessens these rights.  Employees of Shared Support, Inc. must recognize and uphold the rights of everyone for whom care and treatment is provided.  Accordingly, there exists a continuing obligation to provide services to each individual in the most caring manner possible, and to prevent injury to the people served. Employees will use appropriate therapeutic approaches, such as counseling or withdrawing the individual from an over stimulating environment, to reduce or prevent the onset of behaviors leading to the possibility of self-injury or harm to others. All acts of abuse and neglect are considered unacceptable.  All allegations of abuse will be reported to law enforcement agencies in accordance with protective service law requirements (23 Pa. C.S. \u00a7 6312, 35 P.S. \u00a7\u00a7 10210.501(b)). Notification must occur anytime there is reasonable cause to suspect: 1.) the individual is the alleged victim of sexual abuse; 2.) is considered a missing person whose health and safety may be compromised; 3.) is a victim of serious bodily injury; 4.) is deceased and the circumstances of the death are suspicious; 5.) a crime has been committed. It is also the responsibility of all staff to prevent individuals residing at Shared Support, Inc. from engaging in acts of abuse against one another. Staff must immediately intervene in such cases and ensure that the abused individual receives immediate medical care and/or counseling.  The needs of all involved individuals must be addressed. It is recognized that an employee may, in an extreme emergency, be placed in a situation in which he/she must defend him/herself or others against a person exhibiting assaultive behavior. 1 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 In situations such as this, each employee must show maximum self-control and discipline to ensure that he/she does not use an aggressive response, as such a response to an agitated individual will, in most cases, quickly worsen the situation.  Providing that criteria are met for an employee to physically restrain an individual, the least amount of force coupled with the appropriate technique will ensure that an individual&#x27;s rights are upheld.  Such prudent self- defense (i.e., that which does not harm the individual) may protect the employee from imminent and serious bodily injury. The philosophy of Shared Support, Inc. on individual programs promotes the use of person- centered practices.  However, there are times when a person&#x27;s behavior may pose a risk to self or others.  If positive approaches alone are not successful in changing such behaviors, the use of more restrictive techniques may be the only responsible therapeutic approach.  Shared Support, Inc. supports the use of a restrictive procedure only when the risk presented by the person&#x27;s behavior is greater than the risk presented by the restrictive procedure and when all procedural safeguards are followed.  It is important to note that the approval process for a restrictive technique is quite involved and must not be bypassed except in emergencies (as defined in the Behavior Modification Policy).  Any attempt to bypass approval procedures will constitute abuse.  Staff may not, under any circumstances, develop a restrictive procedure independent of the Shared Support Human Rights Committee. II.  Definition of Abuse Abuse is defined as the deliberate or careless act by a person, including another individual receiving services, which may result in mental or physical harm.  Abuse is reported from the victim\u2019s perspective, not on the perspective of the person(s) committing the abuse. In addition to incidents of abuse being reported verbally, alleged and suspected incidents must also be reported. These include potential incidents suspected through observation of physical, behavioral or emotional indicators of abuse, neglect or another incident type. Additionally, trend analysis that reveals a pattern of injury, illness or other incidents that could be indicators of abuse, neglect or another incident type will be reported. Physical Abuse is an act by staff or other person which causes or may cause physical injury to an individual. Physical injuries may or may not be present with physical abuse. Allegations of physical acts without obvious signs of injury must be reported. Monitoring or body checks may be necessary to look for signs of injury after initial discovery of the incident. In addition, injuries attributed to a staff person or another individual receiving services that require treatment beyond first aid or an inpatient admission to a hospital are to be reported as abuse. Examples may include:<\/p>\n<li>Actions such as striking, scratching, grabbing, pushing, or kicking a person;<\/li>\n<li>Actions which cause or could cause physical pain to a person;<\/li>\n<li>Use of sensory deprivation techniques;<\/li>\n<li>Applying noxious or potentially harmful substances or conditions to an individual;<\/li>\n<li>Use of totally enclosed cribs or barred enclosures.<\/li>\n<p>If an incident involved an injury, common examples of situations that may be present with physical abuse include, but are not limited to: 2 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026<\/p>\n<li>Patterned bruising, no matter the size, that is in the shape of an identifiable object such as<\/li>\n<p>a belt buckle, shoe, hanger, fingermark, etc.<\/p>\n<li>Unexplained serious injuries or multiple bruises, cuts, abrasions.<\/li>\n<li>A spiral fracture.<\/li>\n<li>Dislocated joints.<\/li>\n<li>Bilateral bruising, which is bruising on both sides of the body (e.g., the top of both<\/li>\n<p>shoulders, both sides of the face or inside of both thighs).<\/p>\n<li>Bruising to an area of the body which does not typically or easily bruise (e.g., midline<\/li>\n<p>stomach, breasts, genitals, inner thighs or middle of the back).<\/p>\n<li>Injuries that are not consistent with what is reported to have happened.<\/li>\n<li>Injuries explained as caused by self-injury to parts of the body the individual has not<\/li>\n<p>previously injured or cannot access. Some Examples of Appropriate vs. Inappropriate Physical Interactions between Individuals and Staff/Lifesharers/Volunteers Appropriate Physical Interactions Inappropriate Physical Interactions Side hugs Kisses Shoulder to shoulder or \u201ctemple\u201d hugs Lap sitting by a staff member or individual Pats on the shoulder or back Wrestling Handshakes Piggyback rides High fives and fist bumps Tickling Touching hands, shoulders and arms Giving money or gifts (outside of what is allowed per the interdisciplinary team) Asking for permission before touching or Any form of affection that is unwanted by the guiding in how to do an activity (fastening individual, staff, lifesharer or volunteer. safety equipment, showing how to swing a baseball bat) Touching bottom, chest or genital areas that is outside the authorized and documented personal care assistance of the individual. Psychological Abuse is an act which causes or may cause mental or emotional anguish by threat, intimidation, humiliation, isolation or other verbal or nonverbal conduct to diminish another. Examples may include:<\/p>\n<li>Bullying, rejecting, degrading and terrorizing acts.<\/li>\n<li>Disregard for privacy during personal care.<\/li>\n<li>Paid caregiver ignoring an individual, including, but not limited to:<\/li>\n<p>o Active ignoring (is not part of the approved plan) such as ignoring a call or request for assistance. o Passive acts, such as nonessential use of a cellphone (or another electronic device), watching TV, etc.<\/p>\n<li>Threats of isolation.<\/li>\n<li>Yelling, name calling, blaming, shaming.<\/li>\n<p>3 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026<\/p>\n<li>Mimicking or mocking an individual\u2019s voice, speech, behaviors, etc.<\/li>\n<li>Statements that are intended to humiliate or infantize, including insults, threats of<\/li>\n<p>abandonment or institutionalization and other controlling, dominant or jealous behavior.<\/p>\n<li>The act of taking, transmitting, or displaying an electronic image (in any medium<\/li>\n<p>including social media, personal computers, cell phones, etc.) of an individual that is intended to shame, degrade, humiliate or otherwise harm the personal dignity of the individual.<\/p>\n<li>When an individual witnesses an incident for which they were not the intended victim,<\/li>\n<p>but it causes or has caused mental or emotional anguish.<\/p>\n<li>Inappropriate verbal interaction refers to spoken communications that are disrespectful,<\/li>\n<p>offensive, threatening, manipulative, or otherwise violate professional, ethical, or social norms. These interactions may include yelling, name-calling, sarcasm, ridicule, coercive language, discriminatory comments, or any speech that undermines the dignity, safety, or well-being of another person. Examples of appropriate vs. inappropriate verbal interactions include: Appropriate Verbal Interactions Inappropriate Verbal Interactions Positive reinforcement Name calling Appropriate jokes Involving individuals in the personal problems or issues of staff or volunteers. Encouragement Flirting Praise Secrets Strength-based conversations Off color or sexual jokes Active listening Shaming - belittling Empathy Oversharing personal history Offering choices Derogatory or discriminatory remarks Clear and direct language Harsh language that may frighten, threaten or humiliate individuals. Respectful communication Derogatory remarks about the individual or their family. Sexual Abuse is any attempted or completed nonconsensual sexual act. This act may be physical or non-physical and achieved by force, threats, bribes, manipulation, pressure, tricks, violence or against an individual who is unable to consent or refuse. Sexual abuse includes any act or attempted act that is sexual in nature between a paid service provider staff and an individual regardless of consent on the part of the individual. Examples of methods used to commit sexual abuse include, but are not limited to: \uf076 Use of intimidation or threat of physical force toward an individual in order to gain compliance with a sexual act (i.e., pinning the victim down, assaulting the victim). \uf076 Administering alcohol or drugs to an individual in order to gain compliance with a sexual act (i.e., drink spiking). \uf076 Taking advantage of an individual who is unable to provide consent due to intoxication or incapacitation from voluntary consumption of alcohol, recreational drugs or medication. \uf076 Exploitation of vulnerability (i.e., immigration status, disability, undisclosed sexual orientation, age). 4 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 \uf076 Misuse of authority (i.e., using one\u2019s position or power to coerce or force a person to engage in sexual activity). \uf076 Economic coercion, such as bartering of sex for basic goods like housing, employment/wages, immigration papers or childcare. \uf076 Degradation, such as insulting or humiliating an individual. \uf076 Fraud, such as lies or misrepresentation of a target\u2019s identity. \uf076 Continual verbal pressure, such as when an individual is bring worn down by someone who repeatedly asks for sex or, for example, by someone who complains that the individual does not love them enough. \uf076 False promises by the target (i.e., promising marriage, promising to stay in the relationship, etc.). \uf076 Grooming and other tactics to gain an individual\u2019s trust. \uf076 Control of an individual\u2019s sexual behavior/sexuality through threats, reprisals, threats to transmit sexually transmitted infections (STIs), threats to force pregnancy, etc. \uf076 Rape. The penetration, no matter how slight, of the vagina or anus with any body part or object, by a sex organ of another person, without the consent of an individual. This includes when an individual was made, or there was an attempt to make the individual, penetrate another person (including the target). \uf076 Sexual Harassment. Sexual advances that do not involve physical contact between an individual and a target. This type of sexual abuse can occur in many different venues (i.e., home, school, workplace, in public or through technology). Examples include, but are not limited to:<\/p>\n<li>Sending unwanted sexually explicit photographs.<\/li>\n<li>Use of inappropriate sexual remarks or language.<\/li>\n<li>Unwanted exposure to sexual situations \u2013 pornography, voyeurism, exhibitionist.<\/li>\n<li>Threats of sexual abuse to accomplish some other end, such as threatening to rape<\/li>\n<p>an individual if he or she does not give the target money.<\/p>\n<li>Threatening to spread sexual rumors if the individual does not have sex with the<\/li>\n<p>target.<\/p>\n<li>Unwanted filming, taking or disseminating photographs of a sexual nature of an<\/li>\n<p>individual (in any medium to include, but not limited to, social media, personal computers, cell phones, etc.).<\/p>\n<li>Exposure to unwanted sexual materials (photography).<\/li>\n<p>\uf076 Unwanted Sexual Contact.  Intentional touching or molesting, either directly or through the clothing, of the genitalia, anus, groin, breast, inner thigh, buttocks or any other body part without consent. This includes making an individual touch or molest another person (including the target). \uf076 Other. Any sexual abuse of an unknown type at the time of the report or sexual abuse that does not conform to other secondary category options. Seclusion. The involuntary confinement of an individual in an area from which the individual is prevented from leaving. This includes verbal instruction or any explicit or implicit intimidation 5 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 that indicates to an individual that he or she may not leave a room, regardless of whether the individual has the ability to physically remove himself or herself from the situation. Examples include, but are not limited to, the following prohibited acts:<\/p>\n<li>Placing an individual in a locked room. A locked room includes a room with any type of<\/li>\n<p>engaged locking device such as a key lock, spring lock, bolt lock, foot pressure lock, device or object, or a person physically holding the door shut.<\/p>\n<li>Placing an individual in a room from which they are unable to exit independently due to<\/li>\n<p>the general accessibility of the room (i.e., wheelchair ramps, transitions, etc.), features of the door hardware (i.e., handles that do not meet the accessibility needs of the individual) or any other obstacle that prevents an individual from exiting. Misapplication/Unauthorized Use of Restraint (Injury) is the use of a restraint that does not follow ODP\u2019s regulations, the misapplication of an approved restraint technique or the use of a restraint that results in an injury requiring treatment beyond first aid. Examples include:<\/p>\n<li>Prone position restraint (this is restraint that places the person face down, on their<\/li>\n<p>stomach).<\/p>\n<li>Any restraint that inhibits digestion or respiration, inflicts pain, causes embarrassment or<\/li>\n<p>humiliation, cause hyperextension of joints, applies pressure on the chest or joints or allows for a free fall to the floor.<\/p>\n<li>Any physical restraint that is used more than 30 cumulative minutes within a two-hour<\/li>\n<p>period.<\/p>\n<li>Chemical and mechanical restraints.<\/li>\n<p>Misapplication/Unauthorized Use of Restraint (no injury).  The use of a restraint that does not follow ODP\u2019s regulatory requirements or the misapplication of an approved restraint technique. Examples of this are noted above in Misapplication/Unauthorized Use of Restraint (Injury). III.  Definition of Neglect The failure to obtain or provide the needed services and supports defined as necessary or otherwise required by law or regulation, policy or plan (ISP, Behavior Support Plan, safety plan, etc.) This includes acts that are intentional or unintentional regardless of the obvious occurrence of harm. \uf076 Failure to Provide Medication Management. An event that may cause harm or lead to inappropriate medication use while the medication is in the control of the person(s) charged with administration. Incidents of this nature include when harm occurs to the individual, the medication error occurs over more than one consecutive administration or an individual receives medication intended for another individual.   Incidents of this type include but are not limited to a: 1.) failure to administer medications via the correct route; 2.) failure to implement medication changes in a timely manner; 3.) failure to obtain medications from the pharmacy. \uf076 Failure to Provide Needed Care.  The failure to obtain or provide the needed services and supports. This includes, but is not limited to: 1.) failure to implement medical, social, behavioral and restrictive procedures as outlined in the ISP; 2.) failure to provide needed care such as food, clothing, personal hygiene, prompt and adequate medical care, emergency services and other basic treatment and necessities needed for development of 6 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 physical, intellectual, emotional capacity and well-being; 3.) failure to obtain, keep in working order or arrange for repair or replacement of equipment such as glasses, dentures, hearing aids, walkers, wheelchairs, etc.; 4.) failure to intercede on behalf of the individual with regards to reporting or acting or changes to healthcare needs or failure to ensure medical equipment is repaired or replaced as needed. \uf076 Failure to Provide Needed Supervision. The failure to provide attention and supervision, including leaving individuals unattended. This is based upon the supervision care needs in the ISP or recommendations or requirements from a court of law or as a condition of probation/parole. \uf076 Failure to Provide Protection from Hazards. The failure to protect an individual from health and safety hazards as part of routine care, service provision or as outlined in the ISP.  Examples of failure to provide protection from health and safety hazards include, but are not limited to: 1.) failure to prepare and serve food required by an individual\u2019s medical diagnosis; 2.) failure to provide protections from poisonous materials; 3.) failure to provide shelter and basic utilities; 4.) failure to provide basic protections from environmental hazards such as exposure to the sun, extreme elements and other weather- related conditions; 5.) failure to regulate water temperatures; 6.) failure to provide protection from hazardous activities such as the manufacture, distribution, exposure to and use of illegal drugs. \uf076 Moving Violation. Any staff or volunteer receiving a moving violation citation during the provision of services to an individual, regardless if operating a Shared Support or a personal vehicle. IV.  Reporting and Investigating Allegations of Abuse or Neglect ANY EMPLOYEE observing or discovering a situation where abuse or neglect may have occurred, or who suspect abuse through the observation of physical, behavioral or emotional indicators or through trend analysis that reveals a pattern of injury, illness or other incidents that could be indicators of abuse, neglect or another incident type will provide the following in the order listed: 1. Provide immediate assistance to ensure the health, safety and rights of individual(s), as needed; 2. Report to program leadership or contact on-call representative (Point Person) to report the incident as soon as possible following the incident but no later than 24 hours from the time of the incident or the time of discovery. 3. Document observations about the incident in a narrative report. Point Person will: 1. Ensure the appropriate steps have been taken to ensure the health, safety and well-being of the individual(s) involved. 2. Offer victim\u2019s assistance and make referral and offer support to access services if interest is expressed. 3. Ensure the target is separated from the victim (55 Pa. Code \u00a7\u00a7 6100.46); 4. Ensure the appropriate agencies are notified: o Adult Protective Services o Older Adult Protective Services 7 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 o The individual and person\u2019s designated by the individual, unless the person designated by the individual is the target. o The Department of Aging and the Department of Human Services o The designated managing entity (AE) o The county government office responsible for the intellectual disability program (County ID Program) (55 Pa. Code \u00a7\u00a7 6100.46) 5. Notify the CEO or Program Director via cell phone. 6. Assign a Certified Investigator. 7. Enter the alleged incident into the HCSIS/EIM database within 24 hours of receipt of the initial report of abuse or neglect. If the alleged target is an employee or another individual, use first and second initials of the first name of the target, first and second initials of the last name of the target and the last 4 digits of the target\u2019s social security number. All initials must be capitalized and there can be no spaces, dashes or other characters between initials and numbers. If EIM is not working properly, submit incident report via fax to 717-772-7308 and submit the EIM report when the system is again working. 8. Notify local law enforcement in accordance with protective service law requirements (see page 1 of this policy). 9. Inform the individual that he or she may can request assistance from local law enforcement and assist with then the notification as needed. 10. Respond to any management review recommendations completed by the AE or ODP. 11. Ensure the incident is finalized within 30 calendar days of discovery of the incident or submit a request for extension to the Department. Certified Investigator will: 1. Conduct investigations using the process, standards of quality and template(s) outlined in the most current ODP CI manual; 2. Create a CI report and enter the investigation information in the Department\u2019s information management system; 3. Ensure the complete original investigation file is given to the Shared Support IM Representative; 4. Participate in the CIPR process. 5. All Certified Investigators must be trained by the Department to conduct investigation. Because some people cannot or will not protect and/or defend themselves, every employee has a responsibility to protect any person served against anyone who may violate his/her rights. This protection extends to abusive behaviors exhibited between residents, known as Individual to Individual Abuse (I:I). It is the responsibility of any employee or representative of Shared Support, Inc. who witnesses such an act to provide intervention and to provide prompt medical care and report the incident to the supervisor immediately or as soon as possible after providing necessary care.  Victim\u2019s assistance will be offered in all cases of I:I abuse. Attendance at circle meetings to promote the respectful discussion of issues that may not be working for the person is expected. 8 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 V. Employer Obligations Shared Support, Inc. has an obligation to ensure that both individual and employee rights are protected, and to manage the organization with an emphasis on communication and group problem solving through circle meetings.  Shared Support, Inc. is committed to:<\/p>\n<li>Listening to the concerns of all stakeholders;<\/li>\n<li>Offering resources to all stakeholders, when necessary, to reduce stressful situations and<\/li>\n<p>to ensure the health and safety of the persons supported, as well as of the staff;<\/p>\n<li>Making determinations regarding employee performance and their ability to manage<\/li>\n<p>challenging situations and the requirements of their person-centered job description. VI. Monitoring and Supervision of People Receiving Support \u2013 High Hazard Activity Everyone participating in services with Shared Support, Inc. has an Individual Plan of support outlining the supervision needs of the individual.  Staff members, prior to working with an individual, are thoroughly trained on the individual\u2019s supervision plan. Supervision and monitoring plans vary dependent upon the individual\u2019s level of need, all of which is detailed in the Individual Plan.  Examples of varying supervision plans may include 1:1 24/7 line of site support while other individuals may have the ability to experience indirect supervision in their home for allotted amounts of time or in designated locations, such as the bathroom, or alone time in the community setting with check in times established with the Program Specialist.  The individual\u2019s interdisciplinary team includes the individual receiving support, the Shared Support Program Specialist, the individual\u2019s Supports Coordinator, family members and/or other designated persons and Behavioral Specialist, when applicable. Shared Support operates one person living arrangements with 1:1 staff support, therefore all individuals receiving services reside independently in their home rather than with roommates. An individual\u2019s need for supervision while in the bathroom, both for toileting and showering, and documentation thereafter is detailed in each person\u2019s plan of support in their Individual Plan. Additionally, a person\u2019s overnight supervision plan is detailed in the Individual Plan. Some homes, if elopement is of concern, may use monitoring devices such as door and window alarms. Shared Support, per regulation, is required to provide transportation for all individuals receiving residential support.  Individuals reside in one person homes, thus transportation is a 1:1 activity with staff and the individual supported.  Staff is required to document all trips in iCare Manager and in their daily shift note. All staff and lifesharing providers are trained on the Shared Support Fleet Policy which covers both use of company and personal vehicles.  No employee personal stops or errands are permitted on trips and the individuals support plan as outlined in the Individual Plan must be followed. When individuals have the opportunity to take a vacation accompanied by Shared Support staff members, their supervision and monitoring plan must be adhered to just as when they are receiving their 1:1 support in their personal home and community.  Staff who accompany individuals on overnight trips are staff members regularly providing 1:1 support to the individual.  Staff and individuals traveling have regular check-ins with Management staff while they are on vacation. 9 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 The Shared Support Incident Management Policy details the organization\u2019s Critical Incident Management plan. VII.  Anti-Bullying All individuals reside in one person settings, thus bullying behavior between individuals is greatly minimized. Shared Support recognizes that while individuals do interact with one another in the community or while visiting with their friends, serious incidents of consumer -to- consumer abuse are preceded by more subtle incidents such as name-calling, taunting, or roughhousing. Interrupting these interactions early and establishing and communicating standards of conduct can keep the program environment safe.  All individuals receiving support, initially upon service and annually thereafter, review the Shared Support, Inc. Individual Rights and Responsibilities/Standards of Conduct. Shared Support recognizes that the following interactions are high risk and will be prohibited. a. Physical bullying: when one person engages in physical force against another person, such as by hitting, punching, pushing, kicking, pinching, or restraining another. b. Verbal bullying: when someone uses their words to hurt another, such as by belittling or calling another hurtful names. c. Nonverbal or relational bullying: when one person manipulates a relationship or desired relationship to harm another person. This includes social exclusion, friendship manipulation, or gossip. This type of bullying also includes intimidating another person by using gestures. d. Cyberbullying: the intentional and overt act of aggression toward another person by way of any technological tool, such as email, instant messages, text messages, digital pictures or images, or website or social media postings (including blogs). Cyberbullying can involve:<\/p>\n<li>Sending mean, vulgar, or threatening messages or images;<\/li>\n<li>Posting sensitive, private information about another person;<\/li>\n<li>Pretending to be someone else in order to make that person look<\/li>\n<p>bad, or creation or use of AI generated images or content;<\/p>\n<li>Intentionally excluding someone from an online group.<\/li>\n<p>e. Hazing: an activity expected of someone joining or participating in a group that humiliates, degrades, abuses, or endangers that person regardless of that person\u2019s willingness to participate. f. Sexualized bullying: when bullying involves behaviors that are sexual in nature. Examples of sexualized bullying behaviors include sexting, bullying that involves exposures of private body parts, and verbal bullying involving sexualized language or innuendos. g. Games of truth or dare. h. Singling out one person for different treatment. i. Ridicule or humiliation VIII. Code of Conduct The following policies are intended to assist employees and volunteers in making decisions about interactions with individuals. For clarification of any guideline, or to inquire about behaviors not addressed here, contact your immediate supervisor. 10 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 The organization provides our individuals with the highest quality supports available. We are committed to creating an environment for individuals that is safe, nurturing, empowering, and that promotes growth and success. Abuse of any kind will not be tolerated, and confirmed abuse will result in immediate dismissal from this organization. The organization will report, and fully cooperate with authorities if allegations of serious abuse are investigated and substantiated. The Code of Conduct with individuals outlines specific expectations of employees and volunteers as we strive to accomplish our mission together. 1. Individuals will always be treated with respect. 2. Individuals will be treated fairly, regardless of race, sex, sexual orientation, age, gender, immigration status, or religious preference. 3. Employees and volunteers will adhere to appropriate boundaries governing physical affection as outlined by the organization. 4. Employees and volunteers will adhere to appropriate and inappropriate verbal interactions as outlined by our organization. 5. Employees and volunteers will not stare at or comment on individuals\u2019 bodies. 6. Employees and volunteers will not date or become romantically involved with individuals. 7. Employees and volunteers will not use or be under the influence of alcohol or illegal drugs in the presence of individuals, or provide individuals with alcohol, cigarettes, or illegal drugs. 8. Employees and volunteers will not have sexually oriented materials, including printed or online pornography, on our organization\u2019s property, or show individuals any sexually oriented materials unless directed to do so by the individual support plan. 9. Employees and volunteers will not keep secrets with individuals and will only give gifts in accordance with organizational policies. 10. Employees and volunteers will comply with our organization\u2019s policies regarding interactions with individuals outside of our programs. 11. Employees and volunteers will adhere to organizational policies regarding electronic communication and social media with individuals. 12. Employees and volunteers will adhere to organizational policies regarding working one-on-one with individuals in a private setting \u2013 as authorized by the individual\u2019s ISP. 13. Employees and volunteers will report concerns or complaints about other employees and volunteers, other adults, or individuals their immediate supervisor or by contacting the on-call Program Specialist outside of normal business hours at 570-213-9762. 14. All allegations or incidents of abuse will be immediately investigated by a Department of Human Services, Office of Developmental Programs Certified Investigator and will be reported to APS or OAPS per regulation.  Confirmed abuse will be reported to the PA State Police per regulation. 11 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 15. Employees and volunteers may not engage in or previously been convicted of individual abuse, indecency with a consumer, or injury to a consumer. Personal Interactions Outside the Organization Research shows many cases of organizational abuse occur off-site and outside of regularly scheduled activities. Shared Support, Inc. allows contact outside of regularly scheduled activities with prior approval by Program Management.  Examples of contact outside of regularly scheduled program activities:<\/p>\n<li>Private lessons/coaching<\/li>\n<li>Mentorship<\/li>\n<li>Social interactions between employees or volunteers and their family members, such as<\/li>\n<p>birthday parties<\/p>\n<li>Overnight trips and vacations<\/li>\n<li>Rides to/from organization or extracurricular activities and events<\/li>\n<li>Attending public events in a shared community (like graduation, sports events, religious<\/li>\n<p>ceremonies) If Staff or Volunteer Interactions with Individuals Outside of Regularly Scheduled Program Activities are to Occur, the Following Must Occur Prior to the Activity:<\/p>\n<li>The employee or volunteer must contact their immediate supervisor to discuss the<\/li>\n<p>activity, including the date, time, duration and location of the activity, as well as other friends or family members who may be participating in the activity or event.<\/p>\n<li>If applicable, Shared Support will acquire guardian approval (i.e. individuals are at least<\/li>\n<p>18 years of age and competent decision makers)<\/p>\n<li>Define the purpose or rationale for the outside contact.<\/li>\n<li>Employees/volunteers must report immediately if anything unusual occurred that could<\/li>\n<p>be misinterpreted as inappropriate behavior.<\/p>\n<li>Following the event or activity, individuals may initiate communication or contact with<\/li>\n<p>employees or volunteers as deemed appropriate by the interdisciplinary team (i.e. cell phone, email, social media). IX. One to One Support (Staff Member/Volunteer/Lifesharing Provider to Individual) Many individuals supported by Shared Support, Inc., whether residing in a community or lifesharing home, or involved in community participation or employment supports, receive authorized 1:1 staff to individual supervision.  Shared Support is committed to minimizing the risk of abuse, thereby protecting both the individuals and staff members.<\/p>\n<h3>Implementation:<\/h3>\n<p>One-on-one interactions with individuals should only occur during programming under authorized circumstances as determined by the individuals\u2019 Individual Support plan. The purpose of this policy is to ensure the organization clearly communicates expectations for employees and volunteers and gives examples of appropriate behavior when authorized one-on-one interactions occur. In those situations where one-on-one interactions are authorized, employees and volunteers should observe the following guidelines to limit the risk of abuse or false allegations of abuse: 12 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026<\/p>\n<li>Clock in and out of iCM, the Shared Support electronic health record, timely at the time<\/li>\n<p>of service delivery. The iCM mileage tracker is used to monitor the location of staff while they are on duty to ensure accountability and accurate documentation of travel.<\/p>\n<li>Engage in CPS and Employment Services in the community settings as noted in the<\/li>\n<p>Individual Support Plan. Document these services accurately including setting and time of service provision.<\/p>\n<li>Maintain accurate documentation in the Shared Support electronic health record system,<\/li>\n<p>iCare Manager. Document and immediately report to your supervisor or the on-call personnel outside of normal business hours any unusual incidents, including physical interactions, disclosures of abuse or maltreatment, behavioral outbursts and how they were handled, injuries, or any interactions that might be misinterpreted or that made you uncomfortable.<\/p>\n<li>With the exception of personal hygiene needs, such as bathing, toileting, assisting the<\/li>\n<p>individual with nighttime or waking routines and assisting the person to dress if their ISP needs define this level of care, interactions with individuals should occur as much as is possible in the common areas of the home, such as the kitchen, living and dining rooms. Ensure appropriate physical and verbal interactions align with Shared Support\u2019s established Incident Management and Abuse policies and are limited to the task at hand. Report any unusual incidents or suspicion of unusual incidents immediately to your immediate supervisor or to on-call personnel outside of normal business hours.<\/p>\n<li>If meeting 1:1 in a Shared Support conference room or office, leave the door open or<\/li>\n<p>move to an area that can be easily observed by others passing by. If the door must be closed for confidentiality purposes, maintain documentation of the meeting in ICare Manager where the note can be viewed by your supervisor.<\/p>\n<li>Anticipate unannounced and random visits from Program leadership, Program<\/li>\n<p>Specialists, family members or other designated persons, Compliance Specialists and Maintenance personnel. One-on-one Interactions Most abuse occurs when an adult is alone with an individual, or when an individual is alone with another peer.  Shared Support, Inc. strives to eliminate or reduce unnecessary one-on-one interactions whenever possible, but with the understanding that one-on-one support will occur within community homes and potentially lifesharing homes per the individual\u2019s Individual Support plan.  If you observe unusual or unauthorized one-on-one interactions between employees and consumers, you should immediately report this to your immediate supervisor or to on-call personnel outside of normal business hours at 570-213-9762. Acknowledgement 13 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026 I attended an orientation that describes and explains the organizational Abuse and Molestation Policies. I understand and voluntarily agree to abide by these policies. 14 2018; Revised 05/21/21; 07/16/21; 08/26/21;08/05/25; 07/10/2026<\/p>"}, {"slug": "artificial-intelligence-ai-use-policy", "title": "Artificial Intelligence (AI) Use Policy", "revised": "8.20.25", "pages": 3, "imageOnly": false, "trimmed": false, "html": "<h3>POLICY:<\/h3>\n<p>Artificial Intelligence (AI) Use Policy<\/p>\n<h3>SCOPE OF POLICY:<\/h3>\n<p>This policy applies to all staff, contractors and volunteers who may use AI tools as part of their work with Shared Support, Inc.<\/p>\n<h3>STATEMENT OF POLICY:<\/h3>\n<p>This policy establishes guidelines for the ethical and responsible use of Artificial Intelligence (AI) at Shared Support, Inc. The purpose is to ensure that AI tools enhance, rather than replace, human judgment in the support of individuals with Intellectual and Developmental Disabilities (IDD).<\/p>\n<h3>IMPLEMENTATION OF POLICY:<\/h3>\n<p>Guiding Principles 1. Person-Centered Focus o AI may be used to support staff in providing quality services but will never replace individualized decision-making, personal relationships or human interaction with the people we support. 2. Ethical Use o AI will only be used in ways that respect the dignity, privacy and rights of the people we support. o AI will not be used to make autonomous decisions about medical care, behavior supports or other critical life matters. 3. Data Privacy and Security o AI tools must comply with HIPAA and all applicable data protection laws. o Personal Identifiable Information (PII) and Protected Health Information (PHI) must never be entered into AI systems. 4. Human Oversight o AI outputs must always be reviewed and validated by staff before being acted upon. o Staff remain responsible for all decisions and actions, regardless of AI tool involvement. Acceptable Uses 210 Bridge Avenue \u2219 Sunbury, PA 17801 \u2219 Phone: 570. 286.4982 \u2219 Fax: 570.286.4984 www. sharedsupport.org 08/20/2025 AI may be used for: Drafting or summarizing documentation, policies or reports (with staff review). Training and education support (e.g., generating scenarios or learning tools). Scheduling, reminders, operations and administrative support. Analyzing aggregated, de-identified data for quality improvement. Supporting accessibility, such as reading text out loud or turning speech into text. Prohibited Uses AI must not be used for: Making choices about a person\u2019s medical care, behavior supports or important life decisions. Storing or sharing personal/private information unless approved by the organization. Watching or tracking people without their knowledge and consent. Replacing staff judgment or the personal relationships we build with the people we support. Uploading Shared Support, Inc. intellectual property, including but not limited to, materials, documents, policies, handbooks, training guides, photographs, software and other creative works developed by employees, contractors, or volunteers while performing their duties for the organization. Intellectual property also includes the organization\u2019s name, logo and branding materials. Staff Responsibilities Ensure AI use aligns with this policy and all applicable laws. Validate and fact-check all AI-generated content before using it. Report any concerns about misuse, bias or errors in AI tools to supervisors. Participate in training related to responsible AI use. Organization Responsibilities Vet and approve AI tools before implementation. Provide staff training, as the need is identified, on safe and ethical AI use. Regularly review the impact of AI on service quality, privacy and outcomes. Update this policy as technology, laws and best practices evolve. Accountability Failure to adhere to this policy may result in disciplinary action, up to and including termination of employment or contract. Reminder 2 | P a g e 0 8 / 2 0 / 2 0 2 5 AI is a tool to help staff \u2014 not a replacement for people, relationships or good judgment. 210 Bridge Avenue \u2219 Sunbury, PA 17801 \u2219 Phone: 570. 286.4982 \u2219 Fax: 570.286.4984 www. sharedsupport.org 08/20/2025<\/p>"}, {"slug": "confidentiality-security-access-to-electronic-protected-health-information-ephi", "title": "Confidentiality Security - Access to Electronic Protected Health Information (ePHI)", "revised": "3.6.23", "pages": 2, "imageOnly": false, "trimmed": false, "html": "<h3>POLICY:<\/h3>\n<p>Confidentiality \u2013 Security - Access to Electronic Protected Health Information (ePHI)<\/p>\n<h3>SCOPE OF POLICY:<\/h3>\n<p>This policy applies to all Shared Support employees and contractors.<\/p>\n<h3>STATEMENT OF POLICY:<\/h3>\n<p>The confidentiality and security of ePHI is critical to the success of our organization. This policy outlines the rules and regulations regarding employee access and use of ePHI, the responsibilities of employees in safeguarding ePHI and the consequences for violating this policy. All employees are required to follow these policies to ensure compliance with applicable laws and regulations. Shared Support, Inc.\u2019s Executive Leadership team, consisting of the Chief Executive Officer, Chief Programming Officer, Chief Operating Officer, Program Director and Senior Director of Business Operations, will decide on each employee\u2019s need for ePHI based upon the employee\u2019s job classification.<\/p>\n<h3>IMPLEMENTATION OF POLICY:<\/h3>\n<p>1. Access to ePHI: Access to ePHI is restricted to only those employees who require it to perform their job duties. Employees will not access ePHI for any other purpose. Shared Support\u2019s Onboarding/Offboarding of Employees Policy outlines the specific procedures for determining ePHI access. 2. Use of ePHI: Employees must only use ePHI for purposes related to their job duties. Employees must not use ePHI for personal purposes, such as social media or emailing, or share ePHI with anyone who is not authorized to access it.  If an employee has any questions regarding the sharing of ePHI, the employee must seek the input of Executive Leadership personnel or the organization\u2019s Privacy Office prior to sharing the information. 3. Protection of ePHI: Employees must take all necessary steps to protect ePHI from unauthorized access, theft, loss, or damage. This includes using strong passwords, changing the password every 60 days as prompted, not leaving computers or devices unattended including in unlocked vehicles and reporting any security incidents or breaches. 4. Reporting Requirements: Employees must report any potential breaches or security incidents involving ePHI immediately to a member of the Executive Leadership Team or the Privacy Officer. 5. Training: All employees must undergo HIPAA training upon hire and annually thereafter to ensure they understand the importance of protecting ePHI and are aware of the policies and procedures for handling ePHI. 210 Bridge Avenue \u2219 Sunbury, PA 17801 \u2219 Phone: 570. 286.4982 \u2219 Fax: 570.286.4984 www. sharedsupport.org 6. Disciplinary Actions: Any employee who violates this policy may be subject to disciplinary action, up to and including termination of employment, as well as civil and criminal penalties as allowed by law. 2 | P a g e 0 3 / 0 6 / 2 3<\/p>"}, {"slug": "confidentiality-and-phi-policy", "title": "Confidentiality and PHI Policy", "revised": "04.14.23", "pages": 13, "imageOnly": false, "trimmed": false, "html": "<h3>POLICY:<\/h3>\n<p>Confidentiality of Protected Health Information and HIPAA Security<\/p>\n<h3>SCOPE OF POLICY:<\/h3>\n<p>This policy applies to all Shared Support, Inc. employees and independent contractors.<\/p>\n<h3>STATEMENT OF POLICY:<\/h3>\n<p>Shared Support is committed to protecting the privacy and confidentiality of health information of the people we support, as well as our staff members. Protected health information is strictly confidential and should never be given, nor confirmed, to anyone who is not authorized under Shared Support, Inc. policies or applicable law to receive the information. This policy further addresses the compliance issues regarding electronic protected health information (\u201cePHI) that Shared Support creates, receives, maintains and/or transmits on behalf of its group health plans in accordance with the final HIPAA Security rule published February 20, 2003 by the Department of Health and Human Services (HHS).<\/p>\n<h3>IMPLEMENTATION OF POLICY:<\/h3>\n<p>By implementation of this policy, Shared Support intends, on behalf of its group health plans, to:<\/p>\n<li>Ensure the confidentiality, integrity and availability of all ePHI it creates, receives,<\/li>\n<p>maintains or transmits;<\/p>\n<li>Protect against any reasonably anticipated threats or hazards to the security or integrity of<\/li>\n<p>ePHI;<\/p>\n<li>Protect against any reasonably anticipated uses or disclosures of such information that are<\/li>\n<p>not permitted or required by the Privacy Rule;<\/p>\n<li>Ensure compliance by the workforce.<\/li>\n<p>This policy takes into account Shared Support\u2019s:<\/p>\n<li>Size, complexity and capabilities;<\/li>\n<li>Technical infrastructure, hardware and software security capabilities;<\/li>\n<li>Costs of security measures; and<\/li>\n<li>Probability and criticality of potential risks to electronic protected health information.<\/li>\n<p>1. Definition of Protected Health Information For purposes of this policy, the term \u201cprotected health information\u201d means any information, including very basic information as name and address, that: (1) relates to the past, present or future physical or mental health or condition of an individual, the provision of health care to an individual, or the past, present or future payment for the provision of health care to an individual, and; (2) either identifies the individual or could reasonably be used to identify the individual. 1 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 Electronic PHI or ePHI is health information about a group health plan participant that is in an electronic format.  Health information includes information about the individual\u2019s past, present or future physical or mental condition, the provision of health care to the individual, or the past, present or future payment of the provision of health care to the individual. This policy applies to protected health information in any form including spoken, written or electronic form.  It is the responsibility of Shared Support, Inc. to protect the privacy and preserve the confidentiality of all protected health information.  This includes, but is not limited to, compliance with the protective procedures below. The Final Rule is the final HIPAA Security Rule, 45 CFR Parts 160, 162 and 164, published February 20, 2003. 2. Public Viewing/Hearing Shared Support, Inc. employees and independent contractors are required to keep protected health information out of public viewing and hearing.  For example, protected health information should not be left unattended on desks or left unlocked in the office or home in order to prevent information from being accessible to the public or others who do not have a \u201cneed to know.\u201d Support staff and contractors should also refrain from discussing protected health information in public areas, such as parks, grocery stores or reception areas, unless doing so is necessary to provide emergency treatment. Employees and independent contractors are expected to ensure that confidential information is not left displayed on a computer screen where it may be viewed by individuals not authorized to view the information. Employees and independent contractors who transport protected health information in any form are expected to take reasonable precautions to safeguard, secure and conceal the information at all times.  They should only transport the minimum information necessary to perform their duties and they will ensure that the information is not viewable or accessible to others by locking the records in the trunk of the vehicle, when possible.  Protected health information in transport should never be left unattended or unsecured and loss or theft of information should be immediately reported to the person\u2019s supervisor. Upon termination of employment or contract, all copies of protected health information must be returned to Shared Support, Inc. 3. Sharing Information with Families and Others Involved Employees and independent contractors should take care in sharing protected health information with families and friends of persons supported.  Information may generally be shared with a personal representative, a family member, relative or close personal friend who is involved with the person\u2019s circle of support or payment for support. Persons receiving support can agree or object to disclosure of protected health information and staff members and independent 2 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 contractors may only share information that is relevant to the involvement of the family member, relative or close personal friend in support of, or payment for, the person\u2019s care. Employees and independent contractors may only disclose, remove, photocopy, print, email or otherwise distribute protected health information:<\/p>\n<li>As required by their job duties and responsibilities;<\/li>\n<li>To other Shared Support employees and independent contractors on a \u201cneed to know\u201d<\/li>\n<p>basis;<\/p>\n<li>Pursuant to any contractual obligation with an applicable state, federal or local<\/li>\n<p>organization, such as the Department of Human Services, Administrative Entities and Supports Coordination Units;<\/p>\n<li>As may otherwise be required by Shared Support policy, regulation or state or federal<\/li>\n<p>law. 4. Photography \u2013 Videotaping \u2013 Authorization for Use or Disclosure Each person receiving support completes an initial and annual consent packet that includes a photography/videotaping/media consent form to be signed by the individual and/or their guardian or designated person.  This form is for the use of Program Management and Leadership to determine if a person may be photographed and/or videotaped and with whom the photographs and videotapes can be shared (i.e. physicians, social media, marketing).  If you are uncertain if photographs or videos of an individual can be taken, please contact your Program Specialist or Program Leadership staff for direction. If at any time a person expresses that they do not want their photograph taken, please respect their wishes.  Photographs should not be shared on a staff person\u2019s social media site without express permission of the individual and the Program Specialist or Program Leadership staff. It is never acceptable for nude photographs or videos to be taken of an individual. If a physician requests a photograph or video to be taken of a specific body part for observation, a Shared Support cell phone camera will be given to staff members to take said picture.  Any physician requests for photos and/or videos must first be approved by the individual and their guardian, if applicable, and all photos and/or videos will be uploaded through the physician\u2019s portal when one is available. 5. Emailing and Faxing Information Staff and independent contractors should not transmit protected health information over the internet (including email) and other unsecured networks unless it has been encrypted and password protected. All staff emails must contain the prescribed confidentiality statement, including emails sent from a smart phone. Transmission of protected health information by fax is permitted only when using the approved Shared Support, Inc. fax cover sheet containing the prescribed confidentiality statement and should be limited to urgent transmittals of protected health information. Unless necessary in emergency situations, faxing of highly sensitive or personal information should be limited. In general, the following information should not be faxed:  drug dependency, alcohol dependency, 3 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 mental illness/psychiatric information, sexually transmitted disease information, HIV status, and genetic test results. Location of Shared Support fax machines will be secure and inaccessible to the public, when possible. When it is determined that a fax has been sent to the incorrect individual or organization, reasonable efforts should be made to obtain the copies from the recipient or ensure that they are destroyed. The Privacy Officer should be notified of the error to evaluate whether further mitigation is necessary and whether breach notification is required. 6. Administrative Safeguards Security Management Process 164.308 (a) (1) a. Risk Analysis Shared Support has conducted an accurate and thorough assessment of the potential risks and vulnerabilities to the confidentiality, integrity and availability of ePHI. The analysis included: o Security processes (security administration, security monitoring, incident response and virus detection). o Physical access to the systems containing ePHI and other critical operations areas. o Contingency planning. o Operating system and/or platform configurations. o Network configurations. o Data repositories. o Portal/web architecture. o Assessment of potential threats based on the risk analysis Based on the risk analysis, Shared Support has determined that the ePHI that it receives, maintains and transmits is not substantial and is only an incidental part of the work that the organization performs for its staff members. Most of this information is received through email transactions with insurance carriers, reinsurance companies and third-party administrators. This information is used to secure or renew health insurance coverage or reinsurance coverage or to help settle claim disputes.  Because Shared Support is most often not the originator of this information, there is little risk to the confidentiality, integrity and availability of this information. Shared Support will periodically review its risk to determine if the risk has increased or decreased based on the amount and types of ePHI that it creates, receives, maintains and transmits.  Shared Support, in conjunction with Airiam, will perform a yearly Risk Analysis every June with both internal and external Vulnerability Scans and documentation and remediation will be updated to reflect the findings. b. Risk Management 4 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 Shared Support will implement security measures sufficient to reduce the risks and vulnerabilities to a reasonable and appropriate level, and document identified risks, correction actions taken and risks considered acceptable. As appropriate and when necessary, the Security Officer will present all identified risks to Management, along with remedial options and associated costs.  Security decisions will be documented along with supporting rationale. c. Sanctions The Privacy Officer or CEO has the general responsibility for implementation of this policy.  The employees of Shared Support who knowingly violate the HIPAA Security Policy will be subject to disciplinary action up to and including termination and independent contractors may be in jeopardy of breach of contract.  Sanctions will be applied uniformly across the workforce and all employees and independent contractors will be made aware of the ramifications of violating this policy. Any person who has reason to believe that another person has violated this policy should report the issue immediately to their direct supervisor, the Privacy Officer or the CEO.  All reported matters will be investigated and, when appropriate, measures will be taken to remedy the situation. (See Grievance Process) Any attempt to retaliate against a person for reporting a violation of this policy will itself be considered a violation of this policy that may result in disciplinary action up to and including termination of employment or breach of contract. If an employee or independent contractor has questions or concerns about the information contained in this policy, or questions concerning what information may or may not be permitted to be disclosed, they should consult with their immediate supervisor, program director or the Privacy Officer. d. Information System Activity Review Shared Support will regularly review records of information system activity, such as audit logs, access reports (including failed logins) and security incident tracking reports. Shared Support will log and review \u201csecurity events\u201d as recorded by the network. As necessary, Shared Support will perform SYSLOG auditing on accesses to perimeter devices (firewall). The Security Officer will monitor or oversee the monitoring of any information technology vendor who has access to these secure files. Assigned Security Responsibility 164.308 (a) (2) The Security Officer\u2019s responsibilities include the management and supervision of the use of security measures to protect data and the conduct of personnel in protecting data. 5 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 The Security Officer is the Chief Operating Officer (COO), in partnership with Airiam, and the responsibilities of the Security Officer will be included in the COO\u2019s job description and reviewed periodically. Workforce Security 164.308 (a) (3) a. Authorization Shared Support will ensure that all employees and independent contractors (full-time, part-time, contractors and agents) have appropriate access to ePHI and that those who should not have access are restricted. New employees or employees changing positions will be authorized ePHI based on their position. b. Workforce Clearance Procedures Prior to hiring a new employee, the applicable supervisor will assess the honesty and integrity of the individual and will explain the need for maintaining the confidentiality and integrity of any ePHI maintained by Shared Support. Shared Support will only hire an individual if it is determined that the individual poses no threat to the security of the organization\u2019s ePHI.  Interview records and hiring documents will be maintained to substantiate the process. c. Termination Procedures Upon an employee\u2019s termination from employment, the Security Officer or designee will: o Retrieve the following from the individual prior to departure: keys for buildings, filing cabinets, desk, etc.; computer system passwords, company property such as cell phone, computer, files, etc. o Delete their User Code to prevent access to any of the buildings; o Retrieve pertinent company files from the individual\u2019s hard drive; o Format the individual\u2019s hard drive; o Change or delete passwords to computer workstation, network and all email and internet accounts; o If considered necessary, conduct a limited audit of the person\u2019s work station/password activity prior to and/or after termination; o See Employee Onboarding/Offboarding Policy for additional information. Information Access Management 164.308 (a) (4) a. Access Authorization Access to ePHI by Shared Support employees will be based on the position to which the employee has been assigned.  Authorization will be automatic based on these criteria. b. Access Establishment and Modification Password management procedures will ensure the rights each employee has to the appropriate ePHI. Shared Support, Inc. establishes parameters regarding assignment of ePHI access to employees based upon their job title (see Employee Onboarding &amp; Offboarding Policy for grid).  Ultimately the need for access to ePHI is determined by a 6 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 Shared Support leadership team, consisting of the CEO, CPO, COO, Sr. Director of Business Operations and Program Director. Shared Support will consider and implement as appropriate \u201cread only\u201d access rights to certain ePHI.  The Security  Officer will review access rights to ePHI on an annual basis or whenever an organizational restructuring occurs. Security Awareness and Training The Security Officer will (in conjunction with outside consultants when necessary) develop a training program for all staff and independent contractors to include procedures for guarding against, detecting and reporting malicious software such as viruses and worms including scanning and incident procedures, procedures for monitoring log-in attempts and reporting discrepancies and procedures for creating, changing and safeguarding passwords. Training will include an explanation of employees\u2019 right to access ePHI, the minimum necessary standard and an explanation of the sanctions that may be imposed. a. Security Reminders will be sent to employees on an as needed basis. b. Protection from Malicious Software. Shared Support will install virus detection software on its network and update the software periodically. c. Log-In Monitoring.  Shared Support will not specifically monitor log-in attempts but will be aware of this issue as part of its Information System Activity Review. The nature of the ePHI maintained by Shared Support does not require specific attention to this issue. d. Password Management.  Shared Support will require administrative employees overseeing the group health plan to change their passwords on a periodic basis, but no more often than once per quarter. Security Incident Procedures 164.308 (a) (6) Shared Support will address security incidents, which are attempted or successful unauthorized access, use, disclosure, modification or destruction of information or interference with system operations in an information system. Shared Support will: o Identify and respond to suspected or known security incidents by first notifying the information techno
