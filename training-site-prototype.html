eplaces, matches and lighters. 3. No open flames, sparks, burning or smoking tobacco is permitted where oxygen is in use. 4. Oxygen is to be used only as prescribed by an individual\u2019s physician. 5. While using oxygen, do NOT use: -Aerosols such as hair spray or paint -Oil-based face creams or lotions on your nose or face -Petroleum-based products such as Vaseline 6. The oxygen cylinder must be kept in the stand or cart provided. 7. The oxygen cylinders must be stored lying on their sides.  Block the cylinders so they are not able to roll.  If a valve post broke off a cylinder, it could cause considerable harm to anything in its path. 8. Always keep oxygen cylinders in a well-ventilated area because it is normal for small amounts of oxygen to leak.  Do NOT store oxygen cylinders in a closet unless there is a vent in the door.  If you keep oxygen cylinders under the bed, make sure the bed covers do not interfere with the air circulating. Traveling with Oxygen Cylinders 1. Secure oxygen cylinders in your vehicle so they do not roll or bump against other cylinders or objects. 2. Crack a window in the vehicle to increase ventilation. 210 Bridge Avenue \u2219 Sunbury, PA 17801 \u2219 Phone: 570. 286.4982 \u2219 Fax: 570.286.4984 www. sharedsupport.org 02/25/2020 3. Keep oxygen cylinders out of direct sunlight. 4. Never store oxygen cylinders in the trunk of a vehicle. 5. If you will be traveling for an extended period outside of the area of service for your oxygen provider, contact the provider for their assistance in coordinating oxygen services while you travel. I certify that I have reviewed the above information, Oxygen Safe Use and Storage Plan. All my questions have been answered to my full and complete satisfaction.  I also understand that in the future, if I have any questions regarding the plan, I may ask any supervisor or Program Specialist for assistance. _________________________________________________ Individual Name &amp; Signature _________________________________________________ Employee/Lifesharer Name &amp; Signature _________________________________________________ Trainer Name &amp; Signature Date 2 | P a g e<\/p>"}, {"slug": "rectal-suppositories-flyer", "title": "Rectal-Suppositories-Flyer", "revised": null, "pages": 2, "imageOnly": false, "trimmed": false, "html": "<h2>How to Use Rectal<\/h2>\n<h2>Suppositories Properly<\/h2>\n<h3>5<\/h3>\n<h3>1<\/h3>\n<p>Wash your hands Put on a \ufb01 nger cot or disposable glove, thoroughly with if desired (available at a pharmacy). soap and water.<\/p>\n<h3>6<\/h3>\n<p>Lubricate the<\/p>\n<h3>2<\/h3>\n<p>suppository tip If the suppository with a water- is soft, hold it soluble lubricant under cool water such as K-Y Jelly, or place it in a not petroleum refrigerator for jelly (Vaseline). If you do not have this a few minutes to lubricant, moisten your rectal area with harden it before removing cool tap water. the wrapper.<\/p>\n<h3>3<\/h3>\n<h3>7<\/h3>\n<p>Remove the Lie on your side with your lower leg wrapper, if straightened out and your upper leg present. bent forward toward your stomach.<\/p>\n<h3>4<\/h3>\n<p>If you were told to use half of the suppository, cut it lengthwise with a clean, single-edge razor blade. Copyright 2014, American Society of Health-System Pharmacists. All rights reserved. This material may not be reproduced, displayed, modi\ufb01 ed, or distributed without the express prior written permission of the copyright holder. For permission, contact kbiesecker@ashp.org.<\/p>\n<h2>How to Use Rectal<\/h2>\n<h2>Suppositories Properly (continued)<\/h2>\n<h3>8<\/h3>\n<h3>11<\/h3>\n<p>Remain lying down for about 5 minutes to Lift upper buttock avoid having the suppository come out. to expose the rectal area.<\/p>\n<h3>9<\/h3>\n<p>Insert the suppository, pointed end \ufb01 rst, with your \ufb01 nger until it passes the muscular sphincter of the rectum,<\/p>\n<h3>11<\/h3>\n<p>about 1/2 to 1 inch in infants and Discard used 1 inch in adults. (If not inserted past this materials and sphincter, the suppository may pop out.) wash your hands thoroughly. Remember Follow directions carefully Do not miss doses Store suppositories in a cool place and<\/p>\n<h3>10<\/h3>\n<p>avoid melting; refrigerate them if so labeled Hold buttocks together for a few Store medications out of reach of seconds. children Copyright 2014, American Society of Health-System Pharmacists. All rights reserved. This material may not be reproduced, displayed, modi\ufb01 ed, or distributed without the express prior written permission of the copyright holder. For permission, contact kbiesecker@ashp.org.<\/p>"}, {"slug": "personal-care-hygiene-grooming", "title": "Personal Care Hygiene Grooming", "revised": null, "pages": 15, "imageOnly": false, "trimmed": false, "html": "<h2>Personal Care, Hygiene, and Grooming<\/h2>\n<p>A guide to help Direct Support Professionals understand the importance of health maintenance and the professional ethics that apply when providing personal care. Personal Care Guidelines are also included in this unit.<\/p>\n<h3>Outcomes:<\/h3>\n<li>Understand why personal hygiene is an important part of good<\/li>\n<p>health maintenance<\/p>\n<li>Understand what areas are included in health maintenance<\/li>\n<li>Know when to offer choices when providing personal care<\/li>\n<li>Understand that professional ethics should always be applied when<\/li>\n<p>providing personal care<\/p>\n<h3>Personal Care, Hygiene, and Grooming<\/h3>\n<p>The most important aspect of maintaining good health is good personal hygiene. Personal hygiene which is also referred to as personal care includes all of the following: Bathing and Showering \u00be Hair care \u00be Nail care \u00be Foot care \u00be Genital care \u00be Dental care Personal hygiene is keeping the body clean, and helps prevent the spread of germs. Grooming is caring for fingernails and hair examples of these activities would be styling hair, shaving, trimming and painting fingernails. Maintaining good health also includes the following areas: Nutrition, Leisure/recreation opportunities, sleep, and exercise.  As you can see, there are many factors that contribute to feeling and looking good.  Feeling and looking good are important to each individual\u2019s emotional and physical wellbeing. In your role your responsibilities\u2019 will vary from assisting to providing personal care. These activities are very important and unique for each individual. The DSP\u2019s toolkit includes a set of professional ethics that guide the DSP in everything he or she does. When assisting individuals with personal care, the DSP should be especially mindful of professional ethics. These ethics or principles become routine as they are practiced and applied each day. As a DSP, you will want to apply your professional ethics every time you assist and support an individual with personal care skills.<\/p>\n<li>Respect: As a DSP, I will respect the individuals I support and help others<\/li>\n<p>recognize their value. Personal care should be provided with dignity and respect for the individual.<\/p>\n<li>Promoting Physical and Emotional Well-Being: As a DSP, I am responsible<\/li>\n<p>for supporting the emotional, physical, and personal well-being of individuals receiving support, while being attentive to reducing their risk of harm. Personal care should be provided safely and in a way that promotes the physical and emotional wellbeing of the individual.<\/p>\n<li>Confidentiality: As a DSP, I will protect and respect the confidentiality and<\/li>\n<p>privacy of the individuals I support. An individual has the legal right to have his or her support needs kept confidential and to privacy for personal care.<\/p>\n<li>Honesty and Responsibility: As a DSP, I will support the mission of my<\/li>\n<p>profession to assist individuals to live the kind of life they choose. I will be a partner to the individuals I support. Individuals should be supported in doing as much for themselves as possible.<\/p>\n<li>Self-Determination: As a DSP, I will assist the individuals I support to<\/li>\n<p>direct the course of their own lives. Individuals have the right to direct how personal care is provided. Personal Care Page 1 2/24/2009 Part of the job of a DSP is to support individuals so they can be more independent. Some individuals may be able to bathe, shave, dress, and otherwise take care of themselves with no support. Others may need assistance or support to complete their personal care activities. Depending on the abilities of each individual, the DSP will need to provide more or less support. It is important to remember that having opportunities to make choices is a key to leading a healthy happy life. Just as individuals have the opportunity to make choices about what clothes to wear and what to eat; they need to have the choice of how and when they complete their personal care activities. For example, one individual might like to bathe at night, while another likes to shower in the morning.  Having choices about personal care also involves letting the individual make choices about whom or which DSP will provide the personal care. Individuals have the right to choose the DSP they trust, feel comfortable, and safe with to assist with personal care. New support people should develop a relationship with the individual before providing personal care. This may mean that sometimes the individual may chose to wait until the next day to shower if a new support person is working. The DSP needs to be aware of these individual preferences and support them. Please see the \u201cPersonal Care Protocol\u201d booklet attached to this unit. This booklet will provide additional information about obtaining permission, participation levels, and communication. The \u201cPersonal Care protocol\u201d booklet should be completed every year at the Person Centered Planning meeting, and updated through out the year as necessary. This booklet outlines the choices each individual has made about the practices you should follow when assisting with personal care.  The booklet covers the following areas:  Lifting, Positioning, and eating Dressing, Bathing / Showering, Toileting Toileting and Other Issues This booklet helps to assure that an individuals personal preferences are always honored no matter which support staff provides assistance.  It is also a useful tool for training new direct support professionals!<\/p>\n<h3>Personal Care Guidelines<\/h3>\n<p>Hair Grooming Having clean, well groomed hair is important to everyone, and is no less so For the individual you support. Individuals like different brands of shampoo or conditioner and may have a preferred style. Individuals may also change their minds about how they style their hair. All of these choices should be respected and supported. \u00be Ask the individual if he or she has a preference for his or her hair style today. \u00be Teach and assist with drying wet hair with dryer and applying gels, hair spray, and other hair products as appropriate. \u00be If hair is long, divide into sections before combing or brushing. Personal Care Page 2 2/24/2009 \u00be Teach and assist the individual to comb or brush hair from scalp to ends of hair. Note: If the hair is tangled, use a wide-tooth comb. Why? Pulling on tangled hair can cause damage to the hair. Gently combing or brushing from the scalp to the ends of the hair stimulates circulation. If the hair is curly, start at the ends of the hair to assure that all tangles are removed before brushing from the scalp to the ends. \u00be Encourage the individual to look in a mirror when finished styling. Why? Having hair clean and groomed looks great, increases self esteem, and you can\u2019t have a \u201cbad hair day\u201d! Supplies<\/p>\n<li>Comb<\/li>\n<li>Brush<\/li>\n<p>Mirror Personal hair products<\/p>\n<h3>Attention<\/h3>\n<p>\u00be Remember, hairstyle is an individual choice. \u00be Use only the individual\u2019s personal comb and brush. \u00be Clean comb and brush regularly. \u00be Combs with sharp teeth can injure sensitive scalps. \u00be Use comb and brush with a gentle touch. \u00be Encourage the individual to do as much as he or she can for him/herself. Fingernail and Toenail Care Cleaned and trimmed fingernails and toenails are important for overall health. Germs often collect underneath the nails. Frequent and thorough hand washing and foot care is a good way to prevent germ or fungus buildup. Nails that become too long and/or are rough and torn can scratch and cut an individual\u2019s skin and may result in a local infection. Some individuals (those with diabetes) should have their nail care completed by a health care professional. Athlete\u2019s foot, a fungus that causes an inflammation, cracking, and peeling of the skin between the toes and can also infect the toenails is of particular concern, and must be treated as soon as it is noted by the DSP. Individuals often like to have nail color applied and may need assistance. Cleaning and trimming nails Special care should be practiced when assisting with nail care. Individuals with diabetes require professional assistance with nail care. Personal Care Page 3 2/24/2009 Toenails and fingernails should be kept clean, neatly trimmed, and smooth to prevent injury to skin. Trimming the nail too short may cause ingrown nails that can be painful and cause infection. Encourage individuals to do as much as they can for themselves. Supplies \u00be Personal nail clippers or nail scissors \u00be Personal cuticle or orange stick \u00be Bathtub or bowl \u00be Clean water \u00be Soap \u00be Personal towel \u00be Personal emery board or nail file PROCEDURE \u00be Teach and assist the individual how to soak his or her hands or feet in warm water for at least 5 minutes and then wash hands or feet with soap. Why? Soaking will soften the nails and make them easier to trim. \u00be Teach and assist how to gently push nail cuticle back (from fingers or toes) with cuticle or orange stick to prevent hangnails. Note: A clean washcloth can be used for this step. DSP can demonstrate these steps on his or her own nails. \u00be Teach and assist the individual to clean under the nails (fingers or toes) with orange stick or tool on nail clipper for this purpose. \u00be Teach and assist the individual to change the water and wash, rinse, and dry his or her hands or feet. Note: Do not rinse in soapy water. Why? Soapy water has many germs from the nails. This will prevent skin on the hands and feet from chapping. \u00be Teach and assist the individual to use nail clippers or nail scissors to trim toenails straight across. Fingernails can be trimmed with a slight curve. Use an emery board or nail file to shape and smooth the nails. Remember: Individuals with diabetes need professional assistance for nail care. \u25cb \u25cb Shaving Once again, shaving one\u2019s legs, underarms, or face is a very personal matter. Personal Care Page 4 2/24/2009 Cultural differences may be a key to whether an individual shaves or does not shave. For example, in some cultures, women do not shave their legs or underarms. In some cultures, men do not shave their facial hair. It is important to assist and support the individual to shave safely and to avoid nicks and cuts that can lead to infection. Some individuals may learn to use an electric razor. Other individuals may be assisted and supported in using a blade razor. Shaving steps can be used for facial, leg, or underarm hair. \u00be An electric razor should not be used in same room where oxygen is used. \u00be Electric razors should not be used around water. \u00be Check all types of razors for chips or rust on the blades. \u00be Always dispose of used razor blades. \u00be Use only an individual\u2019s personal razor. \u00be Supervise the use of razors closely for safe and correct handling before individual shaves independently. \u00be Encourage the individual to do as much for him or herself as possible. Supplies \u00be Personal electric or other style razor \u00be Shaving cream and aftershave lotion \u00be Personal towel \u00be Sink or other clean water source \u00be Mirror PROCEDURE \u00be Teach and assist the individual in locating the best place to complete his or her shaving. Use of a mirror is recommended for shaving the face or under the arms. Note: Depending on what part of the body one is shaving, a sink, bowl, bathtub, or shower may be more safe and functional. Why? Safety is important while shaving. The individual should be comfortable and sitting or standing securely. \u00be Teach and assist the individual to check his or her skin for moles, birthmarks, or cuts. If any changes are observed in the size, shape, or color of a mole or birthmark, the individual should be seen by his or her physician. Why? Shaving over these areas can cause bleeding and infection. Changes may Personal Care Page 5 2/24/2009 indicate illness. \u00be Teach and assist the individual to open shaving cream and remove safety cap from razor (non-electric razor) or plug electric razor into outlet. Note: Again, safety is important. Shaving cream in an electric razor can be dangerous. Electric razors near water can cause injury or death. Shaving with Non-Electric Razor \u00be Teach and assist the individual to wash area to be shaved with warm, soapy water. (Face, underarms or legs) Why? Washing removes oil and bacteria from the skin and helps to raise the hair shafts so it will be easier to shave. \u00be Teach and assist the individual how to apply shaving cream or lather with soap. Note: Some soaps and shaving creams can be harsh on the skin, or an individual can be allergic to them. There are different brands on the market for sensitive skin. An electric razor may work better for an individual with skin allergies. Why? Shaving cream softens the skin and helps the razor glide over the skin to prevent nicking and cutting. \u00be If the DSP is shaving the individual, wear disposable gloves. Why? To prevent spread of germs. \u00be Teach and assist the individual to use the fingers of one hand to hold the skin tight and shave in the direction the hair grows. Note: Shaving in the direction the hair grows makes a smoother shave and helps prevent irritating the skin. The DSP may want to role play or demonstrate this shaving step on him or herself. \u00be Teach and assist the individual to rinse the razor often to remove hair and shaving cream so the cutting edge stays clean. \u00be Teach and assist the individual to use short strokes around chin and lips on the face; front and back of knees on the legs; and under the arms. Note: Short strokes give better control of the razor and help prevent nicks and cuts. \u00be Teach and assist the individual to rinse off the remaining shaving cream and dry the skin with gentle patting motions. Why? Left-over shaving cream can irritate and dry the skin. Rubbing freshly shaven skin can be irritating. \u00be If shaving the face, offer the individual a mirror to inspect a job well done. Personal Care Page 6 2/24/2009 Why? Taking pride in completing personal care skills increases self-esteem. \u00be Teach and assist with applying aftershave or skin lotion if individual chooses. Note: Alcohol in aftershave acts as an antiseptic for tiny nicks and cuts. It also has a cooling and refreshing sensation. \u00be Teach and assist the individual with cleaning razor and storing all shaving items. \u00be Teach and assist the individual to wash, rinse, and dry his or her hands after shaving. Shaving with an Electric Razor \u00be Teach and assist the individual to safely turn on the electric razor. Explain the safety of shaving away from water. Why? Electrocutions can occur when electric appliances, including razors, come into contact with water. \u00be Teach and assist the individual to use a mirror while shaving the face or under the arms. \u00be Teach and assist the individual in using a gentle, even pressure as he or she moves the electric razor over the skin. Demonstrate how running one hand over the shaved area can locate missed hair. \u00be Teach and demonstrate how to clean hair from the blades as needed during the shave. Note: Be sure razor in turned off and unplugged each time the blades are cleaned. Why? Injuries can occur when the razor is turned on or plugged into an electrical socket. Cleaning the blades keeps them sharp and provides for a smoother shave. \u00be Teach and assist with applying aftershave or skin lotion if the individual chooses. Note: Alcohol in aftershave acts as an antiseptic for tiny nicks and cuts. It also has a cooling and refreshing sensation. \u00be If shaving the face, offer the individual a mirror to inspect a job well done. Why? Taking pride in completing personal care skills increases self-esteem. \u00be Teach and assist the individual with cleaning the razor and storing all shaving items. \u00be Teach and assist the individual to wash, rinse, and dry his or her hands after shaving. Page 7<\/p>\n<h3>Bathing and Perineal Care<\/h3>\n<p>Bathing means cleaning one\u2019s body from head to toe. Perineal care means the bathing of the genital and anal (rectum) area, or \u201cprivate parts.\u201d Providing assistance and support for bathing can be a very sensitive personal care activity for an individual and a DSP. Routinely, this activity is completed by female DSPs for women and girls and by male DSPs for men and boys.  See below for licensed residential homes. The DSP needs to know what bathing skills an individual has before beginning to provide assistance and support. It is important that the DSP provide whatever assistance and support is needed to ensure individuals are clean. Occasionally checking an individual\u2019s personal care skills and assisting when needed will help prevent body odor, discomfort, and infection. The following procedures should be adapted to the specific needs and preferences of each individual the DSP supports. It is the job of the DSP to continue to teach, assist, and support each individual in learning good personal care habits. Each individual will have the opportunity to lead a fuller, happier, more enjoyable life as they become more independent with their own care needs. Remember, good personal hygiene is important to promoting good health. Assisting an Individual with Bathing and Perineal Care Supplies \u00be Clean basin, bathtub, or shower stall \u00be  Robe or clean clothes \u00be  Soap and soap dish or special skin cleanser \u00be  Personal towel \u00be  Personal washcloth \u00be Disposable gloves for perineal care Procedure When assisting with bathing or showering: Remember to check water temperature. It should be warm to the touch. Wash, rinse, and dry each body part to prevent chilling, exposure, and       chapping. Inspect skin for signs of injury or changes in condition. Use soap sparingly and do not leave in water. Provide privacy and warmth for the individual. Talk about things of interest to the individual. Encourage the individual to do as much as he or she can for him/herself. Demonstrate and explain correct bathing or showering procedures. Be prepared with all supplies. Be sure your hands are washed and clean. (Rule 400.14314 (6) [400.15314(6)] requires: &quot;A licensee shall afford a resident the opportunity to receive assistance in bathing, dressing, or personal hygiene from a member of the same sex, unless otherwise stated in the home&#x27;s admission policy or written resident care agreement.&quot;) Page 8 \u00be Teach and assist the individual how to check the water temperature for warmth before beginning. (Place your wrist under water the running.) Why? To prevent a chill or a burn. \u00be Teach and assist the individual to wash his or her hands and wrists. \u00be Teach and assist the individual to wash and rinse each eye. Begin from the inner corner of one eye (near the nose) and moving to the outer corner of the eye. \u00be Repeat this step on the other eye, using a clean corner of the washcloth. Why? Use different ends of the washcloth to prevent the spread of germs from one eye to the other. \u00be Teach and assist the individual to wash and rinse the face, neck, and ears. Use the soap to make suds. Use clean tap water to rinse. Be sure to wash and dry behind the ears. Note: Ask the individual if he or she wants soap or prefers a special cleansing product. Why? Some individuals have sensitive skin. \u00be Teach and assist the individual to wash and rinse one shoulder, underarm, and arm. Why? Beginning near the wrist prevents dripping dirty water (germs) from sitting on already cleaned wrists and hands. \u00be Repeat the previous step for the other shoulder, underarm, and arm. \u00be Teach and assist the individual to wash and rinse the chest and stomach. Check under the breasts and any skin folds as you go along. \u00be Repeat previous step for the back. Note: Make sure the skin is completely dry. Remember to teach and assist the individual to dry completely. \u00be Teach and assist the individual to wash and rinse hip and one leg. \u00be Repeat previous step for the other hip and leg. \u00be Teach and assist the individual to wash and rinse one foot. \u00be Repeat previous step for the other foot. Why? Moisture in the skin folds can result in cracking and the breakdown (infection) of skin. Moisture between the toes can result in cracking and infection. Perineal Care for Males Bathing of the genitals (sex organs) and anal (rectum) area of the body sometimes referred to as the \u201cprivate parts. Procedure: When teaching or assisting with perineal care put on disposable gloves. \u00be Explain to the individual to hold his penis and wash and rinse the tip. Always wash from the small opening (urethra) where the urine flows, outward or towards the end of the penis. Use a different part of the washcloth for each wipe. Why? To prevent spreading germs (contamination) of the urethral opening. \u00be Teach the individual to wash, rinse, and dry the shaft of the penis. Wash and rinse in the direction of the pubic area. Note: If the individual is not circumcised, be sure the foreskin is pulled back and wash, rinse, and dry the penis. Return the foreskin to its natural position. \u00be Teach the individual to spread his legs and wash, rinse, and dry the scrotum (the two sacks at the base of the penis). Clean between the skin folds in this area and under the scrotum thoroughly. \u00be Teach the individual to wash, rinse, and dry the anal area, moving front to back. Use a different part of the washcloth for each wipe. Dry area thoroughly. Why? Moisture between skin folds may cause cracking of the skin and skin breakdown. Perineal Care for Females Procedure: Bathing of the genitals (sex organs) and anal (rectum) area of the body, sometimes referred to as the \u201cprivate parts.\u201d \u00be _ When teaching or assisting with perineal care, put on disposable gloves. \u00be Teach the individual to separate the folds of skin in her genitals, called the labia, and using suds and the washcloth, wash with one down stroke the sides of the labia. \u00be Using a different side of the washcloth, wash down the middle of the labia. Rinse from front to back.. Note: Always wash from the pubic area (front of the genitals) to the anal area to prevent contaminating the urethral opening (where the urine comes out) with germs or bacteria from the anal area. \u00be Teach the individual to wash and rinse the anal area, moving front to back. Use a different part of the washcloth for each wipe. Personal Care Page 10 2/24/2009<\/p>\n<h3>BATHING &amp; SHOWERING SAFETY GUIDELINES<\/h3>\n<h3>PURPOSE: Helps meet many basic needs:<\/h3>\n<p>1. Cleans skin by removing bacteria, and helps prevent the spread of germs 2. Stimulates circulation 3. Exercises muscles 4. Creates a sense of relaxation 5. Promotes physical and emotional wellbeing<\/p>\n<h3>EQUIPMENT:<\/h3>\n<p>1. Washcloth 6. Non-skid bath mat 2. Towels 7. Shower chair, if needed 3. Soap (preferably mild) 8. Shower cap, if needed 4. Personal toiletries (shampoo, 9. Blanket conditioner, deodorant) 10. Extra chair, if needed 5. Personal clothing<\/p>\n<h3>PREPARING THE BATH AREA:<\/h3>\n<p>1. Whenever possible male employees should bathe only men. 2. Whenever possible female employees should bathe only women. 3. To prevent injury, more than one person may be needed when transferring an individual from chair to tub and back to chair. 4. The room should be warm and free of drafts. 5. If necessary, clean the tub before use. 6. If needed, position a chair next to the tub to help with getting in and out. 7. Use a shower chair, if needed. 8. A blanket may be used to cover the person who is using a shower chair to prevent them from becoming chilled. 9. Fill the tub halfway with water. 10. Test the water before the person gets in the tub or shower.  Use either a bath thermometer (100 - 110 F) or check with your elbow.  Do not use your wrist or hand for testing water.  If the water is too hot, first, second or third degree burns may result. 11. If showering, be sure to test the water with your elbow continuously. 12. Gather all equipment and place in the bathing area before the person comes into the bathroom. 13. If you have forgotten any equipment, call for assistance from a coworker. Do not leave the individual unattended in the bathroom. Bath Guide Page 1 2/24/2009<\/p>\n<h3>PROCEDURE:<\/h3>\n<p>1. Check the Treatment Plan to find out how much assistance, teaching and supervision is required for bathing or showering.  Remember the person should complete as much of the routine as possible, and the DSP should look for ways to encourage more independence. 2. Remember to assure that personal choice is honored: does the person prefer a bath or a shower, does the person prefer to bathe/shower in the morning or the evening, what type of shampoo and soap does the person prefer, etc.  Prepare the person by explaining what is going to take place. 3. Assist the individual in undressing as needed, providing for privacy. 4. Observe the skin for changes.  Document and report any changes after completing the bath or shower. 5. Help the person into the tub or shower after checking the water temperature. 6. If complete assistance is needed, use the following steps: a. Fold the washcloth around your hand to form a mitt. b. Begin by cleaning the eye area, then apply soap to the washcloth. Finish washing the face and then proceed down toward the feet. Wash the genital area last. c. Rinse well; give particular attention to skin where two surfaces meet (under the breasts, between the toes, between the thighs). d. Shampoo the hair if necessary. e. Rinse hair thoroughly. f. Help the person out of the tub or shower, onto the bath mat to prevent falls. g. Assist in drying off, including the hair. h. Assist with applying deodorant . i. Assist as needed with dressing. j. Go with the person or take the person to the bedroom to finish grooming. 7. Clean the bathing area. 8. Dry the floor well to prevent falls. 9. Remove soiled linen to the proper location. 10. Return all personal belongings to their proper places.<\/p>\n<h3>SAFETY REMINDERS:<\/h3>\n<p>Never leave the person unattended in the shower or tub unless it is written that way in the Individual Plan of Service. The choice between tub bathing and showering is a matter of personal preference unless it is specified in the Individual Plan of Service or a medical condition dictates which method to use (e.g., open infectious wounds, plaster casts, individual mobility and stability, etc.).  Check with the nurse consultant and/or your supervisor if you have Bath Guide Page 2 2/24/2009 questions or need guidance regarding a specific individual. If a person has fecal material on the body, wash only the affected areas in a tub of warm soapy water.  Then have the person sit on a chair and cover them with a blanket.  Next, clean and disinfect the tub.  Refill the tub and, using clean linens, help the person bathe according to the procedures outlined above. Unplug all electrical appliances in the bathroom (curling irons, electric razors, hair dryers, radio, etc.) If a person has a seizure while bathing, follow this procedure: 1. Immediately support and protect the head. 2. Start the water draining from the tub. 3. Call other staff for assistance. 4. Follow the first aid steps for a seizure. People who have a history of seizures should use a shower chair while showering unless the Individual Plan of Service specifies otherwise. If a person has a seizure while showering in a chair, turn off the water and lower the person to the floor and follow the steps for first aid for a seizure. DSP\u2019s, once you\u2019ve read the unit on Personal Care &amp; Hygiene, as well as the Bath &amp; Showering Safety Guidelines, please click on the link below to take the Personal<\/p>\n<h3>Care &amp; Hygiene Test:<\/h3>\n<h3>\u0099 Personal Care, Grooming, &amp; Hygiene Test<\/h3>\n<p>Bath Guide Page 3 3/26/2009 RESOURCE MATERIALS Some content in this section has been adapted from the following resource<\/p>\n<h3>materials:<\/h3>\n<p>Providing Residential Services in Community Settings:  A Training Guide Michigan Department of Human Services www.michigan.gov/afchfa Licensing Rules for Adult Foster Care family Homes http://www.michigan.gov/documents/dhs/BCAL-PUB-0332_281384_7.pdf Licensing Rules for Adult foster Care large Group Homes (13-20) http://www.michigan.gov/documents/dhs/DHS-BCAL-PUB-334_276575_7.pdf Licensing Rules for Adult Foster Care Group Homes (12 or Less) http://www.michigan.gov/documents/dhs/BCAL-PUB-0333_241598_7.pdf Certification of Specialized Programs Offered In Adult Foster Care Home To Clients With Mental Illness or Developmental Disability http://www.michigan.gov/documents/dhs/BCAL-PUB-0336_214333_7.pdf California Department of Developmental Services:  Direct Support Professional Training Year 1and Year 2 Teacher and Student resource Guides, 2004 http://www.dds.ca.gov/DSPT/Guides.cfm Nursing Assistant Care, 2005 H:\\My Documents\\Personal Care\\RESOURCE MATERIALS.doc<\/p>"}], "printables": [{"title": "Alternative Routes Print out Packet", "path": "6 - Alternative Routes/Alternative Routes Print out Packet.pdf", "dir": "6 - Alternative Routes", "review": false}, {"title": "Easy Print - Alternative Routes", "path": "6 - Alternative Routes/Easy Print - Alternative Routes.pdf", "dir": "6 - Alternative Routes", "review": false}], "links": []}, {"slug": "medication-administration", "title": "Medication Administration", "color": "#7A1521", "delivery": "day2", "documents": [{"slug": "med-admin-topics-to-be-covered", "title": "Med Admin - Topics to be covered", "revised": null, "pages": 2, "imageOnly": false, "trimmed": false, "html": "<p>Medication Administration: Annual Review Topics we will cover: - Proper Medication Administration Process o 3 steps of medication administration o 5 rights of medication administration o 3 principles of medication administration - mentation of medication, medication errors on ICM - When to report errors and what to report. - ation on PMOF\u2019s in ICM.<\/p>"}], "printables": [], "links": []}], "schedule": [{"key": "day1", "label": "Day 1", "how": "Virtual, on Teams", "blurb": "Live session with the training department. The sections below are what you'll be walked through \u2014 open them during the meeting or come back to them any time."}, {"key": "independent", "label": "Independent trainings", "how": "On your own, before Day 2", "blurb": "Work through these yourself between the two virtual sessions."}, {"key": "day2", "label": "Day 2", "how": "Virtual, on Teams", "blurb": "Second live session. Same idea \u2014 the material is here to follow along with and to look back at afterwards."}, {"key": "day3", "label": "Day 3", "how": "In person", "blurb": "Skills session, fit testing, and Q&A with your trainer. Nothing to read here beforehand.", "items": ["FA/CPR/AED skills session", "Fit testing", "Review of annual training materials", "Q&A"]}], "extras": [{"slug": "frequently-asked-questions-steph", "title": "Frequently Asked Questions - Steph", "pages": 2, "path": "Frequently Asked Questions - Steph.pdf", "image_only": false, "html": "<h3>Frequently Asked Questions-<\/h3>\n<p>Fleet policy portion- any and all accidents/incidents/citations whether on or off duty must be reported toSS within 72 hours. What should I do if I am in an accident with an individual in the vehicle with me? Call your program specialist or the On call Program Specialist. PTO-  it is the responsibility of the employee to ensure that they have worked a minimum of 40 hours each week or have the PTO hours available to cover any deficiencies of 40 hours. If hours have not been worked and PTO time is not available to cover the deficiency, then disciplinary action will occur. All hours must be entered by Monday at noon at the end of the pay period or will be paid on the following check. Call offs - must be done via phone call only; texting/emailing are not acceptable. The phone call  must be made to the supervising Program Specialist or the on-call Program Specialist. If you are ill, the covid line must also be called. 888-556-7930. The covid line does not accept text messages. PTO requests should be submitted to the Program Specialist 2 weeks prior. Residential Organization- due to being a residential company, the individual that you are assigned to support, and the weekly schedule, may change upon the discretion and needs of the agency. CP/SE/SH- services that are a 1:1 service where the support staff must be with the individual at all times to ensure the service requirement is met. Personal errands may never be completed on company time or while providing billable services Completion of paperwork/duties- is expected to be completed in totality prior to leaving shift. Attendance Records, iCM clock in and clock out and mileage punches should be completed in real-time. Our supported individuals, although some may be more capable than others, may require assistance with personal hygiene and keeping their home clean and in compliance with regulations. It is the expectation that support staff ensure that the home is kept clean and in compliance if the supported individual refuses to assist with cleaning. It is the expectation that support staff will assist an individual in maintaining proper hygiene as needed. Med admin - 5 rights are expected to be completed with each med pass. An individual&#x27;s personal funds should never be taken home. If an individual is saving for an activity/event those funds may be set aside and placed in a locked box at the home or given to the Program Specialist to hold on to. If Caretracker is not working, use the web browser instead of the app. If still not working notify on-call. Document your time on paper as you normally would, then enter your punches and transportation logs into iCM once the system is back up and you have service. This is also the only time transportation logs should be added after the fact rather than in real time. Who do I reach out to if I need additional support for the individual I&#x27;m working with? Reach out to your PS and they will either provide additional support or our DSP Mentor or BS will assist. What to do if a door alarm/window alarm is not working? If an alarm is not working, On-call or PS should be notified immediately so a replacement can be installed. Do I have Shared Support&#x27;s On call number programmed in my phone? 570-213-9762. If your individual is not feeling well or has a fall, what do you do? Call your program specialist, or On-call if after office hours or on weekends. Document any incidents that could lead to a bruise or mark on the body and report any bruises with an unidentifiable source or skin concerns immediately. Approved OTC medications such as Tylenol etc., do not need on call approval prior to administration. Any PRN for agitation needs approval from O const byId = {};
D.sections.forEach(s => byId[s.slug] = s);
let track = null;               // set by the trainer in the real build
let view = {mode:"home"};
const $ = q => document.querySelector(q);
const secsFor = k => D.sections.filter(s => s.delivery === k);
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function renderRail(){
  $("#rail").innerHTML =
    '<div class="brand" id="home"><b>Shared Support</b><span>Annual Training</span></div>' +
    D.schedule.map(st => {
      const secs = secsFor(st.key);
      return '<div class="grp"><div class="grplab"><b>' + st.label + '</b><em>' + st.how + '</em></div>' +
        (secs.length ? secs.map(s =>
          '<button class="tab" style="--accent:' + s.color + '" data-sec="' + s.slug + '"' +
          ' aria-current="' + (view.slug === s.slug) + '"><span class="dot"></span>' +
          '<span class="tab-t">' + esc(s.title) + '</span>' +
          '<span class="ct">' + s.documents.length + '</span></button>').join("")
        : '<button class="tab" disabled><span class="dot"></span>' +
          '<span class="tab-t">With your trainer</span></button>') + '</div>';
    }).join("") +
    '<div class="certlink"><button class="tab" data-cert="1" aria-current="' + (view.mode==="cert") + '">' +
      '<span class="dot" style="--accent:var(--maroon)"></span>' +
      '<span class="tab-t">Sign your training sheets</span></button></div>';
}

function renderHome(){
  $("#main").innerHTML =
  '<header class="hero"><div class="wrap">' +
    '<span class="org">Shared Support</span>' +
    '<h1>Annual Training</h1>' +
    '<span class="band">Digital Binder</span>' +
  '</div></header><div class="wrap"><div class="sched"><h2>How your training runs</h2>' +
  D.schedule.map(st => {
    const secs = secsFor(st.key);
    const self = st.key === "independent" || st.key === "day3";
    return '<div class="step"><div class="hd"><h3>' + st.label + '</h3>' +
      '<span class="how' + (self ? " self" : "") + '">' + st.how + '</span></div>' +
      '<p>' + st.blurb + '</p><div class="chips">' +
      (secs.length ? secs.map(s =>
        '<button class="chip" style="--accent:' + s.color + '" data-sec="' + s.slug + '">' +
        esc(s.title) + '</button>').join("")
        : (st.items || []).map(i => '<span class="chip static">' + esc(i) + '</span>').join("")) +
      '</div></div>';
  }).join("") + '</div>' +
  '<div class="printrow">Need paper? Every section has a print-ready packet on its page.</div>' +
  '</div>';
}

function renderSection(slug){
  const s = byId[slug];
  $("#main").innerHTML = '<div class="wrap" style="--accent:' + s.color + '">' +
    '<div class="sec-head"><span class="n">' +
      D.schedule.find(x => x.key === s.delivery).label + ' \u00b7 ' +
      D.schedule.find(x => x.key === s.delivery).how + '</span>' +
      '<h2>' + esc(s.title) + '</h2></div>' +
    (s.links.length ? '<div class="links">' + s.links.map(l =>
      '<a class="link" href="' + l.url + '" target="_blank" rel="noopener">' +
      '<b>' + esc(l.title) + '</b><span>' + esc(l.blurb) + '</span>' +
      '<span class="host">' + esc(new URL(l.url).host) + '</span></a>').join("") + '</div>' : "") +
    '<div class="doclist">' + s.documents.map(d =>
      '<button class="doc" data-doc="' + s.slug + '/' + d.slug + '">' +
      '<b>' + esc(d.title) + '</b><span class="meta">' +
      (d.revised ? "rev " + esc(d.revised) + " \u00b7 " : "") +
      d.pages + (d.pages === 1 ? " page" : " pages") + '</span></button>').join("") +
    '</div>' +
    (s.printables.length ? '<div class="printrow">Print-ready packet: ' +
      s.printables.map(p => '<a href="#">' + esc(p.title) + '</a>' +
        (p.review ? ' <span class="flag">needs regenerating</span>' : "")).join(", ") +
      '</div>' : "") +
    '</div>';
  window.scrollTo(0,0);
}

function renderDoc(key){
  const [ss, ds] = key.split("/");
  const s = byId[ss];
  const i = s.documents.findIndex(d => d.slug === ds);
  const d = s.documents[i];
  const body = d.imageOnly
    ? '<div class="placeholder">Scanned handout \u2014 shown as page images in the real build, ' +
      'with a download link. ' + d.pages + ' pages.</div>'
    : d.html + (d.trimmed ? '<div class="placeholder">Trimmed here to keep this ' +
      'prototype a single file. The full document loads from content.json in the real build.</div>' : "");
  $("#main").innerHTML = '<div class="wrap" style="--accent:' + s.color + '">' +
    '<div class="sec-head"><span class="n">' + esc(s.title) + '</span>' +
      '<h2>' + esc(d.title) + '</h2></div>' +
    '<p class="docmeta">' + (d.revised ? "Last revised " + esc(d.revised) + " \u00b7 " : "") +
      d.pages + (d.pages === 1 ? " page" : " pages") + '</p>' +
    '<article>' + body + '</article><div class="pager">' +
    (i > 0 ? '<button data-doc="' + ss + '/' + s.documents[i-1].slug + '">\u2190 ' +
      esc(s.documents[i-1].title) + '</button>' : '<button data-sec="' + ss + '">\u2190 ' + esc(s.title) + '</button>') +
    (i < s.documents.length - 1 ? '<button data-doc="' + ss + '/' + s.documents[i+1].slug + '">' +
      esc(s.documents[i+1].title) + ' \u2192</button>' : '<span></span>') +
    '</div></div>';
  window.scrollTo(0,0);
}

function renderCert(){
  $("#main").innerHTML = '<div class="wrap" style="padding-top:34px">' +
    '<h2 style="font-size:32px;margin:0 0 6px;font-weight:600">Sign your training sheets</h2>' +
    '<p style="color:var(--muted);margin:0 0 24px;max-width:58ch">Fill these in once you\u2019ve ' +
    'finished all three days. Submitting sends them to the training department.</p>' +

    '<div class="sheet"><div class="sh"><b>SHARED SUPPORT, INC.</b>' +
      '<h3>Annual Training</h3><em>Certificate of Training \u00b7 Total hours: 22.5</em></div>' +
      '<div class="row"><label class="field">Employee name<input type="text"></label>' +
      '<label class="field">Job title<input type="text"></label></div>' +
      '<div class="row"><label class="field">Day 1 date<input type="text" placeholder="mm/dd/yyyy"></label>' +
      '<label class="field">Day 2 date<input type="text" placeholder="mm/dd/yyyy"></label></div>' +
      '<div class="row"><label class="field">Day 3 date<input type="text" placeholder="mm/dd/yyyy"></label><span></span></div>' +
      '<div class="attest">' + D.attestation + '</div>' +
      '<label class="field">Staff signature<input class="sig" type="text" placeholder="Type your full name"></label></div>' +

    '<div class="sheet"><div class="sh"><b>EMERGENCY TRAINING</b>' +
      '<h3>Fire Safety Training</h3><em>Topics covered</em></div>' +
      '<div class="topics">' + D.fireTopics.map(t => '<div>' + esc(t) + '</div>').join("") + '</div>' +
      '<div class="row"><label class="field">Employee name<input type="text"></label>' +
      '<label class="field">Training date<input type="text" placeholder="mm/dd/yyyy"></label></div>' +
      '<label class="field">Employee signature<input class="sig" type="text" placeholder="Type your full name"></label></div>' +

    '<div class="sheet"><div class="sh"><b>TRAINING COVER</b>' +
      '<h3>First Aid / CPR / AED</h3><em>Your trainer tells you which of these applies to you</em></div>' +
      '<div class="track">' +
        '<button data-track="recert" aria-pressed="' + (track==="recert") + '">Recertification \u00b7 2.75 hours</button>' +
        '<button data-track="review" aria-pressed="' + (track==="review") + '">Review only \u00b7 2.0 hours</button></div>' +
      '<div class="row"><label class="field">Employee name<input type="text"' + (track?"":" disabled") + '></label>' +
      '<label class="field">Date<input type="text" placeholder="mm/dd/yyyy"' + (track?"":" disabled") + '></label></div>' +
      '<label class="field">Employee signature<input class="sig" type="text" placeholder="Type your full name"' +
        (track?"":" disabled") + '></label></div>' +

    '<div class="acts"><button class="submit"' + (track?"":" disabled") + '>Submit signed sheets</button>' +
    '<button class="ghost" id="print">Print these sheets</button></div>' +
    '<p class="note">Prototype \u2014 nothing is submitted or emailed yet.' +
      (track ? "" : " Pick a First Aid option to enable signing.") + '</p></div>';
  window.scrollTo(0,0);
}

function render(){
  renderRail();
  if(view.mode === "home") renderHome();
  else if(view.mode === "cert") renderCert();
  else if(view.mode === "doc") renderDoc(view.key);
  else renderSection(view.slug);
}

document.addEventListener("click", e => {
  const doc = e.target.closest("[data-doc]");
  if(doc){ const k=doc.dataset.doc; view={mode:"doc", key:k, slug:k.split("/")[0]};
    $("#rail").classList.remove("open"); render(); return; }
  const sec = e.target.closest("[data-sec]");
  if(sec && !sec.disabled){ view={mode:"sec", slug:sec.dataset.sec};
    $("#rail").classList.remove("open"); render(); return; }
  if(e.target.closest("[data-cert]")){ view={mode:"cert"};
    $("#rail").classList.remove("open"); render(); return; }
  if(e.target.closest("#home")){ view={mode:"home"}; render(); return; }
  if(e.target.closest("#print")){ window.print(); return; }
  const tr = e.target.closest("[data-track]");
  if(tr){ track = tr.dataset.track; render(); }
});
$("#railtoggle").addEventListener("click", () => {
  const open = $("#rail").classList.toggle("open");
  $("#railtoggle").setAttribute("aria-expanded", open);
});
render();
</script>
</body>
