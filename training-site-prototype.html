logy vendor; o Mitigate, to the extent practicable, harmful effects of security incidents that are known to the organization; and o Document security incidents and their outcomes. All security incidents will be reported to the Security Officer for recording in a Security Incident Log, which will be maintained by the Security Officer for period of six (6) years. When appropriate, the contact person for the group health plans with which the compromised ePHI is associated will be made aware.  Shared Support\u2019s response to the security incident will depend on the extent of the incident and the magnitude of the risk to ePHI. 7 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 All employees will be notified of the security incident, if appropriate, and will be told what they should do to respond. Contingency Plan  164.308 (a) (7) Shared Support will respond to an emergency or other occurrence (fire, vandalism, system failure, natural disaster) that damages systems that contain ePHI.  This will include following the steps outlined in the: a. Data Backup Plan &amp; Disaster Recovery Plan All Shared Support data, including ePHI, is cloud based. b. Emergency Mode Operations Plan In the event of an emergency, Shared Support will not need to re-establish immediate operations. Management employees will be able to work from their homes as needed and will have access to ePHI  as soon as reasonably possible.  There are no critical business processes using ePHI that will be affected by an emergency. c. Testing and Revision Procedure The Security Officer will periodically reassess, test and revise as necessary Shared Support\u2019s Contingency Plans. d. Applications and Data Criticality Analysis Shared Support will periodically assess whether the ePHI maintained has changed so that the Contingency Plan will become more or less critical to operations. Shared Support\u2019s Security Committee is comprised of its Officers: Chief Executive Officer, Chief Financial Officer, Chief Programming Officer, Chief Operating Officer/Security Officer, in conjunction with Airiam. Evaluation 164.308 (a) (8) Shared Support will perform a periodic technical and non-technical evaluation, based initially upon these standards and later in response to environmental or operational changes affecting the security of ePHI, including: o Risk analysis o Threat assessment o Operating system and network device security configuration o Workforce security o Access controls and authorization to PHI o Security awareness o Security incident response o Physical security o Transmission security 8 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 o Security model (i.e. data classification/ownership) o Security organizational structure o Security policies/procedures o Security architecture and design Business Associates 164.308 (b) (1) These administrative safeguards will also apply to Shared Support\u2019s business associate agreement contracts and other arrangements in which ePHI is handled on Shared Support\u2019s behalf; such agreements will be in a written contract. A contract between Shared Support and its business associates will require the business associate to implement safeguards that reasonably and appropriately protect the confidentiality, integrity and availability of the electronic protected health information that it creates, receives, maintains or transmits on Shared Support\u2019s behalf.  The contract will also require the business associate to report to Shared Support any security incident of which it becomes aware. 7. Physical Safeguards Facility Access Controls 164.310 (a) (1) Shared Support will limit physical access to its electronic information systems and the facility or facilities in which they are stored, while ensuring that properly authorized access is allowed. Shared Support will safeguard the facility and the computer equipment from unauthorized physical access, tampering and theft.  This will include: o Periodic assessment via a walk-through of the building perimeter, interior and any computer room to assess physical security controls and identify weaknesses such as unauthorized access through windows, doors, vents, roof or basement entry; o Physical access procedures during emergency mode operations; o Environmental controls such as air conditioning, smoke detection and appropriate fire suppression systems; and o Entrance/exit controls and a requirement that all visitors be escorted by an employee while in the building. Workstation Use 164.310 (b) Workstations and offices will be used by each department and position to perform the necessary functions and responsibilities of each user. Employees are not permitted to store ePHI on PDA\u2019s. Workstation Security 164.310 (c) In order to secure the workstations: o All users will be required to run virus protection checks on any new information downloaded from a diskette. o Workstations will be secured so that all workstations that access ePHI restrict access to authorized users. 9 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 o User name and password will be required to access any computer workstation or laptop. o All screens should face away from unauthorized users. o Password protected screen savers will be evoked after a 30-minute period of inactivity. Device and Media Controls 164.310 (d) (1) Shared Support will further manage ePHI by managing the receipt and removal of hardware and electronic media that contain this information, and the movement of these items within the building. These steps include: o Media will be sufficiently erased or overwritten before disposal or reuse. o Additional actions will be taken to destroy media (such as cutting up disks or drilling holes in hard drives, where appropriate). o Intact workstations may be sold or donated with sufficient erasure of ePHI and protected information. o An inventory will be made and records will be maintained of the movements of all hardware and electronic media and the persons responsible for that media. o ePHI must be encrypted for transmittal, using Web-based applications such as use of encryption, media or portable devices, and key and certificate management (including issuance, expiration and revocation). 8. Technical Safeguards Access Controls 164.312 (a) (i) A. Unique User Identification All Shared Support computer systems will have a unique user identification that is assigned by the individual. B. Emergency Access Procedure Shared Support does not need emergency access procedures. C. Automatic Logoff A password protected screensaver will be required on all computers and laptops after 30 minutes of inactivity; after an hour of inactivity, the system will automatically logoff the user.  A unique name and/or number will be used to identify, authorize and track user identity. Audit Controls 164.312 (b) Shared Support will implement hardware, software and procedural mechanisms that record and examine activity in information systems that contain or use ePHI, including auditing, logging and monitoring controls to allow it to examine system activity, both routinely and as a result of a possible security incident.  Auditing controls may be manual, automatic or a combination of both. Examples of audit controls include: user access and account activity; exception reports; dormant account reports; system resource monitoring; data integrity controls; and failed log-in reports. 10 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 Monitoring tools (third party, freeware or OS-provided) may be used to log activity and security violations against ePHI. Examples of security relevant events to monitor might include: users switching user ID\u2019s during an on-line session; attempts to guess passwords; attempts to use privileges that have not been authorized; modifications to production application software; modifications to systems software; changes to user privileges; and changes to logging subsystems including the review of logs as well as standards for log retention and management. Integrity 164.312 (c) (1) Shared Support will implement electronic means to corroborate that ePHI has not been altered or destroyed in an unauthorized manner. Examples include: error-correcting memory; magnetic disk storage with built-in error detection and correction; checksums; and encryption. Person or Entity Authentication 164.312 (d) Shared Support will ensure that a person or entity seeking access to ePHI is the one claimed, and that access should only be granted to those who require it for their jobs. Authentication is defined as a process utilized by a system to confirm the identity of a user by means of a user identification and password verification scheme.  Employees will be assigned a temporary user ID and password that must be changed upon first log-in.  These User Ids will be unique to the individual. The following password rules will be implemented: o Acceptable passwords must be at least 8 characters long and must include a varied set of characters o Passwords may not be shared o Passwords should not be written down o Passwords must be changed immediately if compromised o Passwords cannot be portions of employee name, spouse name, children or pets\u2019 names unless used in combination with other words or characters Transmission Security 164.312 (e) (1) Technical security measures will guard against unauthorized access to or modification of ePHI and modification of that information that is being transmitted over an electronic communications network. These measures will include files transmitted to/from business associates / external entities by FTP, email, dial-up, direct connection or web access. Measures depending on the level of risk identified during the risk assessment include switched networks, point-to-point connections, digital signatures, SSH, SSL or other forms of encryption. Areas of high transmission risk will be identified based on the type and format of the data being transmitted using electronic media, including wireless transmission, email, and network communications, with encryption for all of the above. Email encryption will be implemented for all communications containing ePHI if feasible after analysis of: 11 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 o Cost of the encryption software and support of end users, both providers and individuals, including setting up distribution schemes, supporting multiple operating systems and multiple email clients (Outlook, Notes). o For web-based secure email, the hassle of individual end users having to log into a different web site to check or send email. o The need for encryption licenses. o Local and international (if applicable) encryption laws. o Agreements and proper communication with business associates who may or may not be able to receive encrypted transmissions based upon budgeting/technology constraints. Policies and Procedures 164.316 (a) Shared Support will implement reasonable and appropriate policies and procedures to comply with the standards, implementation specifications or other requirements, will periodically review and may change our policies and procedures at any time, provided that the changes are documented and are implemented in accordance with the Final Rule. 9. Human Rights Team The Shared Support Human Rights Team is a team of people comprised of (potentially) employees, life sharers and people external of Shared Support such as family members or other volunteers.  Human Rights Team members have access to PHI for review purposes in determining the least restrictive intervention possible to safely support an individual and approving/disapproving requests to incorporate restrictive procedures into an individual\u2019s plan of support.  PHI includes, but is not limited to individual support plans, behavior support plans, behavior support components of individual plans, incident data, physical and behavioral records. Members will receive records containing PHI prior to meetings via a secure link and are directed to destroy any PHI via acceptable means, such as the shredding receptacles located at each office setting if the records were printed or, if records were maintained electronically, deleting those records from their computer at the conclusion of each meeting, including deleting from their recycle bin. Members must obey all privacy and confidentiality laws and may not share anything discussed during the HRT meeting either verbally or through the sharing of records.  Any records maintained, prior to the meeting, at the member\u2019s home or office must be maintained on a locked computer or in a locked cabinet to ensure that viewing by a non-member cannot occur. Members will receive training on and receive a copy of this Confidentiality Policy initially upon joining the Human Rights Team. Documentation 164.31 (b) (1) The Security Officer will document actions, activities and assessments and retain them for six (6) years from the date of creation or the date when last in effect, whichever is later. 12 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23 The Security Officer or other appropriate company staff will also retain the system/network configuration documentation, as well as any surrounding policies, procedures and training material for six (6) years from the date of creation or the date last in effect.  Such documentation will be made available to those persons responsible for implementing the procedures, including any network and systems administrators, Human Resources, Compliance and security personnel. An update and review of documentation will occur periodically as needed, but could also result from a security incident, new vulnerability, updated systems, changes in personnel, or organizational changes that affect the security of ePHI in the organization\u2019s possession. The Security Policy and Procedures is effective as of the Effective Date shown below. Signature: _____________ Name (print or type): Drue H. Robinson Title: COO/SSI Security Officer<\/p>\n<h3>RELATED POLICIES, PROCEDURES, FORMS, RESOURCES:<\/h3>\n<p>Grievance Process for People Supported by Shared Support, Inc. Fundamental Rights \u2013 annual consent packet Consent to Photograph and Authorization for Use or Disclosure \u2013 annual consent packet Notice of Privacy Practices \u2013 annual consent packet Privacy Protection Policy Business Associate Agreement Policy www.hhs.gov/hipaa Approved: 08/23/2019 Effective Date: 08/23/2019 Revised: 01/27/2022 Revised 04/14/2023 I have reviewed the above Confidentiality Policy and have had the opportunity to ask questions. I understand if I have additional questions, I will make outreach to the Shared Support CEO, COO or CPO for clarification. ____________________________________________________________________ Print Name Sign/Date 13 08/23/2019;Revised 03/08/21;01/27/22; 04/14/23<\/p>"}, {"slug": "exercise-and-understanding-of-rights-and-negotiation-of-choice-revised-04-23", "title": "Exercise and Understanding of Rights and Negotiation of Choice Revised 04.23", "revised": null, "pages": 4, "imageOnly": false, "trimmed": false, "html": "<h3>POLICY:<\/h3>\n<p>Exercise and Understanding of Individual Rights and Negotiation of Choices<\/p>\n<h3>SCOPE OF POLICY:<\/h3>\n<p>This policy applies to all Shared Support staff members, independent contractors, volunteers, individuals supported, persons designated by the individual to act on their behalf and court- appointed legal guardians.<\/p>\n<h3>STATEMENT OF POLICY:<\/h3>\n<p>Shared Support, Inc. is committed to ensuring that all individuals have knowledge and understanding of their individual rights.  Shared Support will continually offer the support and encouragement necessary for individuals to make choices and decisions regarding situations governing their own lives. Shared Support, Inc. fully supports individuals in exercising their rights, unless such exercise violates another person\u2019s rights or significantly jeopardizes the safety of the individual.  When situations arise between individuals or between individuals and staff members, Shared Support will assist the individuals impacted to negotiate choices and resolve differences.<\/p>\n<h3>IMPLEMENTATION OF POLICY:<\/h3>\n<p>EXERCISE AND UNDERSTANDING OF INDIVIDUAL RIGHTS Initially upon enrollment into services and annually thereafter, the individual, a person designated by the individual to assist with decision-making on behalf of the person and court- appointed legal guardians will be advised, in writing, of their individual rights.   Individuals, the person designated by the individual to act on their behalf and court-appointed legal guardians will be given a copy of the individual rights and a copy will be maintained in the individual\u2019s record. Shared Support will make any accommodations necessary, based upon the communication needs of the individual, to assure their understanding of their individual rights and to actively exercise those rights.  Accommodations include but are not limited to augmentative or alternative communication, interpreters, communication boards or books, symbol systems, and sign language No person will be reprimanded, punished or retaliated against for exercising their individual rights and Shared Support will continually support and encourage the person to actively engage in exercising their rights. 01/02/; Revised 02/24/20; Revised 04/04/23 A court\u2019s written order that restricts an individual\u2019s rights shall be followed. An individual who has a court-appointed legal guardian, or who has a court order restricting the individual\u2019s rights, shall be involved in decision-making in accordance with the court order. All individuals have the right to privacy of their person and belongings, including the right to lock their bedroom door.  This right is reviewed at the time of entry into services and annually thereafter.  If an individual chooses to lock their bedroom door, staff members will only be permitted to gain entry to the room with the individual\u2019s express permission (staff member will knock and ask for the door to be unlocked) or in the event of one or more of the following instances: 1. Evacuation of the home is mandatory due to fire, carbon monoxide or potential of either of the two; 2. Emergency personnel (fire/police/EMT) must gain access to the bedroom; 3. The individual is experiencing a medical or behavioral emergency that requires assistance; 4. The individual has a recurring or chronic medical or behavioral history and staff has a reasonable suspicion to believe that the individual requires assistance. Shared Support, Inc. direct care staff members and independent contractors will be trained on participant rights initially upon hire/contract and annually thereafter, as well as the reporting of incidents including rights violations. No person will be deprived of their individual rights and all allegations involving alleged rights violations will be entered into the PA Department of Human Services EIM system and investigated within the timeframes mandated. NEGOTIATION OF CHOICES The ability to negotiate is a valuable and essential life skill. Negotiation involves both empathy and compromise and individuals who learn to negotiate acquire and learn the importance of these abilities. Staff members who teach and mentor negotiation skills to individuals are enhancing their confidence, self-esteem and social relationship skills. It is inevitable that as people reside together, work together or socialize with one another, choices will need to be made and varying opinions, and conflicts, will ensue.   Shared Support, Inc. will assist individuals in negotiating choices when the choice will violate another person\u2019s rights. In doing so, Shared Support, Inc. staff members will provide the level of services necessary to enable the individual to meet their outcomes as outlined in the Support Plan. Services include assuring that assistance, support and guidance (prompting, instruction, modeling and reinforcement) will be provided to enable the individual to develop and maintain positive relationships with other individuals, staff and community members. Negotiating choice and resolving differences may be stressful, but also present a teachable moment for those involved.  Below are some strategies to help resolve conflict in the event an individual\u2019s choice violates the rights of another person: 01/02/; Revised 02/24/20; Revised 04/04/23 1. Find a common ground.  Any discussion involving choice and negotiation of differences should start with establishing the common ground for each party involved.  Find an intended goal that everyone can agree on. 2. Create a positive environment.  Honest and respectful communication is key to resolving differences of opinion and negotiation of choice.  Staff should model, in all communications, a high standard when negotiating in front of the individual for things such as purchases, repairs, etc.   Conversations that begin with positive language like \u201cI understand you are frustrated, and I am here to help you figure this out\u201d will be most effective. 3. Fully involve the individual in the negotiation process.  Ensure that you are asking what the individual thinks is an appropriate response to the problem and help the individual develop ways to move forward and be successful, while also learning a degree of flexibility.  Assuring that the individual has maximum control and ownership over the problem and choice reinforces that her concerns are being heard and that you are present and ready to help. 4. Learn to look for opportunities to encourage others.  Model kindness, respect and compassion, all of which foster more opportunities to negotiate and solve problems. IN CONCLUSION It is important for team members to remember that negotiation is a lifelong process and it is vital to take the time and make the effort to model and teach effective negotiation skills.  It is also imperative to be mindful that individuals learn skills in differing ways. Shared Support, Inc. continues its commitment to person directed supports through the process of monthly Circle Meetings and that person specific strategies will be developed, as needed, through team collaboration at the meetings. 01/02/; Revised 02/24/20; Revised 04/04/23 01/02/; Revised 02/24/20; Revised 04/04/23<\/p>"}, {"slug": "flushable-wipes-memo", "title": "Flushable Wipes Memo", "revised": null, "pages": 1, "imageOnly": false, "trimmed": false, "html": "<p>RE: Flushable Wipes Just a reminder to please not flush wipes down the toilet, even if they say they are \u201cflushable\u2019.  They have caused multiple issues with clogging at our homes in the past.  Toilet paper is designed to disintegrate in the pipes and sewage systems, but flushable wipes are not. (Companies can currently label wipes as \u201cflushable\u201d simply because they aren\u2019t restricted from doing so.)  However, these wipes are typically made with synthetic materials, plastics, or polyester, that won&#x27;t break down. So even if they flush down the toilet, they will eventually build up and end up clogging the pipes. This can cause considerable costs to remove these clogs. So, please make sure we are only flushing waste and toilet paper in the toilets at the homes- wipes, sanitary items, and all other materials should be disposed of in the trash. Thank you! 210 Bridge Av<\/p>"}, {"slug": "job-description-direct-support-staff", "title": "Job Description Direct Support Staff", "revised": "12.2019", "pages": 3, "imageOnly": false, "trimmed": false, "html": "<h3>DATE (ORIGINAL):<\/h3>\n<h3>DATE (REVISED):<\/h3>\n<p>POSITION TITLE:  Direct Support Staff EXEMPT/NON-EXEMPT: Hourly/Non-exempt DIRECT REPORT: Program Specialist MATRIX REPORT TO:  Program Director Qualifications for Employment: Eligible applicants must be at least 18 years of age with a valid driver\u2019s license and good driving record.  Applicants must be eligible to work pending the results of a criminal background check, child abuse clearance and completion of a physical with Mantoux (TB) screening. Responsibilities of the Position: Provision of Support 1. Provide and assure supervision, guidance and training in accordance with specific needs and goals as outlined in a person\u2019s Individual Support Plan (ISP). 2. Provide and assure continuity in care and comfort in the daily routine. 3. Assure the proper support is provided at all times (i.e. 24/7, awake night care), as outlined in the ISP. 4. Support the person with dressing, when needed, including choosing neat, clean, age appropriate, activity and weather appropriate attire. 5. Support the person to maintain good hygiene; assure necessary hygiene items are available such as a comb, brush, toothbrush and toothpaste, deodorant, shampoo/conditioner, soap, and feminine hygiene products. 6. Assure that goals and behavior support plans are implemented as written; follow prescribed treatment plans. 7. Document and report all required data to the Program Specialist. 8. Take appropriate steps in the resolution, recording and reporting of emergencies and/or incidents. 9. Report and file incident reports within 24 hours. 10. Document and sign on all required daily logs.  Ensure that all entries are clear and concise. 11. Communicate in staff log, as needed. 12. Take an active role in Circle meetings, giving your observations and opinions to other circle members. 13. Ensure individuals are meeting outcomes as discussed at the ISP and Circle meetings. 14. Ensure that individuals have the opportunity to enjoy leisure and community activities of their choosing. Assist them to integrate into their communities and to lead active, fulfilling lives. 1 | P a g e 15. Teach people the skills needed to increase their independence both at home and in the community. 16. Support relationships with family members and friends by encouraging telephone calls, visits and other types of contacts and sharing of information as appropriate. Physical Health Needs - Medication Management 1 Report all health/medical concerns immediately to your immediate supervisor (Program Specialist) or to the on-call supervisor when outside normal business hours, as well as to the appropriate person (doctor, dentist, therapist).  Record all information reported in the daily log. 2 Administer medications as prescribed (right route, right dose, right person, right medication and right time) and record all medications administered in the medication administration record (MAR). 3 Double check all medications for accuracy when picked up from or delivered by the pharmacy. 4 Observe any person that is self-medicating. 5 Observe, report and record any adverse effects of medication. 6 Observe, report and record any injuries to the person you are supporting: note the location, nature, extent and reason for injury when known. 7 Observe, report and record all seizure activity in the daily log and on seizure activity forms when provided. 8 Support the person in maintaining their physical health needs including all medical, dental and medical specialist appointments; adhere closely to follow up on medical recommendations including diet, appointments, therapy and medications. 9 Transport to and assist people with physician and therapy appointments.  Encourage the person to communicate for themselves at the appointments but be willing to communicate your observations if the person is unable to or refuses. 10 Review any special dietary needs and ensure that they are adhered to. Home Management (for staff providing support in 6400 homes) 1. Ensure the person\u2019s home and yard remain free of hazards to the person and to the community. Ensure a safe home environment for those you support. 2. Ensure the home remains clean and orderly and is maintained as per regulation; notify the Program Specialist or Compliance Specialist of any areas of non-compliance. 3. Follow all fire safety training requirements and sign the appropriate logs when necessary. 4. Provide support in meal planning, when necessary, and ensure meals are of sufficient quantity and quality. 5. Support the person in maintaining a proper diet including proper storage of food and preparation of balanced meals. 6. Provide transportation and support for grocery shopping. 7. Supervise, assist or complete laundry as the individual program requires. 8. Assist with household cleaning chores and seasonal maintenance. 9. Submit purchase orders or maintenance requests to the Program Specialist when needed. 10. Always obtain receipts for purchases made. 2 | P a g e Vehicle Management 1. Ensure company vehicles are maintained as per company policy. 2. Observe all vehicle policies; follow safety precautions and maintenance procedures. 3 Immediately report any concerns with the company vehicle\u2019s performance to the Program Specialist; follow through with instructions for repair. 4 Keep company vehicles clean and the gas tank at no less than half a tank at all times. 5 Report a vehicle accident immediately and submit an incident report. Employment Requirements 1. Report to work on time and for all scheduled shifts. 2. Use proper call off procedures. See Employee Handbook, Attendance and Absence Without Approved Leave. 3. Comply with reporting after hour call offs, tardiness or early departures from shift as outlined in the On-Call Emergency Procedure protocol. 4. Be willing to perform all responsibilities of the position and understand that some or all of the responsibilities can and may change based upon the person you support. 5. Clock into your shift using the iCare Manager app provided. Employees should clock in and out of iCM as close to the time of their scheduled shift as possible.  Failure to clock in/out properly could delay the processing of your paycheck. Contact your direct supervisor with questions concerning clocking in and out of iCM.  If after normal business hours and you cannot find and select the client you are to be working with when clocking in, contact the On-Call Supervisor. All other iCM related questions should be addressed with your immediate supervisor the next business day. 6. Clock any mileage expenses using the iCare Manager. Failure to use iCM for mileage reimbursement may result in no reimbursement for expenses. 7. Submit monthly expense reports at the end of each month, for non-mileage expenses accrued, prior to the 5th of the next month. 8. Report any shift changes to your supervisor.  Staff may not change shifts without prior approval from their supervisor. 9. Attend all required training, meetings and staff meetings. 10. Report any change in the status of your driving record or driving privilege immediately to the Program Specialist, per the Shared Support Fleet Safety Program. Direct Support Staff members are accountable for the progress of the person(s) supported in regard to outcome attainment.  Support plans and goals must be followed by staff. ______________________________ ______________________________ Employee Name (please print) Employee Signature/Date ______________________________ ______________________________ Trainer Name (please print) Trainer Signature/Date 3 | P a g e<\/p>"}, {"slug": "sexual-health-personal-relations-sexuality-policy", "title": "Sexual Health Personal Relations Sexuality Policy", "revised": "2019", "pages": 3, "imageOnly": false, "trimmed": false, "html": "<h3>POLICY:<\/h3>\n<p>Sexual Health, Personal Relationships and Sexuality<\/p>\n<h3>SCOPE OF POLICY:<\/h3>\n<p>This policy applies to all Shared Support, Inc. individuals, employees and independent contractors.<\/p>\n<h3>STATEMENT OF POLICY:<\/h3>\n<p>Shared Support, Inc. understands that people with intellectual and developmental disabilities (ID/DD) have sexual needs, feelings and identities and have the right to privacy and sexual expression. Sexuality includes not just sexual activity, but also the acknowledgement of feelings, displays of affection, ways of relating to self and others, self-esteem, gender identification and sexual orientation. Individuals with ID/DD have the need to love and to be loved and have the right to seek and develop consenting, intimate relationships with persons of their choice.  We support people in expressing their sexuality so long as they are not injuring themselves or others and are capable of providing informed consent.  Every individual has the right to be supported to develop safe and loving friendships and relationships, as well as to cohabitate with partners of choice and/or to marry. We understand that lack of awareness and information about sexuality leaves people with ID/DD vulnerable to sexual abuse. We are committed to ensuring that all individuals have the sufficient education and support to develop healthy sexuality and to protect them from abuse, exploitation, unwanted pregnancy and sexually transmitted disease.<\/p>\n<h3>IMPLEMENTATION OF POLICY:<\/h3>\n<p>INFORMATION AND EDUCATION Individuals Often people with ID/DD do not receive education on sexuality and acquire misinformation from friends and television.  Many people do not wish to broach the subject of sexuality with individuals, denying individuals with ID/DD the opportunity to develop responsible social and sexual skills and behaviors, the right to exercise choice and the right to have their basic needs fulfilled. Lack of education surrounding human sexuality also leaves individuals na\u00efve and vulnerable to sexual abuse or exploitation. 1 11/08/2018 When appropriate, the program team will provide ongoing education and information to an individual in a private setting, outside of team meeting settings, and at the level and pace that the person can best understand the information.  Topics of education and information sharing may include, but is not limited to: informed decision making; safe sexual practices; sexual orientation; sexual abuse; how to tell the difference between friends, acquaintances and strangers; boyfriend/girlfriend issues as they arise; the difference between physical affection and sex; understanding body language; awareness of others; assertion and the ability to say \u201cno\u201d at any time; stopping sexual contact when a partner says \u201cno\u201d; laws related to sexual activity; changes and awareness of their own body;  abstinence; sexual expression; recognizing and avoiding abuse; personal and sexual hygiene; preventing sexually transmitted disease; pregnancy and contraception; and marriage. Staff and Life Sharing Providers/Independent Contractors Staff and life sharers will receive initial and ongoing support and education surrounding the rights and needs of individuals with ID/DD to express their sexuality, develop loving and intimate relationships, and to freely express their gender identification and sexual orientation. Staff is instructed that, as situations surrounding sexuality arise for which they need direction, they are to seek the counsel of their direct supervisor. Staff and life sharers will allow individuals privacy in their bedrooms for intimate contact with partners, unless indicated otherwise in the person\u2019s Individual Support Plan/Behavior Support Plan.  People also have the right to privacy in their communications, including email, text and telephone calls, unless otherwise indicated in their Individual Support Plan/Behavior Support Plan. Staff and life sharers will respect that people have different sexual orientations and preferences and will accept that people with ID/DD may be heterosexual, lesbian, gay, bisexual, transgender, monogamous or not monogamous with partners. Staff members will not interfere with sexual expression, as long as the sexual act is legal and involves consenting adults, and at no time are staff members and life sharers to impose their own personal value systems and beliefs upon individuals Shared Support, Inc. Supports the Pennsylvania Department of Human Services, Office of Development Programs Everyday Lives Values as They Apply to Sexual Health, Personal Relationships and Sexuality. 1. Individuals with disabilities are sexual human beings with their own cultural, religious/faith, ethnic and family values. 2. Individuals with disabilities have the right to enjoy their personal relationships and sexuality in a safe, consensual and legal manner, while respecting the rights of others. 3. Individuals with disabilities have the basic rights as individuals without disabilities to self-identify their gender, sexual orientation and sexual preferences. 4. Individuals with disabilities have the right to accessible and appropriate education, information and resources that address their individual personal relationships, sexual health and sexuality needs. 5. Individuals with disabilities have the right to privacy when accessing supports and have the right to have information about their personal relationships remain private unless they 2 11/08/2018 consent to a disclosure.  Privacy covers all forms of communication.  Information regarding an individual\u2019s personal relationships, sexual health and sexuality should be considered private and must be treated with respect and dignity. 6. Individuals with disabilities have the right to enjoy relationships and to express their sexuality in a safe manner. 7. Individuals with disabilities have the right to have their sexual health and personal relationships supported by knowledgeable provider agency staff and a knowledgeable Individual Plan team.<\/p>\n<h3>RELATED POLICIES, PROCEDURES, FORMS, RESOURCES:<\/h3>\n<p>Pa DHS/ODP Bulletin 00-18-01. Guidelines Concerning Sexual Health, Personal Relationships, and Sexuality. Issue Date April 13, 2018. 3 11/08/2018<\/p>"}, {"slug": "site-checklist", "title": "Site Checklist", "revised": "9-2025", "pages": 5, "imageOnly": false, "trimmed": false, "html": "<p>Name: Date: Address: Codes: Site Check \u2013exterior Grounds well maintained- no trash, cig. butts in yard, lawn mowed, weeds pulled etc. / and free from unsafe conditions Garbage cans outside have lids-&amp; all trash is in cans/not sitting out Exterior surfaces in good repair (check around house-walkways, siding, windows, decks, etc.) Is exterior dryer vent clear? Walkways clear- no snow/weeds/ tripping hazards Porches w/ 18\u201d or more of a drop must have a railing Handrails on stairs w/ 3 or more steps? *no locks on deck gates Porch railings and handrails in good repair? (sturdy and free from rust/chipping paint) Do steps have a nonskid surface? (if outside steps will be slippery when wet, must apply a nonskid surface) (this doesn\u2019t apply to ramps, but is recommended) Exterior lights operable/ in good repair-(and clean..free of cobwebs, dead insects), etc\u2026 All egresses unobstructed Paint on wood trim around windows and doors in good repair?  (not chipping/cracking) Exterior doors have operable locks / and all doors are locked (keys with keyed deadbolts?) Door alarms operable/on proper setting and in use as per the ISP (if applicable per individual) Do all exterior &amp; interior doors/ knobs open freely- no sticking Doors and door moldings in good condition/ clean, not a lot of scratches, marks or dirty fingerprints, etc\u2026 Are in ground swimming pools fenced w/ gate that is locked when not in use? Are above ground pools under 4ft inaccessible to individuals when not in use? Site Check \u2013interior Site Check-interior Site Check-interior All inside surfaces in good repair (floors, walls, ceilings, etc.) (*Make sure no water stains on ceilings, damage to walls, etc.) All interior lights operable Stairways, halls, doorways, passageways and exits must be unobstructed Handrails on all interior steps (including basement and attic)? Are handrails secure/not wobbly? Have tread strips or carpet on interior steps? Are all cords tucked away so not tripping hazards Air conditioners installed/in use in homes without central air if over 85 degrees? House clean? floors, baseboards, counters, furniture free from dirt, No bugs? No visible ant/mouse dust, &amp; stains-carpets swept, traps? bathrooms clean and sanitary- walls and light switch plates free of dirt, scuffs and fingerprints- no cobwebs on walls, ceilings, in corners, etc. Rubber backing/anti-slip backing on area rugs? Is the house free of foul odors? New emergency # on all phones (all #s legible/not worn away?) Smoke detectors operable- 1 per floor- Take pics of backs of detectors &amp; 1 w/in 15 ft. of each bedroom, including staff bedrooms (6400 homes must be interconnected if more than 2 stories) Carbon Monoxide detectors in homes with gas/oil/propane heat. (must be near individual\u2019s bedroom and all heat sources) Fire extinguishers- 1 per floor- in the green (6400 need tagged) Fireplaces have safety guards? Screens on windows (only if/ when window open) Screens in good repair?-no holes Coverings on windows (bed and bathrooms not sheer!) Is the refrigerator clean, and all Fruit/veggies? Ample food? food properly wrapped/stored? Stored properly in cabinets as **make sure no expired well? milk/food in fridge Are leftovers in fridge and freezer labeled? *6400 homes All appliances are operable and in good condition Inside garbage cans over 18\u201d need lids in 6400 homes (all homes must have one on kitchen trash cans over 18\u201d) Must have soap and towels at all sinks (6400 must be paper towels) Evacuation plan hung inside Meeting place/location? kitchen cabinet door Compliance hotline # hung inside kitchen cabinet door at house Are sharps locked (if necessary) Are poisons locked (if necessary) (*if poisons need locked, must lock up ice melt in winter too) Are poisons (cleaners/paint, etc.) stored separately from food &amp; meds? Are all chemicals stored in original containers? If not, are containers properly labeled? First aid kit-must contain scissors/tweezers/ gauze/ med tape/ antiseptic/ bandaids/manual (6400 must have thermometer) *If the person\u2019s poisons and/or sharps need locked, is the whole first aid kit kept together and locked? Is the lint trap in dryer clean? Disaster kit at house (*food bars and water w/ disaster kit?) Must have ventilation in all bathrooms (either a fan or window) Are vents in bathroom fans clean H20 temp. &lt; 120 (6400=always 6500=if not self-regulating) *max temp 125 for self-regulating* Bathmat in all tubs and showers in 6400 homes Laminated water regulating memo in shower (for all 6400 homes/6500 if doesn\u2019t self-reg.) Toilet paper on roll? Shower curtain rod free of rust? Shower curtain and liner clean? Bedroom and bath must have \u221a window coverings (not sheer) Must be at least 1 window in Individual\u2019s bedroom. Clean laundry must be stored in an area separate from soiled laundry Individual\u2019s bedroom must include- mirror/closet/dresser/ bed/ sheets/pillow/season appropriate blanket/comforter *make sure dressers are in good shape- not tons of scratches/not missing any knobs or handles Is there a bedroom door lock? If so, what type? Is there a spare key compartment outside of entrance to bedroom? Bed shaker operable (if applicable) Check for bed bugs. (6400-indl \u221a and staff beds, 6500-indl bed only) Are all combustibles in the home stored safely (check especially in basements and garages) Designated smokers spot has metal ashtray and non-flammable furniture? Are firearms in a locked cabinet or container? (For 6500 homes with guns; No guns allowed for 6400) Is ammo kept in a locked cabinet or container that is separate from the firearms? Any other safety concerns noted at this time? Incident management memo at house? Are ALL records/books locked up? (including chore lists, attendance records &amp; CP notes) (for 6400 homes) Is there a chore list at the house? Is it being completed/signed off on each shift? (for 6400 homes) Medications locked? (including presc. toothpaste/mouthwash) Controlled meds double locked Meds in refrigerator must be locked as well if not self med\u2019g All meds in original containers and have a legible label No meds expired-check prescription, OTC, and meds in first aid kit No DC\u2019d meds still in med box 6500 meds of individuals locked and kept separate from FLP? FLP meds locked? Med Check: Do Meds and their instructions match from Med list to MAR to pharmacy labels and docudose pill packs?<\/p>"}, {"slug": "smoking-vaping-policy", "title": "Smoking-Vaping Policy", "revised": "6.23.2023", "pages": 2, "imageOnly": false, "trimmed": false, "html": "<h3>POLICY:<\/h3>\n<p>Smoking and Vaping in 6400 and 6500 licensed homes<\/p>\n<h3>SCOPE OF POLICY:<\/h3>\n<p>This policy applies to all persons supported, their family/guardians, staff members, visitors, independent contractors and stakeholders of Shared Support, Inc.<\/p>\n<h3>STATEMENT OF POLICY:<\/h3>\n<p>For the safety of all persons receiving services with Shared Support, Inc., their family/guardian, visitors, staff members and independent contractors, Shared Support, Inc. established safe smoking and vaping procedures in licensed sites.<\/p>\n<h3>IMPLEMENTATION OF POLICY:<\/h3>\n<li>All staff and lifesharing providers must smoke and/or vape in the designated<\/li>\n<p>smoking area outside the home. The designated smoking/vaping area will be noted on the home\u2019s Safe Smoking Protocol document.  The designated smoking/vaping area will provide furniture of solid wood construction, hard plastic, resin or metal.<\/p>\n<li>If individuals receiving support services wish to smoke or vape inside their home,<\/li>\n<p>the Circle Team must meet to establish a safe designated smoking/vaping area that is free of all combustible materials, has outside ventilation and maintains fireproof furniture and a fire extinguisher.  All individuals are encouraged to smoke and vape outside of their home. Note that some landlords/leases prohibit smoking and vaping within the home.<\/p>\n<li>Staff must use the ashtrays provided by Shared Support, Inc. for extinguishing<\/li>\n<p>and disposal of cigarette butts.<\/p>\n<li>Ashtrays and smoking receptacles should be cleaned regularly.<\/li>\n<li>Smoking/vaping is not permitted in company vehicles.<\/li>\n<li>Smoking/vaping is not permitted in personal vehicles while transporting any<\/li>\n<p>supported individual.<\/p>\n<li>Community home staff must store lighters, matches, vapes in the locked staff<\/li>\n<p>room while working at the home. While on community outings, staff is to maintain lighters/matches/vapes on their person and be accountable for their personal possessions. In the event of a fire at an outside, designated smoking area: If a fire should occur at the designated smoking area, staff is directed to assist the individual to an area away from the fire and to use the closest extinguisher to extinguish the fire. If the fire is too large to extinguish, staff is to contact 911.  The Shared Support 7/19/21; 4/11/23; 6/29/23 Program Specialist, or On-Call Personnel if outside normal business hours, must be contacted regardless of the size of the fire. 7/19/21; 4/11/23; 6/29/23<\/p>"}, {"slug": "the-safe-and-appropriate-use-of-behavior-supports", "title": "The Safe and Appropriate Use of Behavior Supports", "revised": null, "pages": 3, "imageOnly": false, "trimmed": false, "html": "<h3>The Safe and Appropriate Use of Behavior Supports<\/h3>\n<p>Individuals living with a developmental disability are more vulnerable throughout their lives and experience alarmingly high rates of trauma. Because of their potentially limited knowledge, social skills and verbal skills, individuals are less likely to tell someone about a trauma and their capacity to heal is diminished.  Many of the individuals supported by Shared Support, Inc. have experienced varying degrees of trauma throughout their lives, making it very difficult for them to trust other people and to build positive, long-term relationships.  Shared Support expects the following characteristics to be consistently demonstrated by all staff while working with individuals:<\/p>\n<li>Patience<\/li>\n<li>Compassion<\/li>\n<li>Kindness<\/li>\n<li>Honesty<\/li>\n<li>Respect<\/li>\n<li>Forgiveness<\/li>\n<li>Flexibility<\/li>\n<p>Understanding Negative Behavior.  All negative behavior exhibited by an individual is non- verbal communication regarding an unmet need.  A behavior is a means of getting to something, someone or someplace OR it is a way of getting away from something, someone or someplace (or both).  It is the team\u2019s role to work through negative behaviors, building trust with the individual, listening and documenting as necessary, in order to determine the unmet need and helping the person get the need met. Sometimes that process can occur quickly, while for other individuals it may take a great amount of time.   As an individual\u2019s need continues to be unmet, the person will increase the frequency, duration and intensity of the negative behavior(s) displayed until such as time as the need is met. As negative behavior occurs, it is important to continually assess the individual to determine why he or she may be acting out.  It is also important to assess the environment in which you are working to determine if anything surrounding the individual could be used to harm themself or another person (i.e. a baseball bat in the garage easily accessible to the person when in crisis). 1 11/26/2019 Ch. 6100.143. Annual Training Preventing a crisis situation is our primary focus.  Listen and partner with the individual in order to encourage positive behaviors, promote the person to be active and engaged in activities of their choosing and continually assess and identify any stimulus triggers (things, noise, people, situations, etc. that may upset the person) so that you can remove or reduce that stimulus and eliminate a potential crisis. De-escalation of a crisis situation may be necessary if you are unable to identify the stimulus trigger and a person begins acting out.   Staff responsibility is to protect the individual to the best of their ability and to use the least amount of interaction necessary to secure the individual\u2019s safety.   Engage with the person calmly, actively listen to the person to identify the unmet need, offer reassurance and encouragement, ignore challenging questions posed by the individual and avoid overreacting to the individual\u2019s behavior. Recognize your own non-verbal communication by:<\/p>\n<li>keeping an open and relaxed body posture (don\u2019t cross your arms);<\/li>\n<li>maintaining a safe distance from the person, allowing the individual their personal<\/li>\n<p>space;<\/p>\n<li>balancing your height, if a person is shorter than you or in a wheelchair, by sitting down<\/li>\n<p>so that you are on their level;<\/p>\n<li>keeping your facial expression relaxed, interested and non-judgmental;<\/li>\n<li>maintaining eye contact to show that you are listening and alert;<\/li>\n<li>allowing the person to speak and empathizing with them;<\/li>\n<li>accepting and respecting the feelings that they are communicating;<\/li>\n<li>allowing silence for reflection;<\/li>\n<li>allowing adequate time for the person to make decisions;<\/li>\n<li>not touching the person without first asking.<\/li>\n<p>Recognize your verbal communication by:<\/p>\n<li>being continually aware of the tone and volume of your voice, as well as your attitude;<\/li>\n<li>using short sentences \u2013 do not be wordy when speaking with someone in crisis;<\/li>\n<li>reflecting what the person is telling you by rephrasing and offering that thought back to<\/li>\n<p>the person to ensure you understand;<\/p>\n<li>using People First language and always speaking with the individual in a respectful and<\/li>\n<p>courteous manner. 2 Remember that a crisis is a crisis because the individual knows no response to deal with the situation they are facing. Following a crisis event, debrief with the individual and other team members, such as fellow DSP staff, the Program Specialist and/or other members of the program team.  Never blame or punish the individual or make the person feel inadequate because of their display of emotion. Remember, the role of the DSP is to listen, document findings and determine the unmet need in order to avert future crisis situations. A person\u2019s behavior only needs to be \u201cchanged\u201d when it represents a danger to the person or to others or when the individual wants to change the behavior, as often a behavior may be an obstacle to the individual participating in community activities of their choice.   It is not the role of the DSP or Shared Support to \u201ccontrol\u201d individuals \u2013 our role it to support and encourage the individual to make healthy and safe choices that enable the individual to lead the life of their choosing. Stress, anger and aggression must be understood in order to aptly support an individual and minimize crisis events.  Anger and aggression, for instance, always stem from feelings including fear, embarrassment, shame, frustration, helplessness and/or loss. When under stress, our pulse and breathing quicken, while our ability to communicate effectively decreases, as do our listening and reasoning skills.  As support staff, understanding these facts enables us to effectively partner with the individuals we support because, as we listen compassionately and build a trusting relationship with the individual, we lessen their feelings of hopelessness and distrust. The individuals we support must feel safe in order to lessen negative behaviors and enhance their overall quality of life. Behavior Support Plan: If a person has a formal behavior support plan, the best way you can interact with the person and promote their success is to adhere to the behavior support plan and offer feedback to the individual and their team on what is and what is not working for the individual.   The behavior support plan is in place to assist the individual to identify their strengths and build upon those to meet their needs in the least structured manner possible. 3 11/26/2019 Ch. 6100.143. Annual Training<\/p>"}, {"slug": "trauma-informed-support", "title": "Trauma Informed Support", "revised": null, "pages": 3, "imageOnly": false, "trimmed": false, "html": "<p>Trauma The longer we live, the more inevitable it is that we will experience trauma.  Trauma is the response to a deeply distressing or disturbing event that overwhelms an individual\u2019s ability to cope, causes feelings of helplessness, diminishes their sense of self and their ability to feel the full range of emotions and experiences.   Trauma does not discriminate and is pervasive worldwide. There are no objective criteria to evaluate which events in a person\u2019s life will cause post-trauma symptoms, but circumstances typically involve the loss of control, betrayal, abuse of power, helplessness, pain, confusion and /or loss. Trauma for Individuals with Intellectual and Developmental Disorders Over 70% of people with IDD report being victims of abuse 90% of them said it occurred on multiple occasions Only 37% reported the abuse to the authorities People with IDD are 7 times more likely to be sexually abused than those without disabilities. People with IDD are 2.5 times more likely to be victims of a violent crime and 40% more likely to have the perpetrators be someone they know. (Reference \u2013 Center on Victimization &amp; Safety) Types of Trauma Small \u201ct\u201d trauma - circumstances where one\u2019s bodily safety or life is not threatened, but cause trauma nonetheless.  Examples of this for people we support may include family violence, social exclusion, exclusion from the family, neighborhood violence, frequent changes in living arrangements / lack of stability. Large \u201cT\u201d trauma \u2013 extraordinary experiences that bring about severe distress and helplessness.  They may be one-time events, or they may be prolonged stressors. Examples of this for people we support may be sexual abuse, physical abuse, neglect, negative events, grief and loss. Large \u201cT\u201d traumas are more difficult or even impossible to overlook, yet they are often actively avoided. As an example, people may try to avoid triggers such as personal reminders, certain locations or situations.  They also may resist confronting memories of the event. Trauma and the Brain When something happens in the present that reminds the person of the negative/traumatic past, the person\u2019s brain automatically goes into a \u201cfight or flight\u201d mode, perceiving the person is in danger even when they are not in any danger whatsoever.  This is a primitive response that the person is entirely unaware of. 1. Trauma -----------------------2. Sparks emotion -------------------3. Person exhibits behaviors When we only address the exhibited behavior, we miss the true root cause of the person\u2019s difficulties. 1 Recognizing a Trauma Response vs a Behavior Response Trauma Behavior Triggered in an irrational manner Has a purpose and intent Overreaction to a small event Deliberate \u2013 acting on environment to get a response Very emotion-based Intent is important in identifying the response Does not serve the person well Goal is to get something they want, can move them forward Does not move them forward You can typically identify the antecedent (trigger) Example: A person repeatedly reacts irrationally when visiting a particular family member. Example: A person reacts strongly when informed their plans to dine out have been cancelled due to bad weather/unsafe driving conditions. Common Responses and Symptoms of Trauma Although response to traumatic events vary significantly among individuals, below is a list of basic, common symptoms: Common emotional signs include: Sadness Anger Denial Fear Shame These emotions may lead to: Nightmares Insomnia Difficulty with relationships Emotional outbursts Common physical symptoms include: Nausea Dizziness Altered sleep patterns Changes in appetite 2 Headaches Gastrointestinal problems Generalized pain disorders Common psychological disorders/symptoms include: Post-Traumatic Stress Disorder (PTSD) Depression Anxiety Dissociative disorders Substance abuse problems What People Need the Most \u2013 What You Can Do While there is no cure for trauma nor any quick fixes for the suffering and symptoms associated with it, there is hope and a wide range of effective trauma focused therapies, such as CBT (Cognitive Behavioral therapy), EMDR therapy (Eye Movement Desensitization therapy), Somatic Experiencing and Sensorimotor Psychotherapy.  The individuals you support may also be prescribed medications such as antidepressants and anti-anxiety medications, both of which can make symptoms less intense and more manageable. Key ingredients that you as a direct care staff member can assist with include helping the individual to feel SAFE, EMPOWERED AND CONNECTED.  Individuals who have experienced trauma need staff who can help provide them with a sense of safety in their homes, personal spaces and while in the community.  Staff should exhibit understanding, kindness and empathy toward the individual, especially when they experience feelings of panic and their brain goes into that \u201cfight or flight\u201d mode described above, at which times individuals who have experienced trauma will most likely exhibit behaviors. A positive identify is important for all of us, including the people we support, and a continued focus upon what the person does well, what they are proud of, establishing friendships and assisting the individual to find avenues where they feel they make a difference (volunteering/employment) are all important steps in healing trauma. Staff members will be educated on the individual\u2019s past, to the extent that Shared Support is aware, including any knowledge of past trauma and present-day signs and symptoms, as well as the support plan to address those signs and symptoms.  In that the brain/body \u201cstores\u201d trauma, other avenues that the interdisciplinary team may explore to help an individual be present in their body may include yoga, acupuncture, dance, massage, etc. 3<\/p>"}, {"slug": "pbis-mandt", "title": "PBIS MANDT", "revised": null, "pages": 29, "imageOnly": true, "trimmed": false, "html": ""}, {"slug": "workers-comp", "title": "Workers Comp", "revised": null, "pages": 11, "imageOnly": false, "trimmed": false, "html": "<p>WORKER\u2019S COMPENSATION Eagle Trust Management Shared Support, Inc. Provided by:<\/p>\n<h3>The Eagle<\/h3>\n<h3>Workers<\/h3>\n<h2>WORKER\u2019S COMPENSATION BENEFITS<\/h2>\n<h3>Compensatio<\/h3>\n<h3>n Trust<\/h3>\n<h2>EAGLE TRUST<\/h2>\n<p>Serviced by:<\/p>\n<h3>Eagle Trust Management<\/h3>\n<p>What is Worker\u2019s Compensation? What happens now that I have reported the injury? Worker\u2019s Compensation is a medical care and disability income Visit a doctor from the list of benefit for those workers who are injured on-the-job. Your employer<\/p>\n<h2>MANAGEMENT<\/h2>\n<p>qualified treating physicians self-insures Workers\u2019 Compensation via the Eagle Workers that Compensation Trust. This means that instead of purchasing a has been provided (your Workers Compensation policy from an Insurer, your employer pays posted medical panel) for lost wages &amp; medical directly. during the first 90 days of treatment.<\/p>\n<h2>IS OUR<\/h2>\n<p>Is Worker\u2019s Compensation the same as Health Insurance? No. Worker\u2019s Compensation covers those injuries or illnesses As necessary, cooperate in which are related to your employment. Health insurance providing information to us, so (such as Blue Cross; Aetna etc.) covers you when you are sick that the claim can be or injured outside the scope of employment. processed as smoothly as<\/p>\n<h2>WORKER\u2019S<\/h2>\n<p>possible. What is covered by Worker\u2019s Compensation? The Pennsylvania worker\u2019s compensation benefits include but Discuss with us, or your employer, are not limited to the foll surance that provides benefits to employees for injuries or illnesses sustained in the course and scope of employment 4<\/p>\n<h2>DEFINITIONS<\/h2>\n<p>Occupational Injuries: Includes accidents and injuries due to repetitive trauma Accident: Fracture/Amputation/Puncture/Automobile Collision Injury: Carpal Tunnel Syndrome or Low Back Strain Occupational Disease/Illness: Exposure and contraction of an illness (must be compensable under governing jurisdictions, such as asbestos) Examples of Questionable Illness/Injury: Heart attacks/mental stress<\/p>\n<h2>WORKER\u2019S COMP<\/h2>\n<h2>BENEFITS<\/h2>\n<li>Medical Expense Coverage<\/li>\n<p>Includes Prescriptions, X-rays, Office Visits, Surgery and more Must see a Panel Provider for first 90 days May seek second opinion if surgery is recommended After 90 days, may seek care from non-panel provider, but must submit this in writing within 5 days to Human Resources<\/p>\n<li>Wage Loss Benefits<\/li>\n<p>7- and 14-day retroactive waiting period applies\\ 66.2/3% of your pay if deemed totally disabled<\/p>\n<li>Survivor Benefits/Funeral Expenses<\/li>\n<p>6<\/p>\n<h2>SCOPE OF EMPLOYMENT<\/h2>\n<h2>EXCEPTIONS<\/h2>\n<h3>INJURIES CONSIDERED WITHIN<\/h3>\n<h3>INJURIES OUTSIDE THE SCOPE<\/h3>\n<h3>THE SCOPE OF EMPLOYMENT<\/h3>\n<h3>OF EMPLOYMENT<\/h3>\n<p>If an injury is sustained while furthering If the employee engaged in unauthorized the employer\u2019s business horseplay (anything outside the scope of employment) This includes injuries sustained while running business-related errands Employee running personal errands This includes if the employer makes a Employee is proved to be intoxicated and request of the employee to expand the as such this resulted in their injury scope of their employment (i.e., special Employee was injured during the request or special assignment) commission of a crime (for example: assaults from a third-party that injured the employee for personal reasons not related to employment) During non-paid company events or breaks during employment Burden of proof of injury outside the scope of employment is on the employer 7<\/p>\n<h2>SUBMITTING A CLAIM<\/h2>\n<li>EMPLOYEE RESPONSIBILITIES<\/li>\n<p>If an emergency, seek treatment at nearest Emergency Department Must report to supervisor or on-call immediately, but no later than 24 hours Must complete injury report and sign the Acknowledgement in the Injury Packet Treat with a Panel Provider for the first 90 days<\/p>\n<li>EMPLOYER RESPONSIBLITIES<\/li>\n<p>To have Worker\u2019s Compensation information posted and easily accessible to all employees Posted at main office, available in Paycom at New Hire and at Time of Injury, Upon Request and Paper Copies in all Homes Human Resources will submit your claim to Eagle Trust Management upon receipt of information You will be provided with a claim number to give to your Medical team We will keep your information as confidential as possible 8<\/p>\n<h2>LIFE COURSE OF A CLAIM<\/h2>\n<p>Complete Injury Step 1 First- Aid Emergency Care Report ASAP Packet Treat with Panel Share discharge HR reports to Claim Number is Step 2 Provider (if paperwork with ETM generated needed) HR or ETM Release to Full Step 3 Return-to-work Restrictions Claim Closed Duty 9<\/p>\n<h3>RESTRICTIONS AND RETURN-TO-<\/h3>\n<h3>WORK<\/h3>\n<li>Most Worker\u2019s Compensation Claims do not require time away<\/li>\n<p>from work<\/p>\n<li>If you return to work with restrictions, we may temporarily place<\/li>\n<p>you on a different schedule and/or with different job responsibilities/duties to accommodate those restrictions<\/p>\n<li>You will be reinstated to your original duties once you are cleared<\/li>\n<p>to return to work without restrictions 10<\/p>\n<h2>WHAT TO REPORT<\/h2>\n<p>We want to know any time you sustain injury regardless of you need for medical treatment There is no injury too small to report If you report the injury immediately, we will have a claim already initiated in the event you need to seek treatment in the future If you never need treatment for the reported minor injury, that\u2019s okay! This helps us to monitor safety trends in our homes and communities so we can keep all staff and individuals safe When it doubt, report it out!<\/p>\n<h2>THANK YOU<\/h2>\n<p>Please Direct Any Questions to Maxine Williams MSW, LSW Human Resources Generalist mwilliams@sharedsupport.org 570-286-4982 Ext. 255<\/p>"}], "printables": [{"title": "DRC Policies Packet", "path": "1 - DRC Policies/DRC Policies Packet.pdf", "dir": "1 - DRC Policies", "review": false}, {"title": "Easy Print DRC", "path": "1 - DRC Policies/Easy Print DRC.pdf", "dir": "1 - DRC Policies", "review": false}], "links": []}, {"slug": "incident-management-abuse", "title": "Incident Management & Abuse", "color": "#9A8C3C", "delivery": "day1", "documents": [{"slug": "incident-management-policy-current", "title": "Incident Management Policy CURRENT", "revised": "2025", "pages": 42, "imageOnly": false, "trimmed": true, "html": "<p>POLICY: Incident Management SCOPE OF POLICY: This policy applies to all staff members, independent contractors and other Shared Support, Inc. stakeholders. STATEMENT OF POLICY: To provide a standard for procedures which serve to prevent, manage and report all incidents as defined by the Pennsylvania Office of Developmental Programs Bulletin #00-21-92 issued 03/01/2021, effective 07/01/2021.  The primary goal of this policy is to ensure that responses to incidents ensure the health and safety of the individual/individuals involved using person centered practices.  In addition, the continuous analysis and review of incidents will seek to enhance risk management processes and to formulate actions to prevent the recurrence of incidents. IMPLEMENTATION OF POLICY: I.  Incident Reporting/Investigations In addition to incidents being reported verbally, alleged and suspected incidents will also be reported. These include potential incidents suspected through observation of physical, behavioral or emotional indicators of abuse, neglect or another incident type. Additionally, trend analysis that reveals a pattern of injury, illness or other incidents that could be indicators of abuse, neglect or another incident type will be reported. Upon learning of an incident or alleged or suspected incident, Shared Support will take immediate action to protect the health, safety, rights and well-being of all individuals.  Our actions may include dialing 911, removing or reducing an imminent risk to an individual and arranging for emergency or timely medical care. If an alleged target is identified and is associated with Shared Support as an employee, staff, volunteer, contractor, consultant or intern, the target will be separated from the individual, and all other individuals, pending the outcome of the investigation, as well as the completion of any corrective action steps specific to the target. If the alleged target is another individual receiving services and presents a reasonable expectation of ongoing risk to the victim, Shared Support will collaborate with the SCO and county ID/AE to identify strategies to protect the health, safety and ongoing rights of the victim. A. The following are categories of incidents to be reported within 24 hours after the occurrence of the incident as are indicated in the Pennsylvania Office of Developmental Programs Bulletin #00-21-02 for all waiver participants being supported by Shared Support, Inc at the time of incident occurrence. 1. ABUSE. A deliberate or careless act by a person, including another individual receiving services, which may result in mental or physical harm. i. Misapplication/Unauthorized Use of Restraint (injury). The use of a restraint that does not follow ODP\u2019s regulations, the misapplication of an approved restraint technique or the use of a restraint that results in an injury requiring treatment beyond first aid.  Examples include: Prone position restraint. Any restraint that inhibits digestion or respiration, inflicts pain, causes embarrassment or humiliation, causes hyperextension of joints, applies pressure on the chest or joints or allows for a free fall to the floor. Any physical restraint that is used more than 30 cumulative minutes within a two-hour period. 1 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 Chemical and mechanical restraints. ii. Misapplication/Unauthorized Use of Restraint (no injury).  The use of a restraint that does not follow ODPs regulatory requirements or the misapplication of an approved restraint technique. Examples of this are noted in i. above. iii. Physical abuse. An act which causes or may cause physical injury to an individual, such as striking or hitting. Physical injuries may or may not be present with physical abuse.  Allegations of physical acts without obvious signs of injury must be reported. Monitoring or body checks may be necessary to look for signs of injury after initial discovery of the incident. In addition, injuries attributed to a staff person or another individual receiving services that require treatment beyond first aid or an inpatient admission to a hospital are to be reported as abuse. If an incident involved an injury, common examples of situations that may be present with physical abuse include, but are not limited to: A patterned bruise, no matter its size, that is in the shape of an identifiable object such as a belt buckle, shoe, hanger, fingermark, etc. Unexplained serious injuries or multiple bruises, cuts, abrasions. A spiral fracture. Dislocated joints. Bilateral bruising, which is bruising on both sides of the body (e.g., the top of both shoulders, both sides of the face or inside of both thighs). Bruising to an area of the body which does not typically or easily bruise (e.g., midline stomach, breasts, genitals, inner thighs or middle of the back). Injuries that are not consistent with what is reported to have happened. Injuries explained as caused by self-injury to parts of the body the individual has not previously injured or cannot access. iv. Psychological abuse. An act which causes or may cause mental or emotional anguish by threat, intimidation, humiliation, isolation or other verbal or nonverbal conduct to diminish another. Examples include, but are not limited to: Bullying, rejecting, degrading and terrorizing acts. Disregard for privacy during personal care. Paid caregiver ignoring an individual, including, but not limited to: o Active ignoring (that is not part of the approved plan) such as ignoring a call or request for help/assistance. o Passive acts, such as non-essential use of a cellphone (or another electronic device), watching TV, etc. Threats of isolation. Yelling, name calling, blaming, shaming. Mimicking or mocking an individual\u2019s voice, speech, behaviors, etc. Statements that are intended to humiliate or infantilize, including insults, threats of abandonment or institutionalization and other controlling, dominant or jealous behavior. The act of taking, transmitting or displaying an electronic image (in any medium including social media, personal computers, cell phones, etc.) of an individual that is intended to shame, degrade, humiliate or otherwise harm the personal dignity of the individual. When an individual witnesses an incident for which they were not the intended victim, but it causes or has caused mental or emotional anguish. 2 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 v. Seclusion. The involuntary confinement of an individual in an area from which the individual is prevented from leaving.  This includes verbal instruction or any explicit or implicit intimidation that indicates to an individual that he or she may not leave a room, regardless of whether the individual has the ability to physically remove himself or herself from the situation.  Examples include, but are not limited to, the following prohibited acts: Placing an individual in a locked room. A locked room includes a room with any type of engaged locking device such as a key lock, spring lock, bolt lock, foot pressure lock, device or object, or a person physically holding the door shut. Placing an individual in a room from which they are unable to exit independently due to the general accessibility of the room (i.e., wheelchair ramps, transitions, etc.), features of the door hardware (i.e., handles that do not meet the accessibility needs of the individual) or any other obstacle that prevents an individual from exiting. 2. BEHAVIORAL HEALTH CRISIS EVENT. An event or situation that exceeds the individual\u2019s current resources and coping mechanisms that causes the individual to experience extreme disorganization of thought, hopelessness, sadness, confusion, panic or other emotional distress.  The event includes actions(s) by an individual that pose a danger to themselves or others and are unable to be mitigated without the assistance of law enforcement, mental health or medical services. Community-Based Crisis Response.  An event in which law enforcement or emergency services respond to and resolve without transport to another location for intake, assessment or treatment. Facility-Based Crisis Response.  An event in which law enforcement or emergency services respond to and an individual is transported to a psychiatric facility, including crisis facility, or the psychiatric department of an acute care hospital for evaluation or treatment that does not result in an admission. Immediate Arrest and Incarceration Crisis Response. An event in which law enforcement responds to a behavioral health crisis event and arrests, charges and incarcerates an individual without first obtaining a mental health evaluation/admission at a facility designated to provide such services. Psychiatric Hospitalization (involuntary). An involuntary inpatient admission to a psychiatric facility, including crisis facility, or the psychiatric department of an acute care hospital for evaluation or treatment. Psychiatric Hospitalization (voluntary). A voluntary inpatient admission to a psychiatric facility, including crisis facility, or the psychiatric department of an acute care hospital, for evaluation or treatment. 3. DEATH. All deaths are reportable. Deaths attributed to or suspected to have been the result of abuse or neglect require additional reporting in the appropriate corresponding category.  In addition, any critical incidents that are discovered during an investigation into a death require additional reporting in the appropriate corresponding category. Natural Causes \u2013 Services Provided.  Primarily attributed to a terminal illness or an internal malfunction of the body not directly influenced by external forces.  For example, a person who has been diagnosed with cancer, receives Hospice care or has a DNR order in place.  A death should be reported in this category if it occurs while an individual is enrolled in a Waiver program or ACAP (Adult Community Autism Program) or is receiving services in a provider operated setting. Unexpected \u2013 Services Provided. An unexpected death is primarily attributed to an external unexpected force acting upon the individual.  Deaths attributed to events such as car accidents, falls, homicide, choking and suicides would be considered unexpected.  A death should be reported in this category if it occurs while an individual is enrolled in a Waiver program or ACAP or is receiving services in a provider operated setting. Natural Causes \u2013 Only Supports Provided.  Primarily attributed to a terminal illness or an internal malfunction of the body not directly influenced by external forces.  For example, a person who 3 Revised 04/07/20; 03/19/21; 06/28/22; 08/01/22 has been diagnosed with cancer and is receiving hospice services or when a DRN order is in place. Unexpected \u2013 Only Supports Provided.  An unexpected death is primarily attributed to an external unexpected force acting upon the individual.  Deaths attributed to events such as car accidents, falls, homicide, choking and suicides would be considered unexpected. 4. EXPLOITATION. An act or course of conduct by a person against an individual or an individual\u2019s resources without informed consent or with consent obtained through misrepresentation, coercion, or threats of force, which results in monetary, personal or other benefit, gain or profit for the target, or monetary or personal loss to the individual. Exploitation should be reported regardless of the actual or perceived value of the loss. Failure to Obtain Informed Consent. An intentional act or course of conduct by a person which results in the misuse of an individual\u2019s consent or failure to obtain consent. Examples include, but are not limited to, signing on behalf of or coercing/deceiving an individual into applying for credit cards, signing contracts and signing loan documents, will and other items that relate to the personal property, money or identity of an individual. Material Resources. The illegal or improper act or process of a person using the material resources or possessions of an individual for his or her own personal benefit or gain.  This includes but is not limited to misusing or stealing an individual\u2019s possessions, soliciting gifts and coercing an individual to spend his or her funds for things he or she may not want or need, things for use by others or for the benefit of the household. Medical Responsibilities/Resources. An act or course of conduct of a person that results in an individual paying for medical care or items that are normally covered by insurance or other means.  This includes, but is not limited to: o Requiring an individual to pay for a medical appointment, procedure or equipment due to failure of the ISP team to provide support or resources to find a medical provider that accepts the individual\u2019s insurance or whose services are covered by other means. o Requiring an individual to pay for an appointment, procedure or equipment when there is a f
